<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Roxy Animate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Same light "liquid glass" chrome as index.html over a dark 3D viewport. Kept in sync
     by hand (single-file constraint — see docs/ORCHESTRATION.md §1) rather than shared. */
  --bg:#f3f4f6;--ink:#14161a;--muted:#6b7280;--faint:#9aa1ab;--line:rgba(0,0,0,.10);
  --panel:rgba(255,255,255,.86);--card:rgba(0,0,0,.045);--pink:#ff8fb1;--pink2:#ff6f9c;--pinkInk:#c2386a;--ok:#2f8f5b;--err:#d94b4b;
  --rail:64px;--side:320px;--bar:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Space Grotesk",system-ui,sans-serif;font-size:14px}
button{font-family:inherit;color:var(--ink);cursor:pointer;border:1px solid var(--line);background:var(--card);
  border-radius:10px;padding:9px 11px;font-size:13px;transition:background .14s,border-color .14s,transform .04s}
button:hover{background:rgba(0,0,0,.055)}button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--pink);color:#2a141d;border-color:transparent;font-weight:600}
button.pri:hover{background:#ffa3c0}
button.on{background:rgba(255,143,177,.18);border-color:rgba(255,143,177,.45);color:var(--pinkInk)}
input[type=range]{width:100%;accent-color:var(--pink)}
input[type=text],input[type=number],select{font-family:inherit;font-size:13px;color:var(--ink);background:rgba(0,0,0,.055);
  border:1px solid var(--line);border-radius:9px;padding:8px 9px;width:100%}
label.fld{display:block;font-size:11px;letter-spacing:.04em;color:var(--muted);margin:0 0 5px}
.tap-edit{cursor:pointer;border-bottom:1px dashed var(--faint);padding-bottom:1px}
.tap-edit:hover{color:var(--ink);border-bottom-color:var(--pink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px}
.muted{color:var(--muted)}.small{font-size:11.5px}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}

#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--rail) 1fr var(--side);grid-template-rows:var(--bar) 1fr;
  grid-template-areas:"bar bar bar" "rail stage panel";}
#bar{grid-area:bar;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(rgba(255,255,255,.82),rgba(244,245,247,.68));
  backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);z-index:5}
#bar .logo{font:600 14px/1 "Space Grotesk",sans-serif;letter-spacing:.08em;text-transform:uppercase}
#bar .vtitle{font-size:12px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
#bar .sp{flex:1}
#bar .act,#bar a.act{padding:7px 9px;font-size:12px}
#bar a.act{display:inline-flex;align-items:center;text-decoration:none;border:1px solid var(--line);background:var(--card);
  border-radius:10px;color:var(--ink)}

#rail{grid-area:rail;display:flex;flex-direction:column;gap:4px;padding:8px 6px;border-right:1px solid var(--line);background:var(--panel)}
#rail .tab{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;border-radius:12px;
  padding:9px 4px;color:var(--muted);font-size:9.5px;letter-spacing:.04em}
#rail .tab .ic{width:22px;height:22px;display:block}
#rail .tab.on{color:var(--ink);background:var(--card)}
#rail .tab.on .ic{filter:drop-shadow(0 0 6px rgba(255,143,177,.5))}

#stage{grid-area:stage;position:relative;overflow:hidden;-webkit-touch-callout:none;background:
  radial-gradient(120% 120% at 50% 20%, #1c1f25 0%, #12141a 60%, #0b0c0f 100%)}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.gl-slot{position:absolute;inset:0}
canvas{display:block;touch-action:none}

#panel{grid-area:panel;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
#panel h2{font:600 13px/1.1 "Space Grotesk";margin:0 0 2px}
#panel .sub{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.section-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:14px 0 8px}

#tabbar{display:none}
#navMask{display:none}
#sheetHandle{display:none}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(255,255,255,.86);border:1px solid rgba(0,0,0,.10);
  backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:0 8px 24px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.7);
  color:var(--ink);padding:9px 14px;border-radius:999px;font-size:12.5px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99;
  font-size:14px;color:var(--muted);text-align:center;padding:24px}

#zoomKnob{position:absolute;right:18px;top:100px;display:none;flex-direction:column;align-items:center;gap:3px;z-index:8;width:28px;
  padding:5px 0;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.10);
  backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:0 6px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.7)}
.zk-btn{width:26px;height:26px;border-radius:50%;background:transparent;border:none;color:rgba(20,22,26,.8);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;line-height:1;padding:0;font-family:inherit}
#zkSlider{writing-mode:vertical-lr;direction:rtl;width:26px;height:80px;cursor:ns-resize;accent-color:rgba(255,143,177,.8);touch-action:none}
#zoomKnob.on{display:flex}

#rotBall{position:absolute;right:12px;top:12px;width:80px;height:80px;cursor:grab;display:none;z-index:8;touch-action:none;border-radius:50%}

#emptyBanner{position:absolute;left:12px;right:98px;top:12px;z-index:8;display:none;
  padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.10);
  backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:0 6px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.7);font-size:12px;color:var(--ink)}
#emptyBanner.show{display:flex;align-items:center;gap:10px}
#emptyBanner button{padding:5px 9px;font-size:11px}

.scrubRange{width:100%;height:42px;touch-action:none;accent-color:var(--pink);cursor:ew-resize;margin:6px 0}

/* ---------- mobile ---------- */
@media (max-width:820px){
  :root{--side:0px;--bar:52px}
  #app{grid-template-columns:1fr;grid-template-rows:var(--bar) 1fr;grid-template-areas:"bar" "stage"}
  #rail{display:none}
  button{min-height:42px;font-size:13.5px}
  #bar{gap:6px;padding:0 8px}
  #bar .vtitle{display:none}
  #bar .act,#bar a.act{min-height:38px;padding:8px 10px}
  input[type=text],input[type=number],select{min-height:42px;font-size:14px}
  .zk-btn{width:32px;height:32px;min-height:32px;font-size:19px}
  #zoomKnob{width:34px}
  #zkSlider{width:32px;height:min(96px,max(24px,calc(100vh - 320px)))}
  #panel{position:fixed;left:8px;right:8px;bottom:calc(78px + env(safe-area-inset-bottom));top:auto;height:60vh;
    border:1px solid rgba(0,0,0,.10);border-radius:24px;
    background:linear-gradient(rgba(255,255,255,.82),rgba(247,248,249,.9));
    backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);
    transform:translateY(calc(100% - 48px));transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:20;
    box-shadow:0 18px 48px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.8)}
  #panel.open{transform:translateY(0)}
  #sheetHandle{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;margin:-6px -14px 6px;cursor:grab;touch-action:none}
  #sheetHandle .bar{width:48px;height:5px;border-radius:99px;background:var(--faint)}
  #sheetHandle .lbl{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  #navMask{display:block;position:fixed;left:0;right:0;bottom:0;height:calc(78px + env(safe-area-inset-bottom));
    background:var(--bg);z-index:25;pointer-events:none}
  #tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));height:62px;
    border:1px solid rgba(0,0,0,.10);border-radius:26px;padding:0 4px;
    background:linear-gradient(rgba(255,255,255,.85),rgba(248,249,250,.92));
    backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);
    box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.8);z-index:30}
  #tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;
    border:none;color:var(--muted);font-size:9.5px;letter-spacing:.03em;margin:6px 2px;border-radius:20px;
    transition:background .18s,color .18s}
  #tabbar .tab .ic{width:21px;height:21px}
  #tabbar .tab.on{color:var(--pinkInk);background:rgba(255,143,177,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom))}
  #emptyBanner{right:12px;top:8px}
}
@media (max-width:820px){ .desktop-only{display:none} }
@media (min-width:821px){ .mobile-only{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="boot">loading studio…</div>

<div id="app" aria-hidden="false">
  <header id="bar">
    <span class="logo">ROXY ANIMATE</span>
    <span class="vtitle" id="vtitle">Pose</span>
    <span class="sp"></span>
    <button class="act" id="btnImportProj" title="Import a project.json exported from the modeler">Import</button>
    <a class="act" href="index.html" title="Back to the modeling suite">◀ Modeler</a>
  </header>

  <nav id="rail"></nav>

  <main id="stage">
    <section class="view on" data-view="pose"><div class="gl-slot" id="slot-pose"></div></section>
    <section class="view" data-view="timeline"><div class="gl-slot" id="slot-timeline"></div></section>
    <section class="view" data-view="export"></section>
    <canvas id="rotBall" width="80" height="80" role="img" aria-label="Orbit gizmo — drag to rotate the view"></canvas>
    <div id="zoomKnob">
      <button class="zk-btn" id="zkIn" title="Zoom in">+</button>
      <input id="zkSlider" type="range" min="1" max="100" value="50">
      <button class="zk-btn" id="zkOut" title="Zoom out">−</button>
    </div>
    <div id="emptyBanner">
      <span>No modeling-suite autosave found — loaded a demo figure. Import a project.json or build one in the Modeler.</span>
      <button id="emptyBannerClose">✕</button>
    </div>
  </main>

  <aside id="panel">
    <div id="sheetHandle"><span class="bar"></span><span class="lbl" id="sheetLbl">Tools</span></div>
    <div id="panelBody"></div>
  </aside>

  <div id="navMask"></div>
  <nav id="tabbar"></nav>
</div>

<input type="file" id="fileProj" accept=".json" style="display:none">
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
 onerror="document.getElementById('boot').textContent='Could not load Three.js (CDN blocked). Open this file in a normal browser tab.'"></script>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var boot=$('#boot');
if(typeof THREE==='undefined'){boot.textContent='Three.js failed to load.';return;}
function el(t,a,kids){var n=document.createElement(t);a=a||{};for(var k in a){if(k==='class')n.className=a[k];
  else if(k==='html')n.innerHTML=a[k];else if(k==='text')n.textContent=a[k];else if(k.slice(0,2)==='on')n.addEventListener(k.slice(2).toLowerCase(),a[k]);
  else n.setAttribute(k,a[k]);}(kids||[]).forEach(function(c){if(c==null)return;n.appendChild(typeof c==='string'?document.createTextNode(c):c);});return n;}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},1800);}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function icon(p){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var ICONS={
 pose:'<circle cx="12" cy="5" r="2"/><path d="M12 7v6M12 13l-4 6M12 13l4 6M8 10h8"/>',
 timeline:'<path d="M4 12h16"/><circle cx="8" cy="12" r="2.2"/><circle cx="17" cy="12" r="2.2"/>',
 export:'<path d="M12 3v12"/><path d="M7 9l5 5 5-5"/><path d="M4 19h16"/>'
};
var VIEWS=[['pose','Pose'],['timeline','Timeline'],['export','Export']];

/* ---------------- renderer (matches index.html: ACESFilmic, sRGB, on-demand render) ---------------- */
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var pmrem=new THREE.PMREMGenerator(renderer);
var dom=renderer.domElement;

/* ---------------- env / ground / lights (same "Night Blue" preset + approach as index.html) ---------------- */
function buildNightEnvTex(){var c=el('canvas');c.width=1024;c.height=512;var g=c.getContext('2d');
  var gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#48618f');gr.addColorStop(.5,'#1b2740');gr.addColorStop(1,'#05070d');
  g.fillStyle=gr;g.fillRect(0,0,1024,512);
  [[300,140,200,.6],[760,160,160,.4]].forEach(function(cd){var rg=g.createRadialGradient(cd[0],cd[1],0,cd[0],cd[1],cd[2]);
    rg.addColorStop(0,'rgba(255,255,255,'+cd[3]+')');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.beginPath();g.arc(cd[0],cd[1],cd[2],0,7);g.fill();});
  var t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
  var env=pmrem.fromEquirectangular(t).texture;t.dispose();return env;}
function applyNightEnv(scene){scene.environment=buildNightEnvTex();scene.background=new THREE.Color('#06080f');}
function studioLights(scene){
  var k=new THREE.DirectionalLight(0xfff0db,2.0);k.position.set(3.2,5,2.4);k.castShadow=true;
  k.shadow.mapSize.set(2048,2048);k.shadow.camera.near=.5;k.shadow.camera.far=20;
  k.shadow.camera.left=-5;k.shadow.camera.right=5;k.shadow.camera.top=5;k.shadow.camera.bottom=-5;k.shadow.bias=-.0004;k.shadow.radius=6;
  scene.add(k);var r=new THREE.DirectionalLight(0xa9c2ff,.6);r.position.set(-3,2.2,-3.4);scene.add(r);
  scene.add(new THREE.HemisphereLight(0xfff3e6,0x2a1d12,.22));}
function addGround(scene){var g=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:.32}));
  g.rotation.x=-Math.PI/2;g.position.y=-0.001;g.receiveShadow=true;scene.add(g);
  var grid=new THREE.GridHelper(20,20,0x767c85,0x33383f);grid.position.y=0;scene.add(grid);}

var poseScene=new THREE.Scene();studioLights(poseScene);applyNightEnv(poseScene);addGround(poseScene);
poseScene.userData.modelHolder=new THREE.Group();poseScene.add(poseScene.userData.modelHolder);
poseScene.userData.armatureHolder=new THREE.Group();poseScene.add(poseScene.userData.armatureHolder);

/* ---------------- camera + orbit (single shared view — Pose and Timeline show the same scene) ---------------- */
function mkCam(){return new THREE.PerspectiveCamera(40,1,.05,500);}
var vs={th:.7,ph:1.0,rad:4,tx:0,ty:1,tz:0,cam:mkCam()};
var active={view:'pose'};

var renderFrames=8;function invalidate(n){renderFrames=Math.max(renderFrames,n||4);}

function frameObject(obj,v){var box=new THREE.Box3().setFromObject(obj);if(box.isEmpty())return;var s=new THREE.Vector3();box.getSize(s);
  var c=new THREE.Vector3();box.getCenter(c);var r=Math.max(s.x,s.y,s.z)*0.5||1;v.tx=c.x;v.ty=c.y;v.tz=c.z;v.rad=r*3.2;}

/* ---------------- pointer handling: drag orbit, pinch-zoom, two-finger pan, tap-select, double-tap-frame ---------------- */
var ptrs=new Map(),lastDist=0,lastMid=null,clickStart=null,lastTap=null;
dom.addEventListener('pointerdown',function(e){
  // Armature Edit/Pose modes hijack the pointer BEFORE the general orbit/tap machinery below —
  // same precedence pattern as index.html's Gizmo-hit-test-first. See the Armature section
  // (Arm/hitJoint/hitBoneMesh/jointDrag/poseDrag) for the full picture.
  if(active.view==='pose'&&Arm.mode==='edit'&&!Arm.chainActive&&!Arm.parentPickActive){
    var hj=hitJoint(e);
    if(hj){dom.setPointerCapture(e.pointerId);jointDrag={be:hj.be,which:hj.which,ptId:e.pointerId,px:e.clientX,py:e.clientY};invalidate();return;}
  }
  if(active.view==='pose'&&Arm.mode==='pose'&&Arm.ikOn){
    // IK armed: an IK-handle drag takes precedence over selecting a new chain tip,
    // which itself takes precedence over the plain-FK poseDrag below (see ikSelectTip).
    var hik=hitIkHandle(e);
    if(hik){dom.setPointerCapture(e.pointerId);ikDrag={which:hik,ptId:e.pointerId,px:e.clientX,py:e.clientY};invalidate();return;}
    var hb2=hitBoneMesh(e);
    if(hb2){dom.setPointerCapture(e.pointerId);selectBone(hb2.rig,hb2.id);ikSelectTip(hb2.rig,hb2.id);renderPanel();invalidate();return;}
  }
  if(active.view==='pose'&&Arm.mode==='pose'&&!Arm.ikOn){
    var hb=hitBoneMesh(e);
    if(hb){dom.setPointerCapture(e.pointerId);selectBone(hb.rig,hb.id);
      poseDrag={be:hb.be,px:e.clientX,py:e.clientY,ptId:e.pointerId};renderPanel();invalidate();return;}
  }
  dom.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  clickStart={x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId};invalidate();});
dom.addEventListener('pointermove',function(e){
  if(jointDrag&&jointDrag.ptId===e.pointerId){dragJointMove(e);return;}
  if(ikDrag&&ikDrag.ptId===e.pointerId){dragIkMove(e);return;}
  if(poseDrag&&poseDrag.ptId===e.pointerId){dragPoseMove(e);return;}
  var p=ptrs.get(e.pointerId);if(!p)return;
  var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){
    vs.th+=dx*.005;vs.ph=clamp(vs.ph-dy*.005,.1,1.5);
    if(clickStart&&Math.hypot(e.clientX-clickStart.x,e.clientY-clickStart.y)>6)clickStart=null;}
  else if(ptrs.size===2){
    var v=Array.from(ptrs.values());var d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);var mid={x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2};
    if(lastDist)vs.rad=clamp(vs.rad*(lastDist/d),.6,60);lastDist=d;
    if(lastMid){var sp=Math.sin(vs.ph);var rightx=Math.cos(vs.th+Math.PI/2),rightz=Math.sin(vs.th+Math.PI/2);var k=vs.rad*.0016;
      vs.tx+=(mid.x-lastMid.x)*k*rightx;vs.tz+=(mid.x-lastMid.x)*k*rightz;vs.ty+=(mid.y-lastMid.y)*k;}
    lastMid=mid;clickStart=null;}
  invalidate();});
function endPtr(e){
  if(jointDrag&&jointDrag.ptId===e.pointerId){jointDrag=null;invalidate();return;}
  if(ikDrag&&ikDrag.ptId===e.pointerId){ikDrag=null;invalidate();return;} // release: solved pose simply stays (bone quats), target handle stays too
  if(poseDrag&&poseDrag.ptId===e.pointerId){poseDrag=null;invalidate();return;}
  ptrs.delete(e.pointerId);lastDist=0;lastMid=null;
  if(clickStart&&clickStart.id===e.pointerId&&Date.now()-clickStart.t<350&&Math.hypot(e.clientX-clickStart.x,e.clientY-clickStart.y)<6){
    var now=Date.now();
    if(lastTap&&now-lastTap.t<350&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<40){frameCurrent();toast('Framed');lastTap=null;}
    else{onViewportTap(e);lastTap={x:e.clientX,y:e.clientY,t:now};}}
  clickStart=null;}
dom.addEventListener('pointerup',endPtr);dom.addEventListener('pointercancel',endPtr);
dom.addEventListener('wheel',function(e){e.preventDefault();vs.rad=clamp(vs.rad*(1+e.deltaY*.0012),.6,60);syncZoomKnob();invalidate();},{passive:false});
function onViewportTap(e){if(active.view!=='pose'&&active.view!=='timeline')return;
  if(active.view==='pose'&&Arm.mode==='edit'){
    if(Arm.chainActive){chainExtendTap(e);return;}
    if(Arm.parentPickActive){parentPickTap(e);return;}
  }
  if(active.view==='pose'){
    var hb=hitBoneMesh(e);
    if(hb){selectBone(hb.rig,hb.id);renderPanel();toast('Selected bone '+hb.name);return;}
  }
  var r=dom.getBoundingClientRect();
  var mx=((e.clientX-r.left)/r.width)*2-1,my=-((e.clientY-r.top)/r.height)*2+1;
  var ray=new THREE.Raycaster();ray.setFromCamera({x:mx,y:my},vs.cam);
  var hit=ray.intersectObjects(poseScene.userData.modelHolder.children,true)[0];
  if(hit){var o=hit.object;while(o&&!o.userData.targetId)o=o.parent;
    if(o&&o.userData.targetId){state.selTarget=o.userData.targetId;renderPanel();toast('Selected '+o.userData.targetId);}}}

function updateCam(){var sp=Math.sin(vs.ph);
  vs.cam.position.set(vs.tx+vs.rad*sp*Math.cos(vs.th),vs.ty+vs.rad*Math.cos(vs.ph),vs.tz+vs.rad*sp*Math.sin(vs.th));vs.cam.lookAt(vs.tx,vs.ty,vs.tz);}
function curSlot(){if(active.view==='export')return null;return $('#slot-'+active.view);}

  renderer.setSize(r.width,r.height);vs.cam.aspect=r.width/r.height;vs.cam.updateProjectionMatrix();}

/* ---------------- RotBall orbit gizmo (same math as index.html, scoped to the single `vs`) ---------------- */
var RotBall={el:null,ctx:null,_px:null,_py:null,
  init:function(){this.el=$('#rotBall');if(!this.el)return;this.ctx=this.el.getContext('2d');var self=this;
    this.el.addEventListener('pointerdown',function(e){e.stopPropagation();self.el.setPointerCapture(e.pointerId);self._px=e.clientX;self._py=e.clientY;});
    this.el.addEventListener('pointermove',function(e){if(self._px==null)return;var dx=e.clientX-self._px,dy=e.clientY-self._py;self._px=e.clientX;self._py=e.clientY;
      vs.th+=dx*.013;vs.ph=clamp(vs.ph-dy*.013,.1,1.5);updateCam();self.draw();invalidate();});
    this.el.addEventListener('pointerup',function(){self._px=self._py=null;});
    this.el.addEventListener('pointercancel',function(){self._px=self._py=null;});},
  show:function(v){if(this.el)this.el.style.display=v?'block':'none';},
  draw:function(){
    if(!this.el||!this.ctx)return;var c=this.ctx,S=80,cx=40,cy=40,R=34;
    c.clearRect(0,0,S,S);
    c.fillStyle='rgba(255,255,255,.78)';c.beginPath();c.arc(cx,cy,R,0,Math.PI*2);c.fill();
    c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=1;c.beginPath();c.arc(cx,cy,R,0,Math.PI*2);c.stroke();
    var cam=vs.cam;
    var items=[
      {dir:new THREE.Vector3().setFromMatrixColumn(cam.matrix,0),l:'X',fc:'#ff6b78',bc:'#f0c9ce'},
      {dir:new THREE.Vector3().setFromMatrixColumn(cam.matrix,1),l:'Y',fc:'#3fae72',bc:'#cfe9d8'},
      {dir:new THREE.Vector3().setFromMatrixColumn(cam.matrix,2).negate(),l:'Z',fc:'#2a8fd6',bc:'#cfe3f5'}
    ].map(function(a){return {x:cx+a.dir.x*(R-12),y:cy-a.dir.y*(R-12),z:a.dir.z,l:a.l,fc:a.fc,bc:a.bc};});
    items.slice().sort(function(a,b){return a.z-b.z;}).forEach(function(it){
      var front=it.z>=0,col=front?it.fc:it.bc,r=front?6:4;
      c.strokeStyle=col;c.lineWidth=front?2.5:1.5;
      c.beginPath();c.moveTo(cx,cy);c.lineTo(it.x,it.y);c.stroke();
      c.fillStyle=col;c.beginPath();c.arc(it.x,it.y,r,0,Math.PI*2);c.fill();
      if(front){c.fillStyle='rgba(0,0,0,.8)';c.font='bold 9px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(it.l,it.x,it.y);}});}};

/* ═══════════════════════════════════════════════════════
   MODEL SYSTEM + BRIDGE (reads/writes the same project-JSON
   shape and AUTOSAVE_KEY as index.html — see buildProjectData/
   loadProject there. Deform modifiers are NOT re-applied here;
   this scaffold consumes each part's baked base geometry only.)
   ═══════════════════════════════════════════════════════ */
var AUTOSAVE_KEY='roxyAutosave'; // same key index.html autosaves the modeling project under
var state={models:[],activeId:null,selTarget:null};
var idc=1;function uid(){return 'm'+(idc++);}
var Registry={}; // targetId -> live THREE.Object3D, the whole animation system resolves against this
function registerTarget(id,obj){Registry[id]=obj;if(obj&&obj.userData)obj.userData.targetId=id;} // Wave C4: constraint objects are plain JS records with no userData — guard rather than crash
function resolveTarget(id){return Registry[id];}

function clearModels(){var h=poseScene.userData.modelHolder;while(h.children.length)h.remove(h.children[0]);
  state.models.length=0;state.activeId=null;state.selTarget=null;
  // clear in place (not a reassign) so outstanding refs stay live — but never touch entries the
  // Armature/Rig system owns (RigTargetIds), so rigs survive a model bridge/reload/demo-rebuild.
  for(var k in Registry)if(!RigTargetIds[k])delete Registry[k];}

function partsToModel(md){
  var grp=new THREE.Group();grp.name=md.name||'Model';
  (md.parts||[]).forEach(function(pp){
    var g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pp.pos||[],3));
    if(pp.uv)g.setAttribute('uv',new THREE.Float32BufferAttribute(pp.uv,2));
    if(pp.index)g.setIndex(pp.index);
    g.computeVertexNormals();
    var mat=new THREE.MeshPhysicalMaterial({color:pp.color?new THREE.Color(pp.color).getHex():0xcfcfcf,
      roughness:pp.rough!=null?pp.rough:.65,metalness:pp.metal||0,envMapIntensity:1});
    if(pp.emissive)mat.emissive.set(pp.emissive);
    if(pp.emInt!=null)mat.emissiveIntensity=pp.emInt;
    if(pp.opacity!=null)mat.opacity=pp.opacity;
    if(pp.transmission&&'transmission' in mat)mat.transmission=pp.transmission;
    if(pp.clearcoat&&'clearcoat' in mat)mat.clearcoat=pp.clearcoat;
    mat.transparent=(mat.opacity<1)||(mat.transmission>0);
    if(pp.map){var im=new Image();im.onload=function(){var tx=new THREE.Texture(im);tx.encoding=THREE.sRGBEncoding;tx.needsUpdate=true;
      mat.map=tx;mat.color.setHex(0xffffff);mat.needsUpdate=true;invalidate();};im.src=pp.map;}
    var mesh=new THREE.Mesh(g,mat);mesh.castShadow=true;mesh.receiveShadow=true;
    // Wave C2: carry the modeler's vertex groups through so bindMeshToRig can use them as
    // explicit skin weights (see the Skinning section below) — {name,w:{vertIndex:weight}}[],
    // sparse, indexed exactly like `pp.pos`/g.attributes.position (see index.html _exportVGroups).
    mesh.userData.vgroups=pp.vgroups||null;
    grp.add(mesh);});
  return grp;}

function loadProjectData(data){
  if(!data||!data.models||!data.models.length)return false;
  clearModels();
  data.models.forEach(function(md){
    var grp=partsToModel(md);
    poseScene.userData.modelHolder.add(grp);
    state.models.push(grp);
    var gid=md.id||uid();
    registerTarget(gid,grp);
    grp.children.forEach(function(mesh,i){registerTarget(gid+'.part'+i,mesh);});});
  state.activeId=state.models[0].userData.targetId;
  state.selTarget=state.activeId;
  frameObject(poseScene.userData.modelHolder,vs);
  invalidate();return true;}

function bridgeLoadModelProject(){
  var raw;try{raw=localStorage.getItem(AUTOSAVE_KEY);}catch(e){return false;}
  if(!raw)return false;
  var data;try{data=JSON.parse(raw);}catch(e){return false;}
  return loadProjectData(data);}

/* built-in demo figure: a simple multi-part primitive humanoid so every later wave
