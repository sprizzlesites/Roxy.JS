 buildRows:function(){
  var rows=[],groups=[],byTid={},self=this;
  Anim.tracks.forEach(function(tr){if(!tr.keys.length)return;
   var g=byTid[tr.targetId];
   if(!g){g={tid:tr.targetId,tracks:[]};byTid[tr.targetId]=g;groups.push(g);}
   g.tracks.push(tr);});
  var y=this.rulerH;
  groups.forEach(function(g){
   rows.push({kind:'group',tid:g.tid,tracks:g.tracks,y:y,label:dopeGroupLabel(g.tid)});y+=self.rowH;
   if(!self.collapsed[g.tid])g.tracks.forEach(function(tr){
    rows.push({kind:'track',tid:g.tid,track:tr,y:y,label:tr.path});y+=self.rowH;});});
  this.rows=rows;return rows;},
 rowAt:function(y){var i=Math.floor((y-this.rulerH)/this.rowH);
  return (i>=0&&i<this.rows.length)?this.rows[i]:null;},
 hitTest:function(x,y){
  if(y<this.rulerH)return x>=this.labelW?{kind:'ruler'}:{kind:'empty'};
  var row=this.rowAt(y);
  if(!row)return {kind:'empty'};
  if(x<this.labelW)return {kind:row.kind==='group'?'grouplabel':'tracklabel',row:row};
  var self=this,bestT=null,bd=18; // 18px slop each side + the full 36px row height => >=36px effective target
  var times=row.kind==='track'?row.track.keys.map(function(k){return k.t;}):dopeGroupTimes(row);
  times.forEach(function(t){var d=Math.abs(self.timeToX(t)-x);if(d<bd){bd=d;bestT=t;}});
  if(bestT!=null)return row.kind==='track'
    ?{kind:'key',row:row,track:row.track,t:bestT}
    :{kind:'groupkey',row:row,t:bestT};
  return {kind:'empty',row:row};},

 /* ---- selection ---- */
 isSel:function(trackId,t){return this.sel.some(function(s){return s.trackId===trackId&&Math.abs(s.t-t)<1e-6;});},
 selectOnly:function(list){this.sel=list.slice();},
 clearSel:function(){this.sel=[];},
 selKeys:function(){var out=[];this.sel.forEach(function(s){var tr=trackById(s.trackId);if(!tr)return;
  var i=keyIndexAt(tr,s.t);if(i>=0)out.push({tr:tr,key:tr.keys[i]});});return out;},
 _hitKeyList:function(hit){ // the concrete keys a key/groupkey hit refers to
  if(hit.kind==='key')return [{trackId:hit.track.id,t:hit.t}];
  var out=[];hit.row.tracks.forEach(function(tr){if(keyIndexAt(tr,hit.t)>=0)out.push({trackId:tr.id,t:hit.t});});
  return out;},

 /* ---- edits (all undoable, all flow through Anim.tracks + resample) ---- */
 _afterEdit:function(){Anim.sample(Anim.time);scheduleAnimAutosave();invalidate();this.draw();renderDopeActions();},
 deleteSel:function(){var sk=this.selKeys();if(!sk.length)return;
  pushKeyUndo();
  sk.forEach(function(s){var i=s.tr.keys.indexOf(s.key);if(i>=0)s.tr.keys.splice(i,1);});

   if(i>=0)s.tr.keys[i]=copy;else{s.tr.keys.push(copy);s.tr.keys.sort(function(a,b){return a.t-b.t;});}

  var i=keyIndexAt(s.tr,nt);if(i>=0)s.tr.keys.splice(i,1); // typing onto an occupied frame replaces that key

 /* ---- pointer interaction ---- */
 _cancelLong:function(){if(this._longT){clearTimeout(this._longT);this._longT=null;}},
 _scrubTo:function(x){var t=clamp(Math.round(this.xToTime(x)),Anim.start,Anim.end);
  if(t!==Anim.time){Anim.time=t;Anim.sample(t);syncScrubUI();invalidate();}else this.draw();},
 _down:function(e){
  e.preventDefault();
  try{this.canvas.setPointerCapture(e.pointerId);}catch(err){} // synthetic test pointers can't be captured
  var x=this._ex(e),y=this._ey(e);
  this._ptrs.set(e.pointerId,{x:x,y:y});
  if(this._ptrs.size===2){ // second finger: pinch-zoom takes over, whatever the first was doing
   this._cancelLong();this._drag=null;this.box=null;
   var v=Array.from(this._ptrs.values());
   this._pinch={d:Math.max(8,Math.abs(v[0].x-v[1].x)),mx:(v[0].x+v[1].x)/2};
   return;}
  if(this._ptrs.size>2)return;
  var hit=this.hitTest(x,y),self=this;
  this._drag={id:e.pointerId,sx:x,sy:y,px:x,hit:hit,moved:false,df:0,undoPushed:false,mode:'tap'};
  if(hit.kind==='ruler'){this._drag.mode='scrub';this._scrubTo(x);}
  else if(hit.kind==='key'||hit.kind==='groupkey'){
   this._drag.mode='key';
   var list=this._hitKeyList(hit);
   this._drag.prevSel=this.sel.slice();
   if(!list.every(function(s){return self.isSel(s.trackId,s.t);}))this.selectOnly(list); // tapping an already-selected key keeps the multi-selection for a group drag
   this._drag.orig=this.selKeys().map(function(sk){return {tr:sk.tr,key:sk.key,ot:sk.key.t};});
   this._longT=setTimeout(function(){self._longPress();},480);
   this.draw();renderDopeActions();}
  else if(hit.kind==='grouplabel'||hit.kind==='tracklabel'){this._drag.mode='tap';}
  else{this._drag.mode=this.boxMode?'box':'pan';
   if(this._drag.mode==='box')this.box={x0:x,y0:y,x1:x,y1:y};}},
 _longPress:function(){ // long-press a key: ADD it to the previous selection instead of replacing it
  this._longT=null;var d=this._drag;if(!d||d.mode!=='key'||d.moved)return;
  var union=d.prevSel.slice();
  this.sel.forEach(function(s){if(!union.some(function(u){return u.trackId===s.trackId&&Math.abs(u.t-s.t)<1e-6;}))union.push(s);});
  this.sel=union;
  d.orig=this.selKeys().map(function(sk){return {tr:sk.tr,key:sk.key,ot:sk.key.t};});
  toast(this.sel.length+' key'+(this.sel.length===1?'':'s')+' selected');
  this.draw();renderDopeActions();},
 _move:function(e){
  var p=this._ptrs.get(e.pointerId);if(!p)return;
  var x=this._ex(e),y=this._ey(e);p.x=x;p.y=y;
  if(this._ptrs.size===2&&this._pinch){
   var v=Array.from(this._ptrs.values());
   var d=Math.max(8,Math.abs(v[0].x-v[1].x)),mx=(v[0].x+v[1].x)/2;
   this.zoomAt(mx,d/this._pinch.d);
   this.t0-=(mx-this._pinch.mx)/this.pxf;this.clampView(); // two-finger drag also pans
   this._pinch.d=d;this._pinch.mx=mx;this.draw();return;}
  var dg=this._drag;if(!dg||dg.id!==e.pointerId)return;
  var dx=x-dg.sx,dy=y-dg.sy;
  if(!dg.moved&&Math.hypot(dx,dy)>6){dg.moved=true;this._cancelLong();}
  if(dg.mode==='scrub'){this._scrubTo(x);return;}
  if(dg.mode==='pan'){if(dg.moved){this.t0-=(x-dg.px)/this.pxf;this.clampView();this.draw();}dg.px=x;return;}
  if(dg.mode==='box'){if(this.box){this.box.x1=x;this.box.y1=y;this.draw();}return;}
  if(dg.mode==='key'&&dg.moved){
   var df=Math.round(dx/this.pxf); // snap to whole frames
   var minOt=Infinity;dg.orig.forEach(function(o){if(o.ot<minOt)minOt=o.ot;});
   df=Math.max(df,Math.ceil(-minOt)); // no selected key may cross into negative time
   if(df!==dg.df){
    if(!dg.undoPushed){pushKeyUndo();dg.undoPushed=true;} // one undo snapshot per drag (keys still at original times here)
    dg.df=df;
    dg.orig.forEach(function(o){o.key.t=o.ot+df;});
    var seen={};dg.orig.forEach(function(o){if(!seen[o.tr.id]){seen[o.tr.id]=1;o.tr.keys.sort(function(a,b){return a.t-b.t;});}});
    this.sel=dg.orig.map(function(o){return {trackId:o.tr.id,t:o.key.t};});
    Anim.sample(Anim.time);invalidate();this.draw();renderDopeActions();} // live preview
   return;}},
 _up:function(e,cancelled){
  this._ptrs.delete(e.pointerId);
  if(this._ptrs.size<2)this._pinch=null;
  var dg=this._drag;if(!dg||dg.id!==e.pointerId)return;
  this._cancelLong();this._drag=null;
  if(dg.mode==='box'&&this.box){
   var b=this.box;this.box=null;
   if(Math.abs(b.x1-b.x0)>6||Math.abs(b.y1-b.y0)>6)this._boxSelect(b);
   else if(!cancelled&&this.sel.length)this.clearSel(); // tiny box = tap on empty: clear
   this.draw();renderDopeActions();return;}
  if(dg.mode==='key'){
   if(dg.moved&&dg.df!==0){scheduleAnimAutosave();
    toast('Moved '+dg.orig.length+' key'+(dg.orig.length===1?'':'s')+' '+(dg.df>0?'+':'')+dg.df+' frame'+(Math.abs(dg.df)===1?'':'s'));}
   this.draw();renderDopeActions();return;}
  if(!dg.moved&&!cancelled)this._tap(dg);},
 _tap:function(dg){var hit=dg.hit;
  if(hit.kind==='grouplabel'){this.collapsed[hit.row.tid]=!this.collapsed[hit.row.tid];this.draw();return;}
  if(hit.kind==='empty'||hit.kind==='tracklabel'){
   if(this.sel.length){this.clearSel();renderDopeActions();}this.draw();}},
 _boxSelect:function(b){
  var x0=Math.min(b.x0,b.x1),x1=Math.max(b.x0,b.x1),y0=Math.min(b.y0,b.y1),y1=Math.max(b.y0,b.y1);
  var self=this,added=0;
  this.rows.forEach(function(row){
   if(row.kind!=='track')return;
   var cy=row.y+self.rowH/2;if(cy<y0||cy>y1)return;
   row.track.keys.forEach(function(k){var kx=self.timeToX(k.t);
    if(kx>=x0-6&&kx<=x1+6&&!self.isSel(row.track.id,k.t)){self.sel.push({trackId:row.track.id,t:k.t});added++;}});});
  if(added)toast(this.sel.length+' keys selected');},

 /* ---- rendering ---- */
 draw:function(){
  var cv=this.canvas;if(!cv||!cv.isConnected)return;
  var rows=this.buildRows();
  var w=cv.clientWidth||320;
  var h=this.rulerH+Math.max(2,rows.length)*this.rowH+6;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  if(cv.style.height!==h+'px')cv.style.height=h+'px';
  this.cssW=w;this.cssH=h;
  if(!this.pxf)this.fitAll();
  this.clampView();
  var c=this.ctx,self=this;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle='#fbfbfc';c.fillRect(0,0,w,h);
  // row bands + labels
  c.textBaseline='middle';c.textAlign='left';
  rows.forEach(function(row){
   if(row.kind==='group'){c.fillStyle='rgba(0,0,0,.05)';c.fillRect(0,row.y,w,self.rowH);}
   c.strokeStyle='rgba(0,0,0,.07)';c.lineWidth=1;
   c.beginPath();c.moveTo(0,row.y+self.rowH+.5);c.lineTo(w,row.y+self.rowH+.5);c.stroke();
   c.save();c.beginPath();c.rect(0,row.y,self.labelW-4,self.rowH);c.clip();
   c.fillStyle=row.kind==='group'?'#14161a':'#6b7280';
   c.font=(row.kind==='group'?'600 ':'')+'11px "Space Grotesk",system-ui,sans-serif';
   var lx=8;
   if(row.kind==='group'){c.fillText(self.collapsed[row.tid]?'▸':'▾',5,row.y+self.rowH/2);lx=18;}
   else lx=16;
   c.fillText(row.label,lx,row.y+self.rowH/2);
   c.restore();});
  if(!rows.length){c.fillStyle='#9aa1ab';c.font='11.5px "Space Grotesk",system-ui,sans-serif';
   c.fillText('No keys yet — key something below.',this.labelW+10,this.rulerH+this.rowH);}
  // sheet area (clipped): range shading, ruler, grid, diamonds, playhead, marquee
  c.save();c.beginPath();c.rect(this.labelW,0,w-this.labelW,h);c.clip();
  var xs=this.timeToX(Anim.start),xe=this.timeToX(Anim.end);
  c.fillStyle='rgba(0,0,0,.045)';
  if(xs>this.labelW)c.fillRect(this.labelW,0,xs-this.labelW,h);
  if(xe<w)c.fillRect(xe,0,w-xe,h);
  c.fillStyle='rgba(0,0,0,.045)';c.fillRect(this.labelW,0,w-this.labelW,this.rulerH);
  var step=rulerStep(this.pxf,Anim.fps),tFirst=Math.ceil(this.xToTime(this.labelW)/step)*step;
  c.font='10px "Space Grotesk",system-ui,sans-serif';c.textAlign='center';
  for(var t=tFirst;this.timeToX(t)<w+step*this.pxf;t+=step){
   var gx=this.timeToX(t);
   c.strokeStyle='rgba(0,0,0,.08)';c.beginPath();c.moveTo(gx+.5,this.rulerH);c.lineTo(gx+.5,h);c.stroke();
   c.fillStyle='#6b7280';c.fillText(''+t,gx,this.rulerH/2);}
  c.strokeStyle='rgba(0,0,0,.14)';c.beginPath();c.moveTo(this.labelW,this.rulerH+.5);c.lineTo(w,this.rulerH+.5);c.stroke();
  rows.forEach(function(row){
   var cy=row.y+self.rowH/2;
   if(row.kind==='group'){
    dopeGroupTimes(row).forEach(function(t){
     var x=self.timeToX(t);if(x<self.labelW-8||x>w+8)return;
     var any=false,all=true;
     row.tracks.forEach(function(tr){if(keyIndexAt(tr,t)>=0){if(self.isSel(tr.id,t))any=true;else all=false;}});
     var s=any&&all;
     diamondPath(c,x,cy,s?6.5:5);
     c.fillStyle=s?'#ff6f9c':'#9aa1ab';c.fill();
     c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;c.stroke();});
   }else{
    row.track.keys.forEach(function(k){
     var x=self.timeToX(k.t);if(x<self.labelW-8||x>w+8)return;
     var s=self.isSel(row.track.id,k.t);
     diamondPath(c,x,cy,s?8:6);
     c.fillStyle=s?'#ff6f9c':'#8a93a3';c.fill();
     c.strokeStyle=s?'#c2386a':'rgba(0,0,0,.4)';c.lineWidth=s?1.6:1;c.stroke();});}});
  var phx=this.timeToX(Anim.time);
  if(phx>=this.labelW-1){
   c.strokeStyle='#ff6f9c';c.lineWidth=2;c.beginPath();c.moveTo(phx,3);c.lineTo(phx,h);c.stroke();
   c.fillStyle='#ff6f9c';c.beginPath();c.moveTo(phx-5,1);c.lineTo(phx+5,1);c.lineTo(phx,10);c.closePath();c.fill();}
  if(this.box){var bx=Math.min(this.box.x0,this.box.x1),by=Math.min(this.box.y0,this.box.y1),
   bw=Math.abs(this.box.x1-this.box.x0),bh=Math.abs(this.box.y1-this.box.y0);
   c.fillStyle='rgba(255,111,156,.14)';c.fillRect(bx,by,bw,bh);
   c.strokeStyle='#ff6f9c';c.lineWidth=1;c.strokeRect(bx+.5,by+.5,bw,bh);}
  c.restore();
  c.strokeStyle='rgba(0,0,0,.14)';c.beginPath();c.moveTo(this.labelW+.5,0);c.lineTo(this.labelW+.5,h);c.stroke();}
};

/* Selected-key action bar (DOM, under the canvas): value/frame tap-to-type via prompt()
   (the slider() convention), Duplicate, Delete, Box Select toggle, Undo. Rebuilt in place so
   mid-gesture canvas state survives. */
function renderDopeActions(){
 var bar=$('#dopeActions');if(!bar)return;bar.innerHTML='';
 var sk=Dope.selKeys();
 var row=el('div',{style:'display:flex;flex-wrap:wrap;gap:6px;align-items:center'});
 if(!sk.length){
  row.appendChild(el('span',{class:'small muted',style:'flex:1 1 100%',
   text:Anim.tracks.length?'Tap a key to edit. Drag retimes. Long-press adds to the selection. Pinch zooms, drag empty space pans.':'No keys yet — use Key Position below (or Key Rotation on a posed bone).'}));
 }else if(sk.length===1){
  var k=sk[0].key,tr=sk[0].tr;
  row.appendChild(el('button',{text:'Frame: '+k.t,title:'Tap to type an exact frame',onclick:function(){
   var v=prompt('Move key to frame:',k.t);if(v==null)return;
   var n=+v;if(!isFinite(n)){toast('Enter a number');return;}
   Dope.setSelFrame(n);}}));
  if(typeof k.v==='number')
   row.appendChild(el('button',{text:'Value: '+(Math.round(k.v*1000)/1000),title:'Tap to type an exact value',onclick:function(){
    var v=prompt('Key value for '+tr.path+':',k.v);if(v==null)return;
    var n=+v;if(!isFinite(n)){toast('Enter a number');return;}
    Dope.setSelValue(n);}}));
  else row.appendChild(el('span',{class:'small muted',text:'rotation key'}));
  row.appendChild(el('button',{text:'Duplicate',onclick:function(){Dope.dupSel();}}));
  row.appendChild(el('button',{text:'Delete',onclick:function(){Dope.deleteSel();}}));
 }else{
  row.appendChild(el('span',{class:'small',style:'font-weight:600',text:sk.length+' keys'}));
  row.appendChild(el('button',{text:'Duplicate',onclick:function(){Dope.dupSel();}}));
  row.appendChild(el('button',{text:'Delete',onclick:function(){Dope.deleteSel();}}));
 }
 row.appendChild(el('button',{class:Dope.boxMode?'on':'',text:'Box Select',onclick:function(){
  Dope.boxMode=!Dope.boxMode;renderDopeActions();
  toast(Dope.boxMode?'Drag on the sheet to box-select keys':'Box select off');}}));
 if(KeyUndo.length)row.appendChild(el('button',{text:'Undo',onclick:function(){Dope.undo();}}));
 bar.appendChild(row);}

/* ---------------- VIEW SWITCH + PANELS ---------------- */
function setView(v){active.view=v;
  $$('.view').forEach(function(s){s.classList.toggle('on',s.getAttribute('data-view')===v);});
  $$('#rail .tab').forEach(function(t){t.classList.toggle('on',t.getAttribute('data-v')===v);});
  $$('#tabbar .tab').forEach(function(t){t.classList.toggle('on',t.getAttribute('data-v')===v);});
  $('#vtitle').textContent=VIEWS.filter(function(x){return x[0]===v;})[0][1];
  var slot=curSlot();if(slot)slot.appendChild(dom);
  RotBall.show(v==='pose'||v==='timeline');if(v==='pose'||v==='timeline'){RotBall.draw();syncZoomKnob();}
  var zk=$('#zoomKnob');if(zk)zk.classList.toggle('on',v==='pose'||v==='timeline');
  renderPanel();setTimeout(resizeActive,30);}

function renderPanel(){var b=$('#panelBody');b.innerHTML='';var v=active.view;
  if(v==='pose')panelPose(b);else if(v==='timeline')panelTimeline(b);else panelExport(b);
  $('#sheetLbl').textContent=$('#vtitle').textContent+' Tools';invalidate();}

function targetSelect(onchange){
  var sel=el('select',{onchange:function(e){state.selTarget=e.target.value;onchange&&onchange(e.target.value);}});
  Object.keys(Registry).filter(function(id){return id.indexOf('/con:')<0;}) // Wave C4: hide constraint-influence pseudo-targets from the general picker
    .forEach(function(id){sel.appendChild(el('option',{value:id,text:id}));});
  if(state.selTarget)sel.value=state.selTarget;
  return sel;}

// Wave C2: Skinning UI — bind/unbind the active model's parts to a rig, recompute automatic
// weights, and a per-part bind-status readout (bound? which rig? weight source). Lives inside
// the Pose tab (mobile-first: one less tab to navigate to reach it while posing/checking deform).
function panelSkinning(b,rigArg){
  b.appendChild(el('div',{class:'section-title',text:'Skinning'}));
  var rigIds=Object.keys(Rigs);
  if(!rigIds.length){b.appendChild(el('p',{class:'small muted',text:'Create an armature above, then bind the model to it here.'}));return;}
  var grp=activeModelGroup();
  if(!grp){b.appendChild(el('p',{class:'small muted',text:'No model loaded to bind.'}));return;}

  if(!Arm.skinRigSel||rigIds.indexOf(Arm.skinRigSel)<0)Arm.skinRigSel=(rigArg?rigArg.id:null)||rigIds[0];
  var rigSel=el('select',{onchange:function(e){Arm.skinRigSel=e.target.value;}});
  rigIds.forEach(function(rid){rigSel.appendChild(el('option',{value:rid,text:Rigs[rid].name+' ('+rid+')'}));});
  rigSel.value=Arm.skinRigSel;
  b.appendChild(el('label',{class:'fld',text:'Rig to bind'+(rigIds.length>1?' (multiple armatures)':'')}));
  b.appendChild(rigSel);

  var parts=grp.children.filter(function(c){return c.isMesh||c.isSkinnedMesh;});
  var boundCount=parts.filter(function(p){return p.isSkinnedMesh;}).length;
  var row=el('div',{class:'grid2',style:'margin-top:6px'});
  row.appendChild(el('button',{class:'pri',text:'Bind to Armature',onclick:function(){
    var rig=Rigs[rigSel.value];if(!rig){toast('Pick a rig');return;}
    bindModelToRig(grp,rig);renderPanel();invalidate();}}));
  var unbindBtn=el('button',{text:'Unbind',onclick:function(){unbindModel(grp);renderPanel();invalidate();}});
  if(!boundCount)unbindBtn.disabled=true;
  row.appendChild(unbindBtn);
  b.appendChild(row);
  var recomputeBtn=el('button',{style:'width:100%;margin-top:6px',text:'Recompute Auto Weights',
    title:'Force nearest-bone automatic weights on every bound part, ignoring any matching vertex groups',
    onclick:function(){recomputeAutoWeightsForModel(grp);renderPanel();invalidate();}});
  if(!boundCount)recomputeBtn.disabled=true;
  b.appendChild(recomputeBtn);

  b.appendChild(el('div',{class:'section-title',text:'Bind Status'}));
  if(!parts.length)b.appendChild(el('p',{class:'small muted',text:'No mesh parts on this model.'}));
  parts.forEach(function(p){
    var label=p.name||p.userData.targetId||'part';
    var status;
    if(p.isSkinnedMesh&&p.userData.skinBind){
      var sb=p.userData.skinBind,rn=Rigs[sb.rigId]?Rigs[sb.rigId].name:sb.rigId;
      status='Bound to '+rn+' — '+(sb.source==='groups'?'vertex groups':'automatic weights');
    }else status='Not bound';
    b.appendChild(el('div',{class:'card small',style:'margin-bottom:4px'},[label+': '+status]));});}

function panelPose(b){
  b.appendChild(el('h2',{text:'Pose'}));
  b.appendChild(el('p',{class:'sub',text:'Build an armature in Edit Bones, then switch to Pose to rotate bones (FK drag, exact degrees, or IK targets). Bind the model to a rig in Skinning below so posing deforms the mesh. Add Copy Location/Rotation, Track-To and Limit Rotation constraints from the Constraints section.'}));
  if(state.usingDemo)b.appendChild(el('div',{class:'card small',style:'margin-bottom:10px'},
    ['No modeling-suite autosave was found, so a demo figure is loaded. Build/save a project in the Modeler, or Import a project.json above, then reload this page.']));

  b.appendChild(el('div',{class:'section-title',text:'Armature'}));
  var rig=Arm.rigId?Rigs[Arm.rigId]:null;
  if(!rig){
    b.appendChild(el('button',{class:'pri',style:'width:100%',text:'New Armature',onclick:function(){ensureRig();renderPanel();invalidate();}}));
  }else{
    var modeRow=el('div',{class:'grid2'});
    modeRow.appendChild(el('button',{class:Arm.mode==='edit'?'on':'',text:'Edit Bones',onclick:function(){setArmMode('edit');}}));
    modeRow.appendChild(el('button',{class:Arm.mode==='pose'?'on':'',text:'Pose',onclick:function(){setArmMode('pose');}}));
    b.appendChild(modeRow);

    if(Arm.mode==='edit')panelArmEdit(b,rig);else panelArmPose(b,rig);

    b.appendChild(el('div',{class:'section-title',text:'Bones ('+rig.bones.length+')'}));
    if(!rig.bones.length)b.appendChild(el('p',{class:'small muted',text:'No bones yet — tap Add Bone, then tap the viewport.'}));
    else rig.bones.forEach(function(be){
      var pName=be.parentId&&findBone(rig,be.parentId)?findBone(rig,be.parentId).name:null;
      b.appendChild(el('button',{style:'width:100%;text-align:left;margin-bottom:4px',class:Arm.selBoneId===be.id?'on':'',
        text:be.name+(pName?'  ·  child of '+pName:''),
        onclick:function(){selectBone(rig,be.id);renderPanel();}}));});

// Compact per-axis limit control: one button per axis, tap-to-type "min,max" degrees
// (blank input clears back to unlimited) — prompt()-based like slider()'s tap-to-type.
function limitBtn(be,axis){
  var L=be.limits&&be.limits[axis];
  var lbl=axis.toUpperCase()+': '+(L?(Math.round(L[0]*180/Math.PI)+'° … '+Math.round(L[1]*180/Math.PI)+'°'):'free');
  return el('button',{class:L?'on':'',style:'width:100%',text:lbl,onclick:function(){
    var cur=L?Math.round(L[0]*180/Math.PI)+','+Math.round(L[1]*180/Math.PI):'';
    var input=prompt('Limit '+axis.toUpperCase()+' rotation: min,max in degrees (blank = unlimited):',cur);
    if(input==null)return;
    input=input.trim();
    if(!input){setBoneLimit(be,axis,null,null);renderPanel();return;}
    var parts=input.split(/[,;\s]+/).map(Number);
    if(parts.length<2||!isFinite(parts[0])||!isFinite(parts[1])){toast('Enter two numbers, e.g. -45,45');return;}
    var mn=Math.min(parts[0],parts[1])*Math.PI/180,mx=Math.max(parts[0],parts[1])*Math.PI/180;
    setBoneLimit(be,axis,mn,mx);toast('Limit '+axis.toUpperCase()+' set');renderPanel();}});}

/* ---------------- Wave C4: Constraints UI (shared by the bone Pose panel and the generic
   "any registered object" Target section — mobile-first: tap a type chip, then pick a target
   from a select (or a future viewport tap — see file header deviation note), tap Add/Cancel. */
function constraintRow(ownerTargetId,con,be){
  var card=el('div',{class:'card small',style:'margin-bottom:6px'});
  var top=el('div',{style:'display:flex;align-items:center;gap:6px;margin-bottom:6px'});
  top.appendChild(el('span',{style:'font-weight:600',text:CONSTRAINT_LABELS[con.type]||con.type}));
  top.appendChild(el('span',{class:'muted small',style:'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
    text:con.type==='limitRot'?'(bone limits)':(con.targetId||'no target')}));
  top.appendChild(el('button',{class:con.enabled?'on':'',style:'padding:6px 9px',text:con.enabled?'On':'Off',
    onclick:function(){con.enabled=!con.enabled;scheduleAnimAutosave();invalidate();renderPanel();}}));
  top.appendChild(el('button',{style:'padding:6px 9px',text:'✕',onclick:function(){
    removeConstraint(ownerTargetId,con.id);renderPanel();invalidate();}}));
  card.appendChild(top);
  if(con.type!=='limitRot'){
    card.appendChild(slider('Influence',0,1,con.influence,.01,function(v){con.influence=v;scheduleAnimAutosave();invalidate();}));
    card.appendChild(el('button',{style:'width:100%;margin-top:4px',text:'Key Influence',onclick:function(){
      var cid=constraintTargetId(ownerTargetId,con);
      if(!Registry[cid])registerTarget(cid,con);
      Anim.insertKey(cid,'influence',Anim.time);toast('Keyed influence @ t='+Anim.time);}}));
  }
  if(con.type==='trackTo'){
    card.appendChild(el('div',{class:'small muted',style:'margin-top:4px',text:'Aim axis'}));
    var axRow=el('div',{style:'display:flex;gap:4px'});
    [['auto','Auto'],['x','X'],['y','Y'],['z','Z']].forEach(function(a){
      axRow.appendChild(el('button',{class:(con.params.axis||'auto')===a[0]?'on':'',style:'flex:1;padding:5px',text:a[1],
        onclick:function(){con.params.axis=a[0];scheduleAnimAutosave();invalidate();renderPanel();}}));});
    card.appendChild(axRow);
    card.appendChild(el('div',{class:'small muted',style:'margin-top:4px',text:'Up axis'}));
    var upRow=el('div',{style:'display:flex;gap:4px'});
    [['x','X'],['y','Y'],['z','Z']].forEach(function(a){
      upRow.appendChild(el('button',{class:(con.params.up||'y')===a[0]?'on':'',style:'flex:1;padding:5px',text:a[1],
        onclick:function(){con.params.up=a[0];scheduleAnimAutosave();invalidate();renderPanel();}}));});
    card.appendChild(upRow);
  }
  return card;}

// Constraints section, shared by the bone Pose panel (be present, offers Limit Rotation) and
// the generic Target section (be null, copyLoc/copyRot/trackTo only — see panelPose).
function renderConstraintsSection(b,ownerTargetId,be){
  var list=constraintListFor(ownerTargetId)||[];
  b.appendChild(el('div',{class:'section-title',text:'Constraints ('+list.length+')'}));
  list.forEach(function(con){b.appendChild(constraintRow(ownerTargetId,con,be));});
  if(Arm.addConType){
    var pick=el('div',{class:'card small',style:'margin-bottom:6px'});
    pick.appendChild(el('div',{class:'small muted',style:'margin-bottom:6px',text:'Target for '+CONSTRAINT_LABELS[Arm.addConType]+':'}));
    var opts=Object.keys(Registry).filter(function(id){return id!==ownerTargetId&&id.indexOf('/con:')<0;});
    if(!opts.length){pick.appendChild(el('p',{class:'small muted',text:'No other targets registered yet.'}));}
    else{
      var sel=el('select',{});
      opts.forEach(function(id){sel.appendChild(el('option',{value:id,text:id}));});
      pick.appendChild(sel);
      var row=el('div',{class:'grid2',style:'margin-top:6px'});
      row.appendChild(el('button',{class:'pri',text:'Add',onclick:function(){
        var t=Arm.addConType;Arm.addConType=null;
        var c=addConstraint(ownerTargetId,t,sel.value);
        if(c)toast('Added '+CONSTRAINT_LABELS[c.type]);
        renderPanel();invalidate();}}));
      row.appendChild(el('button',{text:'Cancel',onclick:function(){Arm.addConType=null;renderPanel();}}));
      pick.appendChild(row);
    }
    b.appendChild(pick);
  }else{
    b.appendChild(el('div',{class:'small muted',style:'margin:2px 0 6px',text:'+ Add Constraint'}));
    var chipRow=el('div',{style:'display:flex;flex-wrap:wrap;gap:6px'});
    var types=[['copyLoc','Copy Loc'],['copyRot','Copy Rot'],['trackTo','Track To']];
    if(be)types.push(['limitRot','Limit Rot']);
    types.forEach(function(t){chipRow.appendChild(el('button',{style:'flex:1 1 30%',text:t[1],onclick:function(){
      if(t[0]==='limitRot'){var c=addConstraint(ownerTargetId,'limitRot',null);if(c)toast('Added Limit Rotation');renderPanel();return;}
      Arm.addConType=t[0];renderPanel();}}));});
    b.appendChild(chipRow);
  }}

/* ---------------- nav build (rail desktop / tabbar + bottom sheet mobile, same as index.html) ---------------- */
function buildNav(){var rail=$('#rail'),tab=$('#tabbar');VIEWS.forEach(function(v){
  rail.appendChild(el('button',{class:'tab','data-v':v[0],html:icon(ICONS[v[0]])+'<span>'+v[1]+'</span>',onclick:function(){setView(v[0]);}}));
  tab.appendChild(el('button',{class:'tab','data-v':v[0],html:icon(ICONS[v[0]])+'<span>'+v[1]+'</span>',
    onclick:function(){if(active.view===v[0])openSheet();else setView(v[0]);}}));});}
function openSheet(on){var p=$('#panel');if(on==null)on=!p.classList.contains('open');p.classList.toggle('open',on);}
(function(){var h=$('#sheetHandle'),p=$('#panel');
  var drag=false,moved=false,sy=0,y0=0,travel=0,vel=0,lastY=0,lastT=0;
  h.addEventListener('pointerdown',function(e){h.setPointerCapture(e.pointerId);
    travel=Math.max(1,p.getBoundingClientRect().height-48);
    y0=p.classList.contains('open')?0:travel;
    sy=lastY=e.clientY;lastT=performance.now();vel=0;drag=true;moved=false;
    p.style.transition='none';});
  h.addEventListener('pointermove',function(e){if(!drag)return;
    var dy=e.clientY-sy;if(Math.abs(dy)>6)moved=true;
    var t=performance.now(),dt=t-lastT;
    if(dt>0){vel=(e.clientY-lastY)/dt;lastY=e.clientY;lastT=t;}
    var y=Math.max(0,Math.min(travel,y0+dy));
    p.style.transform='translateY('+y+'px)';});
  function settle(e){if(!drag)return;drag=false;p.style.transition='';
    if(!moved){p.style.transform='';openSheet();return;}
    var y=Math.max(0,Math.min(travel,y0+(e.clientY-sy)));
    var open=Math.abs(vel)>.35?vel<0:y<travel*.5;
    p.classList.toggle('open',open);p.style.transform='';}
  h.addEventListener('pointerup',settle);
  h.addEventListener('pointercancel',function(){drag=false;p.style.transition='';p.style.transform='';});
})();

/* ---------------- zoom knob ---------------- */
function syncZoomKnob(){var sl=$('#zkSlider');if(!sl)return;var t=Math.log(vs.rad/0.6)/Math.log(100);sl.value=Math.round(100-clamp(t,0,1)*99);}
(function(){var sl=$('#zkSlider'),zi=$('#zkIn'),zo=$('#zkOut');if(!sl)return;
  function radFromSlider(v){var t=(100-+v)/99;return .6*Math.pow(100,t);}
  sl.addEventListener('input',function(){vs.rad=clamp(radFromSlider(this.value),.6,60);updateCam();invalidate();});
  zi.addEventListener('click',function(){vs.rad=clamp(vs.rad*.82,.6,60);updateCam();syncZoomKnob();invalidate();});
  zo.addEventListener('click',function(){vs.rad=clamp(vs.rad/0.82,.6,60);updateCam();syncZoomKnob();invalidate();});})();

$('#btnImportProj').addEventListener('click',function(){$('#fileProj').click();});
$('#fileProj').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var data=JSON.parse(rd.result);
    if(loadProjectData(data)){state.usingDemo=false;$('#emptyBanner').classList.remove('show');toast('Project imported');setView(active.view);}
    else toast('No models in that file');}
    catch(err){toast('Bad project file');console.error(err);}};
  rd.readAsText(f);e.target.value='';});
$('#emptyBannerClose').addEventListener('click',function(){$('#emptyBanner').classList.remove('show');});

window.addEventListener('resize',resizeActive);
window.addEventListener('resize',function(){if(Dope.canvas&&Dope.canvas.isConnected)Dope.draw();});

/* ---------------- main loop ---------------- */
function loop(){requestAnimationFrame(loop);stepPlayback(performance.now());updateCam();
  var slot=curSlot();var act=ptrs.size>0;
  if((renderFrames>0||act)&&slot&&slot.contains(dom)){applyAllConstraints();renderer.render(poseScene,vs.cam);} // Wave C4: constraints settle right before render
  if(renderFrames>0&&!act)renderFrames--;
  if(RotBall.el&&RotBall.el.style.display!=='none')RotBall.draw();}

/* ---------------- init ---------------- */
buildNav();
RotBall.init();
tryRestoreAnimAutosave();
var bridged=bridgeLoadModelProject();
state.usingDemo=!bridged;
if(!bridged){buildDemoFigure();$('#emptyBanner').classList.add('show');}
applyPendingSkinBinds(); // Wave C2: rigs + model are both in the Registry now — reconstruct any saved binds
if(!state.selTarget){var ks=Object.keys(Registry);if(ks.length)state.selTarget=ks[0];}
clampTime();
Anim.sample(Anim.time);
setView('pose');
loop();
boot.style.display='none';
})();
