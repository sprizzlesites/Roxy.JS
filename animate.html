<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Roxy Animate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Same light "liquid glass" chrome as index.html over a dark 3D viewport. Kept in sync
     by hand (single-file constraint — see docs/ORCHESTRATION.md §1) rather than shared. */
  --bg:#f3f4f6;--ink:#14161a;--muted:#6b7280;--faint:#9aa1ab;--line:rgba(0,0,0,.10);
  --panel:rgba(255,255,255,.86);--card:rgba(0,0,0,.045);--pink:#ff8fb1;--pink2:#ff6f9c;--pinkInk:#c2386a;--ok:#2f8f5b;--err:#d94b4b;
  --rail:64px;--side:320px;--bar:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Space Grotesk",system-ui,sans-serif;font-size:14px}
button{font-family:inherit;color:var(--ink);cursor:pointer;border:1px solid var(--line);background:var(--card);
  border-radius:10px;padding:9px 11px;font-size:13px;transition:background .14s,border-color .14s,transform .04s}
button:hover{background:rgba(0,0,0,.055)}button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--pink);color:#2a141d;border-color:transparent;font-weight:600}
button.pri:hover{background:#ffa3c0}
button.on{background:rgba(255,143,177,.18);border-color:rgba(255,143,177,.45);color:var(--pinkInk)}
input[type=range]{width:100%;accent-color:var(--pink)}
input[type=text],input[type=number],select{font-family:inherit;font-size:13px;color:var(--ink);background:rgba(0,0,0,.055);
  border:1px solid var(--line);border-radius:9px;padding:8px 9px;width:100%}
label.fld{display:block;font-size:11px;letter-spacing:.04em;color:var(--muted);margin:0 0 5px}
.tap-edit{cursor:pointer;border-bottom:1px dashed var(--faint);padding-bottom:1px}
.tap-edit:hover{color:var(--ink);border-bottom-color:var(--pink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px}
.muted{color:var(--muted)}.small{font-size:11.5px}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}

#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--rail) 1fr var(--side);grid-template-rows:var(--bar) 1fr;
  grid-template-areas:"bar bar bar" "rail stage panel";}
#bar{grid-area:bar;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(rgba(255,255,255,.82),rgba(244,245,247,.68));
  backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);z-index:5}
#bar .logo{font:600 14px/1 "Space Grotesk",sans-serif;letter-spacing:.08em;text-transform:uppercase}
#bar .vtitle{font-size:12px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
#bar .sp{flex:1}
#bar .act,#bar a.act{padding:7px 9px;font-size:12px}
#bar a.act{display:inline-flex;align-items:center;text-decoration:none;border:1px solid var(--line);background:var(--card);
  border-radius:10px;color:var(--ink)}

#rail{grid-area:rail;display:flex;flex-direction:column;gap:4px;padding:8px 6px;border-right:1px solid var(--line);background:var(--panel)}
#rail .tab{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;border-radius:12px;
  padding:9px 4px;color:var(--muted);font-size:9.5px;letter-spacing:.04em}
#rail .tab .ic{width:22px;height:22px;display:block}
#rail .tab.on{color:var(--ink);background:var(--card)}
#rail .tab.on .ic{filter:drop-shadow(0 0 6px rgba(255,143,177,.5))}

#stage{grid-area:stage;position:relative;overflow:hidden;-webkit-touch-callout:none;background:
  radial-gradient(120% 120% at 50% 20%, #1c1f25 0%, #12141a 60%, #0b0c0f 100%)}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.gl-slot{position:absolute;inset:0}
canvas{display:block;touch-action:none}

#panel{grid-area:panel;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
#panel h2{font:600 13px/1.1 "Space Grotesk";margin:0 0 2px}
#panel .sub{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.section-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:14px 0 8px}

#tabbar{display:none}
#navMask{display:none}
#sheetHandle{display:none}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(255,255,255,.86);border:1px solid rgba(0,0,0,.10);
  backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:0 8px 24px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.7);
  color:var(--ink);padding:9px 14px;border-radius:999px;font-size:12.5px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99;
  font-size:14px;color:var(--muted);text-align:center;padding:24px}

#zoomKnob{position:absolute;right:18px;top:100px;display:none;flex-direction:column;align-items:center;gap:3px;z-index:8;width:28px;
  padding:5px 0;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.10);
  backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:0 6px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.7)}
.zk-btn{width:26px;height:26px;border-radius:50%;background:transparent;border:none;color:rgba(20,22,26,.8);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;line-height:1;padding:0;font-family:inherit}
#zkSlider{writing-mode:vertical-lr;direction:rtl;width:26px;height:80px;cursor:ns-resize;accent-color:rgba(255,143,177,.8);touch-action:none}
#zoomKnob.on{display:flex}

#rotBall{position:absolute;right:12px;top:12px;width:80px;height:80px;cursor:grab;display:none;z-index:8;touch-action:none;border-radius:50%}

#emptyBanner{position:absolute;left:12px;right:98px;top:12px;z-index:8;display:none;
  padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.10);
  backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:0 6px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.7);font-size:12px;color:var(--ink)}
#emptyBanner.show{display:flex;align-items:center;gap:10px}
#emptyBanner button{padding:5px 9px;font-size:11px}

.scrubRange{width:100%;height:42px;touch-action:none;accent-color:var(--pink);cursor:ew-resize;margin:6px 0}

/* ---------- mobile ---------- */
@media (max-width:820px){
  :root{--side:0px;--bar:52px}
  #app{grid-template-columns:1fr;grid-template-rows:var(--bar) 1fr;grid-template-areas:"bar" "stage"}
  #rail{display:none}
  button{min-height:42px;font-size:13.5px}
  #bar{gap:6px;padding:0 8px}
  #bar .vtitle{display:none}
  #bar .act,#bar a.act{min-height:38px;padding:8px 10px}
  input[type=text],input[type=number],select{min-height:42px;font-size:14px}
  .zk-btn{width:32px;height:32px;min-height:32px;font-size:19px}
  #zoomKnob{width:34px}
  #zkSlider{width:32px;height:min(96px,max(24px,calc(100vh - 320px)))}
  #panel{position:fixed;left:8px;right:8px;bottom:calc(78px + env(safe-area-inset-bottom));top:auto;height:60vh;
    border:1px solid rgba(0,0,0,.10);border-radius:24px;
    background:linear-gradient(rgba(255,255,255,.82),rgba(247,248,249,.9));
    backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);
    transform:translateY(calc(100% - 48px));transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:20;
    box-shadow:0 18px 48px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.8)}
  #panel.open{transform:translateY(0)}
  #sheetHandle{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;margin:-6px -14px 6px;cursor:grab;touch-action:none}
  #sheetHandle .bar{width:48px;height:5px;border-radius:99px;background:var(--faint)}
  #sheetHandle .lbl{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  #navMask{display:block;position:fixed;left:0;right:0;bottom:0;height:calc(78px + env(safe-area-inset-bottom));
    background:var(--bg);z-index:25;pointer-events:none}
  #tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));height:62px;
    border:1px solid rgba(0,0,0,.10);border-radius:26px;padding:0 4px;
    background:linear-gradient(rgba(255,255,255,.85),rgba(248,249,250,.92));
    backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);
    box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.8);z-index:30}
  #tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;
    border:none;color:var(--muted);font-size:9.5px;letter-spacing:.03em;margin:6px 2px;border-radius:20px;
    transition:background .18s,color .18s}
  #tabbar .tab .ic{width:21px;height:21px}
  #tabbar .tab.on{color:var(--pinkInk);background:rgba(255,143,177,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom))}
  #emptyBanner{right:12px;top:8px}
}
@media (max-width:820px){ .desktop-only{display:none} }
@media (min-width:821px){ .mobile-only{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="boot">loading studio…</div>

<div id="app" aria-hidden="false">
  <header id="bar">
    <span class="logo">ROXY ANIMATE</span>
    <span class="vtitle" id="vtitle">Pose</span>
    <span class="sp"></span>
    <button class="act" id="btnImportProj" title="Import a project.json exported from the modeler">Import</button>
    <a class="act" href="index.html" title="Back to the modeling suite">◀ Modeler</a>
  </header>

  <nav id="rail"></nav>

  <main id="stage">
    <section class="view on" data-view="pose"><div class="gl-slot" id="slot-pose"></div></section>
    <section class="view" data-view="timeline"><div class="gl-slot" id="slot-timeline"></div></section>
    <section class="view" data-view="export"></section>
    <canvas id="rotBall" width="80" height="80" role="img" aria-label="Orbit gizmo — drag to rotate the view"></canvas>
    <div id="zoomKnob">
      <button class="zk-btn" id="zkIn" title="Zoom in">+</button>
      <input id="zkSlider" type="range" min="1" max="100" value="50">
      <button class="zk-btn" id="zkOut" title="Zoom out">−</button>
    </div>
    <div id="emptyBanner">
      <span>No modeling-suite autosave found — loaded a demo figure. Import a project.json or build one in the Modeler.</span>
      <button id="emptyBannerClose">✕</button>
    </div>
  </main>

  <aside id="panel">
    <div id="sheetHandle"><span class="bar"></span><span class="lbl" id="sheetLbl">Tools</span></div>
    <div id="panelBody"></div>
  </aside>

  <div id="navMask"></div>
  <nav id="tabbar"></nav>
</div>

<input type="file" id="fileProj" accept=".json" style="display:none">
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
 onerror="document.getElementById('boot').textContent='Could not load Three.js (CDN blocked). Open this file in a normal browser tab.'"></script>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var boot=$('#boot');
if(typeof THREE==='undefined'){boot.textContent='Three.js failed to load.';return;}
function el(t,a,kids){var n=document.createElement(t);a=a||{};for(var k in a){if(k==='class')n.className=a[k];
  else if(k==='html')n.innerHTML=a[k];else if(k==='text')n.textContent=a[k];else if(k.slice(0,2)==='on')n.addEventListener(k.slice(2).toLowerCase(),a[k]);
  else n.setAttribute(k,a[k]);}(kids||[]).forEach(function(c){if(c==null)return;n.appendChild(typeof c==='string'?document.createTextNode(c):c);});return n;}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},1800);}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function icon(p){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var ICONS={
 pose:'<circle cx="12" cy="5" r="2"/><path d="M12 7v6M12 13l-4 6M12 13l4 6M8 10h8"/>',
 timeline:'<path d="M4 12h16"/><circle cx="8" cy="12" r="2.2"/><circle cx="17" cy="12" r="2.2"/>',
 export:'<path d="M12 3v12"/><path d="M7 9l5 5 5-5"/><path d="M4 19h16"/>'
};
var VIEWS=[['pose','Pose'],['timeline','Timeline'],['export','Export']];

/* ---------------- renderer (matches index.html: ACESFilmic, sRGB, on-demand render) ---------------- */
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var pmrem=new THREE.PMREMGenerator(renderer);
var dom=renderer.domElement;

/* ---------------- env / ground / lights (same "Night Blue" preset + approach as index.html) ---------------- */
function buildNightEnvTex(){var c=el('canvas');c.width=1024;c.height=512;var g=c.getContext('2d');
  var gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#48618f');gr.addColorStop(.5,'#1b2740');gr.addColorStop(1,'#05070d');
  g.fillStyle=gr;g.fillRect(0,0,1024,512);
  [[300,140,200,.6],[760,160,160,.4]].forEach(function(cd){var rg=g.createRadialGradient(cd[0],cd[1],0,cd[0],cd[1],cd[2]);
    rg.addColorStop(0,'rgba(255,255,255,'+cd[3]+')');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.beginPath();g.arc(cd[0],cd[1],cd[2],0,7);g.fill();});
  var t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
  var env=pmrem.fromEquirectangular(t).texture;t.dispose();return env;}
function applyNightEnv(scene){scene.environment=buildNightEnvTex();scene.background=new THREE.Color('#06080f');}
function studioLights(scene){
  var k=new THREE.DirectionalLight(0xfff0db,2.0);k.position.set(3.2,5,2.4);k.castShadow=true;
  k.shadow.mapSize.set(2048,2048);k.shadow.camera.near=.5;k.shadow.camera.far=20;
  k.shadow.camera.left=-5;k.shadow.camera.right=5;k.shadow.camera.top=5;k.shadow.camera.bottom=-5;k.shadow.bias=-.0004;k.shadow.radius=6;
  scene.add(k);var r=new THREE.DirectionalLight(0xa9c2ff,.6);r.position.set(-3,2.2,-3.4);scene.add(r);
  scene.add(new THREE.HemisphereLight(0xfff3e6,0x2a1d12,.22));}
function addGround(scene){var g=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:.32}));
  g.rotation.x=-Math.PI/2;g.position.y=-0.001;g.receiveShadow=true;scene.add(g);
  var grid=new THREE.GridHelper(20,20,0x767c85,0x33383f);grid.position.y=0;scene.add(grid);}

var poseScene=new THREE.Scene();studioLights(poseScene);applyNightEnv(poseScene);addGround(poseScene);
poseScene.userData.modelHolder=new THREE.Group();poseScene.add(poseScene.userData.modelHolder);
poseScene.userData.armatureHolder=new THREE.Group();poseScene.add(poseScene.userData.armatureHolder);

/* ---------------- camera + orbit (single shared view — Pose and Timeline show the same scene) ---------------- */
function mkCam(){return new THREE.PerspectiveCamera(40,1,.05,500);}
var vs={th:.7,ph:1.0,rad:4,tx:0,ty:1,tz:0,cam:mkCam()};
var active={view:'pose'};

var renderFrames=8;function invalidate(n){renderFrames=Math.max(renderFrames,n||4);}

function frameObject(obj,v){var box=new THREE.Box3().setFromObject(obj);if(box.isEmpty())return;var s=new THREE.Vector3();box.getSize(s);
  var c=new THREE.Vector3();box.getCenter(c);var r=Math.max(s.x,s.y,s.z)*0.5||1;v.tx=c.x;v.ty=c.y;v.tz=c.z;v.rad=r*3.2;}

/* ---------------- pointer handling: drag orbit, pinch-zoom, two-finger pan, tap-select, double-tap-frame ---------------- */
var ptrs=new Map(),lastDist=0,lastMid=null,clickStart=null,lastTap=null;
dom.addEventListener('pointerdown',function(e){
  // Armature Edit/Pose modes hijack the pointer BEFORE the general orbit/tap machinery below —
  // same precedence pattern as index.html's Gizmo-hit-test-first. See the Armature section
  // (Arm/hitJoint/hitBoneMesh/jointDrag/poseDrag) for the full picture.
  if(active.view==='pose'&&Arm.mode==='edit'&&!Arm.chainActive&&!Arm.parentPickActive){
    var hj=hitJoint(e);
    if(hj){dom.setPointerCapture(e.pointerId);jointDrag={be:hj.be,which:hj.which,ptId:e.pointerId,px:e.clientX,py:e.clientY};invalidate();return;}
  }
  if(active.view==='pose'&&Arm.mode==='pose'&&Arm.ikOn){
    // IK armed: an IK-handle drag takes precedence over selecting a new chain tip,
    // which itself takes precedence over the plain-FK poseDrag below (see ikSelectTip).
    var hik=hitIkHandle(e);
    if(hik){dom.setPointerCapture(e.pointerId);ikDrag={which:hik,ptId:e.pointerId,px:e.clientX,py:e.clientY};invalidate();return;}
    var hb2=hitBoneMesh(e);
    if(hb2){dom.setPointerCapture(e.pointerId);selectBone(hb2.rig,hb2.id);ikSelectTip(hb2.rig,hb2.id);renderPanel();invalidate();return;}
  }
  if(active.view==='pose'&&Arm.mode==='pose'&&!Arm.ikOn){
    var hb=hitBoneMesh(e);
    if(hb){dom.setPointerCapture(e.pointerId);selectBone(hb.rig,hb.id);
      poseDrag={be:hb.be,px:e.clientX,py:e.clientY,ptId:e.pointerId};renderPanel();invalidate();return;}
  }
  dom.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  clickStart={x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId};invalidate();});
dom.addEventListener('pointermove',function(e){
  if(jointDrag&&jointDrag.ptId===e.pointerId){dragJointMove(e);return;}
  if(ikDrag&&ikDrag.ptId===e.pointerId){dragIkMove(e);return;}
  if(poseDrag&&poseDrag.ptId===e.pointerId){dragPoseMove(e);return;}
  var p=ptrs.get(e.pointerId);if(!p)return;
  var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){
    vs.th+=dx*.005;vs.ph=clamp(vs.ph-dy*.005,.1,1.5);
    if(clickStart&&Math.hypot(e.clientX-clickStart.x,e.clientY-clickStart.y)>6)clickStart=null;}
  else if(ptrs.size===2){
    var v=Array.from(ptrs.values());var d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);var mid={x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2};
    if(lastDist)vs.rad=clamp(vs.rad*(lastDist/d),.6,60);lastDist=d;
    if(lastMid){var sp=Math.sin(vs.ph);var rightx=Math.cos(vs.th+Math.PI/2),rightz=Math.sin(vs.th+Math.PI/2);var k=vs.rad*.0016;
      vs.tx+=(mid.x-lastMid.x)*k*rightx;vs.tz+=(mid.x-lastMid.x)*k*rightz;vs.ty+=(mid.y-lastMid.y)*k;}
    lastMid=mid;clickStart=null;}
  invalidate();});
function endPtr(e){
  if(jointDrag&&jointDrag.ptId===e.pointerId){jointDrag=null;invalidate();return;}
  if(ikDrag&&ikDrag.ptId===e.pointerId){ikDrag=null;invalidate();return;} // release: solved pose simply stays (bone quats), target handle stays too
  if(poseDrag&&poseDrag.ptId===e.pointerId){poseDrag=null;invalidate();return;}
  ptrs.delete(e.pointerId);lastDist=0;lastMid=null;
  if(clickStart&&clickStart.id===e.pointerId&&Date.now()-clickStart.t<350&&Math.hypot(e.clientX-clickStart.x,e.clientY-clickStart.y)<6){
    var now=Date.now();
    if(lastTap&&now-lastTap.t<350&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<40){frameCurrent();toast('Framed');lastTap=null;}
    else{onViewportTap(e);lastTap={x:e.clientX,y:e.clientY,t:now};}}
  clickStart=null;}
dom.addEventListener('pointerup',endPtr);dom.addEventListener('pointercancel',endPtr);
dom.addEventListener('wheel',function(e){e.preventDefault();vs.rad=clamp(vs.rad*(1+e.deltaY*.0012),.6,60);syncZoomKnob();invalidate();},{passive:false});
function onViewportTap(e){if(active.view!=='pose'&&active.view!=='timeline')return;
  if(active.view==='pose'&&Arm.mode==='edit'){
    if(Arm.chainActive){chainExtendTap(e);return;}
    if(Arm.parentPickActive){parentPickTap(e);return;}
  }
  if(active.view==='pose'){
    var hb=hitBoneMesh(e);
    if(hb){selectBone(hb.rig,hb.id);renderPanel();toast('Selected bone '+hb.name);return;}
  }
  var r=dom.getBoundingClientRect();
  var mx=((e.clientX-r.left)/r.width)*2-1,my=-((e.clientY-r.top)/r.height)*2+1;
  var ray=new THREE.Raycaster();ray.setFromCamera({x:mx,y:my},vs.cam);
  var hit=ray.intersectObjects(poseScene.userData.modelHolder.children,true)[0];
  if(hit){var o=hit.object;while(o&&!o.userData.targetId)o=o.parent;
    if(o&&o.userData.targetId){state.selTarget=o.userData.targetId;renderPanel();toast('Selected '+o.userData.targetId);}}}
function frameCurrent(){frameObject(poseScene.userData.modelHolder,vs);syncZoomKnob();invalidate();}

function updateCam(){var sp=Math.sin(vs.ph);
  vs.cam.position.set(vs.tx+vs.rad*sp*Math.cos(vs.th),vs.ty+vs.rad*Math.cos(vs.ph),vs.tz+vs.rad*sp*Math.sin(vs.th));vs.cam.lookAt(vs.tx,vs.ty,vs.tz);}
function curSlot(){if(active.view==='export')return null;return $('#slot-'+active.view);}
function resizeActive(){var slot=curSlot();if(!slot)return;var r=slot.getBoundingClientRect();if(r.width<2||r.height<2)return;
  renderer.setSize(r.width,r.height);vs.cam.aspect=r.width/r.height;vs.cam.updateProjectionMatrix();}

/* ---------------- RotBall orbit gizmo (same math as index.html, scoped to the single `vs`) ---------------- */
var RotBall={el:null,ctx:null,_px:null,_py:null,
  init:function(){this.el=$('#rotBall');if(!this.el)return;this.ctx=this.el.getContext('2d');var self=this;
    this.el.addEventListener('pointerdown',function(e){e.stopPropagation();self.el.setPointerCapture(e.pointerId);self._px=e.clientX;self._py=e.clientY;});
    this.el.addEventListener('pointermove',function(e){if(self._px==null)return;var dx=e.clientX-self._px,dy=e.clientY-self._py;self._px=e.clientX;self._py=e.clientY;
      vs.th+=dx*.013;vs.ph=clamp(vs.ph-dy*.013,.1,1.5);updateCam();self.draw();invalidate();});
    this.el.addEventListener('pointerup',function(){self._px=self._py=null;});
    this.el.addEventListener('pointercancel',function(){self._px=self._py=null;});},
  show:function(v){if(this.el)this.el.style.display=v?'block':'none';},
  draw:function(){
    if(!this.el||!this.ctx)return;var c=this.ctx,S=80,cx=40,cy=40,R=34;
    c.clearRect(0,0,S,S);
    c.fillStyle='rgba(255,255,255,.78)';c.beginPath();c.arc(cx,cy,R,0,Math.PI*2);c.fill();
    c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=1;c.beginPath();c.arc(cx,cy,R,0,Math.PI*2);c.stroke();
    var cam=vs.cam;
    var items=[
      {dir:new THREE.Vector3().setFromMatrixColumn(cam.matrix,0),l:'X',fc:'#ff6b78',bc:'#f0c9ce'},
      {dir:new THREE.Vector3().setFromMatrixColumn(cam.matrix,1),l:'Y',fc:'#3fae72',bc:'#cfe9d8'},
      {dir:new THREE.Vector3().setFromMatrixColumn(cam.matrix,2).negate(),l:'Z',fc:'#2a8fd6',bc:'#cfe3f5'}
    ].map(function(a){return {x:cx+a.dir.x*(R-12),y:cy-a.dir.y*(R-12),z:a.dir.z,l:a.l,fc:a.fc,bc:a.bc};});
    items.slice().sort(function(a,b){return a.z-b.z;}).forEach(function(it){
      var front=it.z>=0,col=front?it.fc:it.bc,r=front?6:4;
      c.strokeStyle=col;c.lineWidth=front?2.5:1.5;
      c.beginPath();c.moveTo(cx,cy);c.lineTo(it.x,it.y);c.stroke();
      c.fillStyle=col;c.beginPath();c.arc(it.x,it.y,r,0,Math.PI*2);c.fill();
      if(front){c.fillStyle='rgba(0,0,0,.8)';c.font='bold 9px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(it.l,it.x,it.y);}});}};

/* ═══════════════════════════════════════════════════════
   MODEL SYSTEM + BRIDGE (reads/writes the same project-JSON
   shape and AUTOSAVE_KEY as index.html — see buildProjectData/
   loadProject there. Deform modifiers are NOT re-applied here;
   this scaffold consumes each part's baked base geometry only.)
   ═══════════════════════════════════════════════════════ */
var AUTOSAVE_KEY='roxyAutosave'; // same key index.html autosaves the modeling project under
var state={models:[],activeId:null,selTarget:null};
var idc=1;function uid(){return 'm'+(idc++);}
var Registry={}; // targetId -> live THREE.Object3D, the whole animation system resolves against this
function registerTarget(id,obj){Registry[id]=obj;if(obj&&obj.userData)obj.userData.targetId=id;} // Wave C4: constraint objects are plain JS records with no userData — guard rather than crash
function resolveTarget(id){return Registry[id];}

function clearModels(){var h=poseScene.userData.modelHolder;while(h.children.length)h.remove(h.children[0]);
  state.models.length=0;state.activeId=null;state.selTarget=null;
  // clear in place (not a reassign) so outstanding refs stay live — but never touch entries the
  // Armature/Rig system owns (RigTargetIds), so rigs survive a model bridge/reload/demo-rebuild.
  for(var k in Registry)if(!RigTargetIds[k])delete Registry[k];}

function partsToModel(md){
  var grp=new THREE.Group();grp.name=md.name||'Model';
  (md.parts||[]).forEach(function(pp){
    var g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pp.pos||[],3));
    if(pp.uv)g.setAttribute('uv',new THREE.Float32BufferAttribute(pp.uv,2));
    if(pp.index)g.setIndex(pp.index);
    g.computeVertexNormals();
    var mat=new THREE.MeshPhysicalMaterial({color:pp.color?new THREE.Color(pp.color).getHex():0xcfcfcf,
      roughness:pp.rough!=null?pp.rough:.65,metalness:pp.metal||0,envMapIntensity:1});
    if(pp.emissive)mat.emissive.set(pp.emissive);
    if(pp.emInt!=null)mat.emissiveIntensity=pp.emInt;
    if(pp.opacity!=null)mat.opacity=pp.opacity;
    if(pp.transmission&&'transmission' in mat)mat.transmission=pp.transmission;
    if(pp.clearcoat&&'clearcoat' in mat)mat.clearcoat=pp.clearcoat;
    mat.transparent=(mat.opacity<1)||(mat.transmission>0);
    if(pp.map){var im=new Image();im.onload=function(){var tx=new THREE.Texture(im);tx.encoding=THREE.sRGBEncoding;tx.needsUpdate=true;
      mat.map=tx;mat.color.setHex(0xffffff);mat.needsUpdate=true;invalidate();};im.src=pp.map;}
    var mesh=new THREE.Mesh(g,mat);mesh.castShadow=true;mesh.receiveShadow=true;grp.add(mesh);});
  return grp;}

function loadProjectData(data){
  if(!data||!data.models||!data.models.length)return false;
  clearModels();
  data.models.forEach(function(md){
    var grp=partsToModel(md);
    poseScene.userData.modelHolder.add(grp);
    state.models.push(grp);
    var gid=md.id||uid();
    registerTarget(gid,grp);
    grp.children.forEach(function(mesh,i){registerTarget(gid+'.part'+i,mesh);});});
  state.activeId=state.models[0].userData.targetId;
  state.selTarget=state.activeId;
  frameObject(poseScene.userData.modelHolder,vs);
  invalidate();return true;}

function bridgeLoadModelProject(){
  var raw;try{raw=localStorage.getItem(AUTOSAVE_KEY);}catch(e){return false;}
  if(!raw)return false;
  var data;try{data=JSON.parse(raw);}catch(e){return false;}
  return loadProjectData(data);}

/* built-in demo figure: a simple multi-part primitive humanoid so every later wave
   (armatures, IK, keyframing) has something to rig even with no modeler autosave yet */
function buildDemoFigure(){

  var armR=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.6,10),mat(0xffb3c6));armR.position.set(.36,1.2,0);armR.rotation.z=-.15;
  var legL=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.7,10),mat(0x6cc6ff));legL.position.set(-.16,.45,0);

  Object.keys(parts).forEach(function(k){var m=parts[k];m.castShadow=true;m.receiveShadow=true;root.add(m);registerTarget('demo.'+k,m);});

/* ═══════════════════════════════════════════════════════
   ARMATURE / RIG SYSTEM (Wave C1) — bones live as a
   THREE.Bone hierarchy + THREE.Skeleton per armature, with
   octahedral visual meshes (Blender-style) parented to each
   Bone so posing (bone.quaternion) automatically carries the
   visuals and any child bones along.

   Rig  = { id, name, bones:[Bone], root:THREE.Group, skeleton:THREE.Skeleton }
   Bone = { id, name, head:Vector3, tail:Vector3, parentId, bone:THREE.Bone,
            mesh, wire, headJoint, tailJoint, rig }
     - head/tail are stored in ARMATURE-LOCAL space (rig.root has no transform,
       so this is effectively world space) and are the REST/BIND shape —
       authoritative source of truth for the edit-mode skeleton.
     - Every bone's REST local quaternion is identity (bones are NOT rolled to
       align their local +Y with head->tail, unlike Blender's convention) —
       a deliberate simplification: bone.position is simply derived as
       (head - parentHead), so Edit-mode reshaping is decoupled per-joint
       (dragging a parent's tail does not drag a child's head — "disconnected"
       bones in Blender terms) while Pose-mode rotation (bone.quaternion) still
       produces correct hierarchical FK, since children are positioned in the
       bone's local frame regardless of what that frame's rest orientation is.
     - Registry targetId for a bone: `<rigId>/bone:<boneName>` (e.g. 'rig1/bone:Spine').
       Renaming a bone re-keys the Registry entry AND rewrites any existing
       Anim track targetIds so keyed animation survives a rename.
   ═══════════════════════════════════════════════════════ */
var Rigs={}; // rigId -> Rig
var rigIdc=1;function mkRigId(){return 'rig'+(rigIdc++);}
var boneIdc=1;function mkBoneId(){return 'bone'+(boneIdc++);}
var RigTargetIds={}; // targetId -> true, for Registry entries owned by the rig system
                      // (clearModels() must not wipe these out on a model bridge/reload)
function registerRigTarget(id,obj){registerTarget(id,obj);RigTargetIds[id]=true;}
function boneTargetId(rigId,boneName){return rigId+'/bone:'+boneName;}

function pad3(n){n=''+n;while(n.length<3)n='0'+n;return n;}
function uniqueBoneName(rig,base,excludeId){
  var n=base,i=1;
  while(rig.bones.some(function(b){return b.name===n&&b.id!==excludeId;}))n=base+'.'+pad3(i++);
  return n;}
function mirrorName(name){
  if(/\.L$/.test(name))return name.slice(0,-2)+'.R';
  if(/\.R$/.test(name))return name.slice(0,-2)+'.L';
  return name+'.R';}

function findBone(rig,boneId){for(var i=0;i<rig.bones.length;i++)if(rig.bones[i].id===boneId)return rig.bones[i];return null;}
function collectSubtree(rig,rootId){ // root + all descendants, parent-before-child order
  var root=findBone(rig,rootId);if(!root)return [];
  var result=[root],queue=[root];
  while(queue.length){var cur=queue.shift();
    rig.bones.forEach(function(b){if(b.parentId===cur.id){result.push(b);queue.push(b);}});}
  return result;}
function syncSkeleton(rig){rig.skeleton=new THREE.Skeleton(rig.bones.map(function(b){return b.bone;}));}

/* ---------------- bone visual (Blender-style octahedral bone + joint spheres) ----------------
   Rendered depthTest:false + high renderOrder (same tradeoff as index.html's Gizmo) so bones
   stay legible even when they sit inside the mesh being rigged, at the cost of never being
   properly occluded by geometry in front of them — the right call for a posing tool where
   seeing every bone matters more than depth realism. */
var BONE_GEO=null,JOINT_GEO=null;
function boneGeo(){if(BONE_GEO)return BONE_GEO;
  var w=.09,wy=.13; // waist ring radius / height-fraction, tuned to look like Blender's octahedral bone widget
  var verts=[0,0,0, w,wy,0, 0,wy,w, -w,wy,0, 0,wy,-w, 0,1,0];
  var idx=[0,1,2, 0,2,3, 0,3,4, 0,4,1, 5,2,1, 5,3,2, 5,4,3, 5,1,4];
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.setIndex(idx);g.computeVertexNormals();BONE_GEO=g;return g;}
function jointGeo(){if(JOINT_GEO)return JOINT_GEO;JOINT_GEO=new THREE.SphereGeometry(1,10,8);return JOINT_GEO;}
function boneMaterial(){return new THREE.MeshBasicMaterial({color:0x8fd6ff,transparent:true,opacity:.55,depthTest:false});}
function buildBoneVisual(be){
  var mesh=new THREE.Mesh(boneGeo(),boneMaterial());mesh.renderOrder=999;
  var wire=new THREE.LineSegments(new THREE.EdgesGeometry(boneGeo()),
    new THREE.LineBasicMaterial({color:0x0b2030,transparent:true,opacity:.6,depthTest:false}));wire.renderOrder=1000;
  mesh.add(wire);
  var headJ=new THREE.Mesh(jointGeo(),new THREE.MeshBasicMaterial({color:0x7bd8ff,depthTest:false}));
  headJ.scale.setScalar(.035);headJ.renderOrder=1001;
  var tailJ=new THREE.Mesh(jointGeo(),new THREE.MeshBasicMaterial({color:0xff9ac2,depthTest:false}));
  tailJ.scale.setScalar(.03);tailJ.renderOrder=1001;
  be.bone.add(mesh);be.bone.add(headJ);be.bone.add(tailJ);
  be.mesh=mesh;be.wire=wire;be.headJoint=headJ;be.tailJoint=tailJ;
  mesh.userData.boneRef=be;headJ.userData.boneRef=be;headJ.userData.jointKind='head';
  tailJ.userData.boneRef=be;tailJ.userData.jointKind='tail';
  updateBoneVisualShape(be);}
function updateBoneVisualShape(be){
  var dir=be.tail.clone().sub(be.head),len=Math.max(dir.length(),1e-4);
  be.mesh.scale.set(1,len,1);
  be.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  be.tailJoint.position.copy(dir);be.headJoint.position.set(0,0,0);}
function setBoneSelVisual(be,sel){be.mesh.material.color.setHex(sel?0xffd27a:0x8fd6ff);be.mesh.material.opacity=sel?.95:.55;}

/* ---------------- rig / bone construction ---------------- */
function newRigWithId(id,name){
  var numId=+(''+id).replace(/\D/g,'');if(!isNaN(numId)&&numId>=rigIdc)rigIdc=numId+1;
  var root=new THREE.Group();root.name=name||'Armature';
  poseScene.userData.armatureHolder.add(root);
  var rig={id:id,name:name||'Armature',bones:[],root:root,skeleton:null};
  Rigs[id]=rig;registerRigTarget(id,root);syncSkeleton(rig);return rig;}
function newRig(name){return newRigWithId(mkRigId(),name);}

function addBoneWithId(rig,id,name,head,tail,parentId){
  var numId=+(''+id).replace(/\D/g,'');if(!isNaN(numId)&&numId>=boneIdc)boneIdc=numId+1;
  name=uniqueBoneName(rig,name||'Bone',null);
  var bone=new THREE.Bone();bone.name=name;
  var be={id:id,name:name,head:head.clone(),tail:tail.clone(),parentId:parentId||null,bone:bone,rig:rig,limits:null,constraints:[]};
  rig.bones.push(be);
  var parentObj=rig.root,parentHead=new THREE.Vector3(0,0,0);
  if(parentId){var pe=findBone(rig,parentId);if(pe){parentObj=pe.bone;parentHead=pe.head;}}
  parentObj.add(bone);
  bone.position.copy(head.clone().sub(parentHead));
  buildBoneVisual(be);
  registerRigTarget(boneTargetId(rig.id,name),bone);
  syncSkeleton(rig);scheduleAnimAutosave();
  return be;}
function addBone(rig,name,head,tail,parentId){return addBoneWithId(rig,mkBoneId(),name,head,tail,parentId);}

function ensureRig(){
  if(Arm.rigId&&Rigs[Arm.rigId])return Rigs[Arm.rigId];
  var rig=newRig('Armature');Arm.rigId=rig.id;scheduleAnimAutosave();return rig;}

// Reposition `be` (and its direct children) after its head/tail were mutated in place —
// the single entry point every edit-mode joint drag / rebuild goes through.
function applyBoneEdit(be){
  var rig=be.rig,parentHead=be.parentId?findBone(rig,be.parentId).head:new THREE.Vector3(0,0,0);
  be.bone.position.copy(be.head.clone().sub(be.parentId?parentHead:new THREE.Vector3(0,0,0)));
  updateBoneVisualShape(be);
  rig.bones.forEach(function(c){if(c.parentId===be.id)c.bone.position.copy(c.head.clone().sub(be.head));});
  scheduleAnimAutosave();}

// Re-parent `childId` under `parentId` (or un-parent if null), keeping world position —
// safe because rest quaternions are identity, so recomputing position=head-parentHead
// exactly reproduces the child's unchanged world-space head. Refuses cycles.
function setBoneParent(rig,childId,parentId){
  var child=findBone(rig,childId);if(!child||parentId===childId)return false;
  if(parentId){var walk=findBone(rig,parentId);while(walk){if(walk.id===childId)return false;walk=walk.parentId?findBone(rig,walk.parentId):null;}}
  if(child.bone.parent)child.bone.parent.remove(child.bone);
  var parentObj=rig.root,parentHead=new THREE.Vector3(0,0,0);
  if(parentId){var pe=findBone(rig,parentId);if(pe){parentObj=pe.bone;parentHead=pe.head;}}
  parentObj.add(child.bone);
  child.parentId=parentId||null;
  child.bone.position.copy(child.head.clone().sub(parentHead));
  scheduleAnimAutosave();return true;}

function deleteBoneAndDescendants(rig,boneId){
  var doomed=collectSubtree(rig,boneId),ids={};doomed.forEach(function(b){ids[b.id]=true;});
  doomed.forEach(function(b){
    var tid=boneTargetId(rig.id,b.name);delete Registry[tid];delete RigTargetIds[tid];
    (b.constraints||[]).forEach(function(c){if(c.type!=='limitRot'){var cid=constraintTargetId(tid,c);
      delete Registry[cid];delete RigTargetIds[cid];
      Anim.tracks=Anim.tracks.filter(function(tr){return tr.targetId!==cid;});}});
    if(b.bone.parent)b.bone.parent.remove(b.bone);
    Anim.tracks=Anim.tracks.filter(function(tr){return tr.targetId!==tid;});
    removeConstraintsTargeting(tid); // Wave C4: drop dangling references from OTHER bones/objects
  });
  rig.bones=rig.bones.filter(function(b){return !ids[b.id];});
  if(Arm.selBoneId&&ids[Arm.selBoneId])Arm.selBoneId=null;
  syncSkeleton(rig);scheduleAnimAutosave();}

function renameBone(rig,boneId,newName){
  var be=findBone(rig,boneId);if(!be)return;
  newName=uniqueBoneName(rig,newName,be.id);
  var oldTid=boneTargetId(rig.id,be.name),newTid=boneTargetId(rig.id,newName);
  if(oldTid===newTid)return;
  delete Registry[oldTid];delete RigTargetIds[oldTid];
  be.name=newName;be.bone.name=newName;
  registerRigTarget(newTid,be.bone);
  Anim.tracks.forEach(function(tr){if(tr.targetId===oldTid)tr.targetId=newTid;});
  (be.constraints||[]).forEach(function(c){if(c.type!=='limitRot'){ // Wave C4: rekey this bone's own constraint-influence targets
    var oldCid=oldTid+'/con:'+c.id,newCid=newTid+'/con:'+c.id;
    if(Registry[oldCid]){delete Registry[oldCid];delete RigTargetIds[oldCid];}
    registerRigTarget(newCid,c);
    Anim.tracks.forEach(function(tr){if(tr.targetId===oldCid)tr.targetId=newCid;});}});
  retargetConstraints(oldTid,newTid); // Wave C4: fix up any OTHER bone/object's constraint that targeted this bone
  if(state.selTarget===oldTid)state.selTarget=newTid;
  scheduleAnimAutosave();}

// Duplicate the selected bone + all its descendants mirrored across armature-local X,
// swapping .L/.R name suffixes (appending .R when the original has neither). The mirrored
// root keeps the SAME parent as the original (so e.g. Arm.R hangs off the same Shoulder
// Arm.L does) — standard rigging convention.
function mirrorChainX(rig,rootBoneId){
  var root=findBone(rig,rootBoneId);if(!root)return null;
  var subtree=collectSubtree(rig,rootBoneId),idMap={};
  subtree.forEach(function(orig){
    var nh=orig.head.clone();nh.x=-nh.x;var nt=orig.tail.clone();nt.x=-nt.x;
    var newParentId=(orig.id===root.id)?root.parentId:idMap[orig.parentId];
    var nb=addBone(rig,mirrorName(orig.name),nh,nt,newParentId);
    idMap[orig.id]=nb.id;});
  scheduleAnimAutosave();return idMap[root.id];}

function resetBonePose(be){be.bone.quaternion.identity();scheduleAnimAutosave();}
function resetAllPose(rig){rig.bones.forEach(function(b){b.bone.quaternion.identity();});scheduleAnimAutosave();}

function selectBone(rig,boneId){
  if(Arm.selBoneId){var prev=findBone(rig,Arm.selBoneId);if(prev)setBoneSelVisual(prev,false);}
  Arm.rigId=rig.id;Arm.selBoneId=boneId;
  var be=findBone(rig,boneId);
  if(be){setBoneSelVisual(be,true);state.selTarget=boneTargetId(rig.id,be.name);}
  invalidate();}

/* ---------------- edit-mode tool state + chain-extend / parent-pick flows ----------------
   "Add Bone"/"Add Child" mirror EM.extrude's click-to-extend mobile UX (GAP_ANALYSIS §3):
   arm the tool, then each viewport TAP extends the chain by one more bone. */
var Arm={mode:'edit',rigId:null,selBoneId:null,chainActive:false,chainRigId:null,chainAnchor:null,chainLastBoneId:null,parentPickActive:false,
  axisMode:'free', // Wave C3: 'free' (trackball drag, C1 behavior) | 'x'|'y'|'z' (constrain FK drag to one local axis)
  ikOn:false,ikChainLen:2,ikChainBoneIds:null,ikTargetPos:null,ikPoleOn:false,ikPolePos:null, // Wave C3: IK toggle state
  addConType:null}; // Wave C4: transient — which constraint-type chip was tapped, showing the target picker now
function setArmMode(mode){
  var rig=Rigs[Arm.rigId];
  if(mode==='edit'){Arm.chainActive=false;Arm.parentPickActive=false;
    if(Arm.ikOn)setIkOn(false); // IK handles are a Pose-mode-only overlay
    if(rig)rig.bones.forEach(function(b){b.bone.quaternion.identity();});} // Edit mode always shows/edits the bind pose (see file header note)
  Arm.mode=mode;renderPanel();invalidate();}

/* ---------------- raycasting helpers ---------------- */
function screenDeltaToWorld(dx,dy){ // same math as index.html's screenDeltaToWorld, scoped to this file's `vs`
  var right=new THREE.Vector3().setFromMatrixColumn(vs.cam.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(vs.cam.matrix,1);
  var k=vs.rad*.0016;return new THREE.Vector3().addScaledVector(right,dx*k).addScaledVector(up,-dy*k);}
function ndcFromEvent(e){var r=dom.getBoundingClientRect();return {x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1};}

  var ray=new THREE.Raycaster();ray.setFromCamera(ndcFromEvent({clientX:cx,clientY:cy}),vs.cam);
  var hit=new THREE.Vector3();return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-1),hit)?hit:new THREE.Vector3(0,1,0);}
function workPlaneRaycast(cx,cy,planePoint){
  var ray=new THREE.Raycaster();ray.setFromCamera(ndcFromEvent({clientX:cx,clientY:cy}),vs.cam);
  var camDir=new THREE.Vector3();vs.cam.getWorldDirection(camDir);
  var plane=new THREE.Plane().setFromNormalAndCoplanarPoint(camDir,planePoint);
  var hit=new THREE.Vector3();return ray.ray.intersectPlane(plane,hit)?hit:null;}
function hitBoneMesh(e){var rig=Rigs[Arm.rigId];if(!rig||!rig.bones.length)return null;
  var ray=new THREE.Raycaster();ray.setFromCamera(ndcFromEvent(e),vs.cam);
  var h=ray.intersectObjects(rig.bones.map(function(b){return b.mesh;}),false)[0];if(!h)return null;
  var be=h.object.userData.boneRef;return {rig:rig,id:be.id,name:be.name,be:be};}
function hitJoint(e){var rig=Rigs[Arm.rigId];if(!rig||!rig.bones.length)return null;
  var joints=[];rig.bones.forEach(function(b){joints.push(b.headJoint,b.tailJoint);});
  var ray=new THREE.Raycaster();ray.setFromCamera(ndcFromEvent(e),vs.cam);
  var h=ray.intersectObjects(joints,false)[0];if(!h)return null;
  return {be:h.object.userData.boneRef,which:h.object.userData.jointKind};}

/* ---------------- edit-mode joint drag / pose-mode trackball drag ---------------- */

  var delta=screenDeltaToWorld(dx,dy),be=jointDrag.be;

  applyBoneEdit(be);invalidate();}

// Trackball-style free rotation (chosen over an axis-chip scheme, see GAP_ANALYSIS §3 —
// simpler to make touch-reliable than picking an axis first): drag right/left spins the
// bone about the camera's current up vector, drag up/down about its current right vector,
// both re-expressed in the bone's PARENT-local frame so the result composes correctly
// through the FK chain regardless of how the parent itself is currently posed.
// Wave C3 adds Arm.axisMode: when not 'free', the drag is constrained to one of the
// bone's own local axes instead (more controllable on touch for e.g. elbow bends) — see
// applyAxisRotationStep below.
function dragPoseMove(e){
  var dx=e.clientX-poseDrag.px,dy=e.clientY-poseDrag.py;poseDrag.px=e.clientX;poseDrag.py=e.clientY;
  if(!dx&&!dy)return;
  var be=poseDrag.be,k=.01;
  if(Arm.axisMode!=='free'){applyAxisRotationStep(be,Arm.axisMode,dx*k);return;}
  var parent=be.bone.parent;
  parent.updateWorldMatrix(true,false);
  var pq=new THREE.Quaternion();parent.getWorldQuaternion(pq);var pqInv=pq.clone().invert();
  var camRight=new THREE.Vector3().setFromMatrixColumn(vs.cam.matrix,0).applyQuaternion(pqInv);
  var camUp=new THREE.Vector3().setFromMatrixColumn(vs.cam.matrix,1).applyQuaternion(pqInv);
  var qYaw=new THREE.Quaternion().setFromAxisAngle(camUp,-dx*k),qPitch=new THREE.Quaternion().setFromAxisAngle(camRight,-dy*k);
  var delta=qYaw.multiply(qPitch);

  clampBoneRotation(be);
  scheduleAnimAutosave();invalidate();}

/* ═══════════════════════════════════════════════════════
   Wave C3 — per-axis FK, rotation limits, CCD IK, pole target.

   - Arm.axisMode constrains dragPoseMove to one local axis (applyAxisRotationStep).
   - setBoneEulerAxisDeg is the tap-to-type numeric fallback for exact-degree posing
     (drives the three "Rot X/Y/Z °" sliders in panelArmPose — each is itself
     tap-to-type via slider()'s label, per the app-wide numeric-entry convention).
   - be.limits = {x:[min,max]|null, y:..., z:...} (radians), default null per axis
     (unlimited). Enforced by clampBoneRotation after every FK drag/type AND inside
     every solveIK iteration (see below) — this is deliberately the same clamp
     entry point FK and IK both go through, so it doubles as C4's future "Limit
     Rotation" constraint groundwork. Approach: decompose the live quaternion to
     Euler XYZ, clamp any axis that has a limit, recompose — a known simplification
     (gimbal-order-dependent near ±90° on other axes) acceptable for a posing tool.
   ═══════════════════════════════════════════════════════ */
var AX_X=new THREE.Vector3(1,0,0),AX_Y=new THREE.Vector3(0,1,0),AX_Z=new THREE.Vector3(0,0,1);

  ['x','y','z'].forEach(function(ax){var L=lim[ax];if(L){var v=clamp(e[ax],L[0],L[1]);
    if(Math.abs(v-e[ax])>1e-9){e[ax]=v;changed=true;}}});
  if(changed)be.bone.quaternion.setFromEuler(e);}

function setBoneLimit(be,axis,min,max){ // min/max in radians; either null clears that axis's limit
  if(!be.limits)be.limits={x:null,y:null,z:null};
  be.limits[axis]=(min==null||max==null)?null:[min,max];
  clampBoneRotation(be);scheduleAnimAutosave();invalidate();}

// Pure rotation step around one of the bone's own LOCAL axes (post-multiplied, so the
// axis is expressed in the bone's currently-rotated frame — i.e. repeated calls rotate
// around the bone's own current local X/Y/Z, matching how the axis chip is described:
// "constrain the drag rotation to the bone's local axis").
function applyAxisRotationStep(be,axis,angle){
  var axisVec=axis==='x'?AX_X:(axis==='y'?AX_Y:AX_Z);
  var dq=new THREE.Quaternion().setFromAxisAngle(axisVec,angle);
  be.bone.quaternion.multiply(dq).normalize();
  clampBoneRotation(be);
  scheduleAnimAutosave();invalidate();return be.bone.quaternion;}

function boneEulerDeg(be){var e=new THREE.Euler().setFromQuaternion(be.bone.quaternion,'XYZ');
  return {x:e.x*180/Math.PI,y:e.y*180/Math.PI,z:e.z*180/Math.PI};}
function setBoneEulerAxisDeg(be,axis,deg){ // tap-to-type exact-degree entry for one axis, others held at their current decomposed value
  var e=new THREE.Euler().setFromQuaternion(be.bone.quaternion,'XYZ');

/* ---------------- CCD IK solver (Wave C3) ----------------
   solveIK(chainBEs, targetPos, iterations, opts): cyclic coordinate descent over an
   N-bone chain. chainBEs is ROOT -> TIP ordered (2-4 Bone records, see buildIkChain).
   Each iteration sweeps from the TIP-most rotatable joint back to the ROOT: for joint i,
   rotate be[i]'s LOCAL quaternion by the minimal-angle rotation that swings the current
   chain-tip position toward targetPos, pivoting about that joint's head. The per-step
   angle is clamped (opts.maxStep, default .35 rad) for stability on long/fast drags, and
   every joint rotation is immediately re-clamped by clampBoneRotation so IK respects the
   same per-bone limits FK does. The sweep repeats for `iterations` passes or until the
   tip is within opts.tolerance (default .01 world units) of the target — whichever first;
   an unreachable target simply straightens the chain to point at it (classic CCD
   behavior), it does not diverge or NaN.
   opts.pole (optional THREE.Vector3, world space): bias the chain's bend PLANE toward a
   pole target after each sweep — see applyPoleBend for the approach and its documented
   2-3-bone-chain scope. */
function solveIK(chainBEs,targetPos,iterations,opts){
  opts=opts||{};

  var pole=opts.pole||null;
  if(!chainBEs||chainBEs.length<2||!targetPos)return;
  var rig=chainBEs[0].rig;
  rig.root.updateMatrixWorld(true);
  var tipBE=chainBEs[chainBEs.length-1];
  for(var iter=0;iter<iterations;iter++){
    for(var i=chainBEs.length-1;i>=0;i--){
      var be=chainBEs[i];
      be.bone.updateMatrixWorld(true);
      var jointPos=new THREE.Vector3();be.headJoint.getWorldPosition(jointPos);
      var tipPos=new THREE.Vector3();tipBE.tailJoint.getWorldPosition(tipPos);
      var toTip=tipPos.clone().sub(jointPos),toTarget=targetPos.clone().sub(jointPos);
      if(toTip.lengthSq()<1e-10||toTarget.lengthSq()<1e-10)continue;
      toTip.normalize();toTarget.normalize();

      if(angle<1e-6)continue;
      var axis=new THREE.Vector3().crossVectors(toTip,toTarget);
      if(axis.lengthSq()<1e-10)continue; // toTip/toTarget anti-parallel: no well-defined swing axis, skip this joint this pass
      axis.normalize();

      var curWorldQ=new THREE.Quaternion();be.bone.getWorldQuaternion(curWorldQ);
      var newWorldQ=worldQ.multiply(curWorldQ);

      var newLocalQ=parentWorldQ.clone().invert().multiply(newWorldQ);

      clampBoneRotation(be);
      be.bone.updateMatrixWorld(true);

    if(pole)applyPoleBend(chainBEs,pole);
    var tp2=new THREE.Vector3();tipBE.tailJoint.getWorldPosition(tp2);
    if(tp2.distanceTo(targetPos)<tol)break;

// Pole vector / bend-direction bias: standard pole-vector IK re-derives each internal
// joint's swing around the root-tip axis individually; as a FEASIBLE simplification for
// a compact mobile posing tool (2-3 bone chains, per GAP_ANALYSIS §4 C3) this instead
// rotates the whole chain's ROOT bone about the root->tip axis by just enough to swing
// the chain's single dominant "elbow" (the middle bone's head joint) onto the pole's
// side of the root-tip line. For a 4-bone chain only that first internal joint is
// biased — documented scope, not a full per-joint pole solve. Called once per solveIK
// sweep so it composes with the CCD tip-correction on the next sweep.
function applyPoleBend(chainBEs,polePos){

  var rootBE=chainBEs[0],tipBE=chainBEs[chainBEs.length-1],midBE=chainBEs[Math.floor(chainBEs.length/2)];
  rootBE.bone.updateMatrixWorld(true);
  var rootPos=new THREE.Vector3();rootBE.headJoint.getWorldPosition(rootPos);
  var tipPos=new THREE.Vector3();tipBE.tailJoint.getWorldPosition(tipPos);
  var midPos=new THREE.Vector3();midBE.headJoint.getWorldPosition(midPos);
  var axis=tipPos.clone().sub(rootPos);if(axis.lengthSq()<1e-10)return;axis.normalize();
  function offAxis(p){var d=p.clone().sub(rootPos);return d.sub(axis.clone().multiplyScalar(d.dot(axis)));}
  var poleProj=offAxis(polePos),midProj=offAxis(midPos);

  poleProj.normalize();midProj.normalize();
  var dot=clamp(midProj.dot(poleProj),-1,1),cross=new THREE.Vector3().crossVectors(midProj,poleProj);
  var sign=cross.dot(axis)>=0?1:-1,angle=sign*Math.acos(dot);

  var worldQ=new THREE.Quaternion().setFromAxisAngle(axis,angle);
  var curWorldQ=new THREE.Quaternion();rootBE.bone.getWorldQuaternion(curWorldQ);
  var newWorldQ=worldQ.multiply(curWorldQ);
  var parentWorldQ=new THREE.Quaternion();if(rootBE.bone.parent)rootBE.bone.parent.getWorldQuaternion(parentWorldQ);
  var newLocalQ=parentWorldQ.clone().invert().multiply(newWorldQ);
  rootBE.bone.quaternion.copy(newLocalQ).normalize();
  clampBoneRotation(rootBE);
  rootBE.bone.updateMatrixWorld(true);}

/* ---------------- IK interaction: chain selection + draggable target/pole handles (Wave C3) ----------------
   Arm.ikOn arms IK inside Pose mode. With it on, tapping a bone in the viewport defines
   that bone as the CHAIN TIP (ikSelectTip): the chain is that bone plus its nearest
   Arm.ikChainLen-1 ancestors (buildIkChain), root->tip. A small sphere "IK target"
   handle (yellow) appears at the chain's current tip world position; dragging it
   re-solves the chain live every pointermove (dragIkMove -> runIkSolve -> solveIK). On
   release nothing needs to be "applied" — the solved pose already IS the bones' current
   quaternions, so it is immediately keyable via the normal FK "Key Rotation" button and
   slerp-samples through Anim like any other pose (see panelArmPose's Key Rotation, and
   Anim.sample's quaternion slerp path). An optional second sphere handle (green) defines
   the pole/bend-direction target (only offered for chains of 2-3 bones, see
   applyPoleBend). The target/pole handles are scene gizmos, not part of the rig data

   "keep the target as a scene handle while IK toggle is on, clear on toggle off" spec. */

    ikTargetMesh.scale.setScalar(.045);ikTargetMesh.renderOrder=1002;ikTargetMesh.visible=false;
    ikTargetMesh.userData.ikHandle='target';poseScene.userData.armatureHolder.add(ikTargetMesh);}
  if(!ikPoleMesh){ikPoleMesh=new THREE.Mesh(ikHandleGeo(),new THREE.MeshBasicMaterial({color:0x8fffb0,depthTest:false,transparent:true,opacity:.92}));
    ikPoleMesh.scale.setScalar(.035);ikPoleMesh.renderOrder=1002;ikPoleMesh.visible=false;
    ikPoleMesh.userData.ikHandle='pole';poseScene.userData.armatureHolder.add(ikPoleMesh);}}
function buildIkChain(rig,tipBoneId,len){ // returns [rootId...tipId], up to `len` bones, root-most bone first
  var chain=[],cur=findBone(rig,tipBoneId);
  while(cur&&chain.length<len){chain.unshift(cur.id);cur=cur.parentId?findBone(rig,cur.parentId):null;}
  return chain;}

    ikTargetMesh.visible=false;ikPoleMesh.visible=false;return;}
  Arm.ikChainBoneIds=chain;
  var tipBE=findBone(rig,chain[chain.length-1]);
  rig.root.updateMatrixWorld(true);
  var tp=new THREE.Vector3();tipBE.tailJoint.getWorldPosition(tp);
  Arm.ikTargetPos=tp;ikTargetMesh.position.copy(tp);ikTargetMesh.visible=true;

    if(!Arm.ikPolePos){var rootBE=findBone(rig,chain[0]);var rp=new THREE.Vector3();rootBE.headJoint.getWorldPosition(rp);
      Arm.ikPolePos=rp.clone().add(new THREE.Vector3(0,0,1));}
    ikPoleMesh.position.copy(Arm.ikPolePos);ikPoleMesh.visible=true;
  }else ikPoleMesh.visible=false;

function setIkOn(on){
  Arm.ikOn=!!on;

    if(ikTargetMesh)ikTargetMesh.visible=false;if(ikPoleMesh)ikPoleMesh.visible=false;}
  renderPanel();invalidate();}
function setIkPoleOn(on){
  Arm.ikPoleOn=!!on;
  if(!Arm.ikPoleOn){Arm.ikPolePos=null;if(ikPoleMesh)ikPoleMesh.visible=false;}
  else if(Arm.ikChainBoneIds&&Arm.ikChainBoneIds.length<=3){var rig=Rigs[Arm.rigId];
    if(rig)ikSelectTip(rig,Arm.ikChainBoneIds[Arm.ikChainBoneIds.length-1]);}
  renderPanel();invalidate();}
function setIkChainLen(n){
  Arm.ikChainLen=clamp(Math.round(n)||2,2,4);

    if(rig)ikSelectTip(rig,Arm.ikChainBoneIds[Arm.ikChainBoneIds.length-1]);}
  renderPanel();}
function runIkSolve(){
  var rig=Rigs[Arm.rigId];if(!rig||!Arm.ikChainBoneIds||!Arm.ikTargetPos)return;
  var chainBEs=Arm.ikChainBoneIds.map(function(id){return findBone(rig,id);}).filter(Boolean);
  if(chainBEs.length<2)return;
  var opts={};if(Arm.ikPoleOn&&Arm.ikPolePos&&chainBEs.length<=3)opts.pole=Arm.ikPolePos;

  var h=ray.intersectObjects(objs,false)[0];return h?h.object.userData.ikHandle:null;}
