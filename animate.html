/* ═══════════════════════════════════════════════════════
   ARMATURE / RIG SYSTEM (Wave C1) — bones live as a
   THREE.Bone hierarchy + THREE.Skeleton per armature, with
   octahedral visual meshes (Blender-style) parented to each
   Bone so posing (bone.quaternion) automatically carries the
   visuals and any child bones along.

   Rig  = { id, name, bones:[Bone], root:THREE.Group, skeleton:THREE.Skeleton }
   Bone = { id, name, head:Vector3, tail:Vector3, parentId, bone:THREE.Bone,
            mesh, wire, headJoint, tailJoint, rig }
     - head/tail are stored in ARMATURE-LOCAL space (rig.root has no transform,
       so this is effectively world space) and are the REST/BIND shape —
       authoritative source of truth for the edit-mode skeleton.
     - Every bone's REST local quaternion is identity (bones are NOT rolled to
       align their local +Y with head->tail, unlike Blender's convention) —
       a deliberate simplification: bone.position is simply derived as
       (head - parentHead), so Edit-mode reshaping is decoupled per-joint
       (dragging a parent's tail does not drag a child's head — "disconnected"
       bones in Blender terms) while Pose-mode rotation (bone.quaternion) still
       produces correct hierarchical FK, since children are positioned in the
       bone's local frame regardless of what that frame's rest orientation is.
     - Registry targetId for a bone: `<rigId>/bone:<boneName>` (e.g. 'rig1/bone:Spine').
       Renaming a bone re-keys the Registry entry AND rewrites any existing
       Anim track targetIds so keyed animation survives a rename.
   ═══════════════════════════════════════════════════════ */
var Rigs={}; // rigId -> Rig
var rigIdc=1;function mkRigId(){return 'rig'+(rigIdc++);}
var boneIdc=1;function mkBoneId(){return 'bone'+(boneIdc++);}
var RigTargetIds={}; // targetId -> true, for Registry entries owned by the rig system
                      // (clearModels() must not wipe these out on a model bridge/reload)
function registerRigTarget(id,obj){registerTarget(id,obj);RigTargetIds[id]=true;}
function boneTargetId(rigId,boneName){return rigId+'/bone:'+boneName;}

function pad3(n){n=''+n;while(n.length<3)n='0'+n;return n;}
function uniqueBoneName(rig,base,excludeId){
  var n=base,i=1;
  while(rig.bones.some(function(b){return b.name===n&&b.id!==excludeId;}))n=base+'.'+pad3(i++);
  return n;}
function mirrorName(name){
  if(/\.L$/.test(name))return name.slice(0,-2)+'.R';
  if(/\.R$/.test(name))return name.slice(0,-2)+'.L';
  return name+'.R';}

function findBone(rig,boneId){for(var i=0;i<rig.bones.length;i++)if(rig.bones[i].id===boneId)return rig.bones[i];return null;}
function collectSubtree(rig,rootId){ // root + all descendants, parent-before-child order
  var root=findBone(rig,rootId);if(!root)return [];
  var result=[root],queue=[root];
  while(queue.length){var cur=queue.shift();
    rig.bones.forEach(function(b){if(b.parentId===cur.id){result.push(b);queue.push(b);}});}
  return result;}
function syncSkeleton(rig){rig.skeleton=new THREE.Skeleton(rig.bones.map(function(b){return b.bone;}));}

/* ---------------- bone visual (Blender-style octahedral bone + joint spheres) ----------------
   Rendered depthTest:false + high renderOrder (same tradeoff as index.html's Gizmo) so bones
   stay legible even when they sit inside the mesh being rigged, at the cost of never being
   properly occluded by geometry in front of them — the right call for a posing tool where
   seeing every bone matters more than depth realism. */
var BONE_GEO=null,JOINT_GEO=null;
function boneGeo(){if(BONE_GEO)return BONE_GEO;
  var w=.09,wy=.13; // waist ring radius / height-fraction, tuned to look like Blender's octahedral bone widget
  var verts=[0,0,0, w,wy,0, 0,wy,w, -w,wy,0, 0,wy,-w, 0,1,0];
  var idx=[0,1,2, 0,2,3, 0,3,4, 0,4,1, 5,2,1, 5,3,2, 5,4,3, 5,1,4];
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.setIndex(idx);g.computeVertexNormals();BONE_GEO=g;return g;}
function jointGeo(){if(JOINT_GEO)return JOINT_GEO;JOINT_GEO=new THREE.SphereGeometry(1,10,8);return JOINT_GEO;}
function boneMaterial(){return new THREE.MeshBasicMaterial({color:0x8fd6ff,transparent:true,opacity:.55,depthTest:false});}
function buildBoneVisual(be){
  var mesh=new THREE.Mesh(boneGeo(),boneMaterial());mesh.renderOrder=999;
  var wire=new THREE.LineSegments(new THREE.EdgesGeometry(boneGeo()),
    new THREE.LineBasicMaterial({color:0x0b2030,transparent:true,opacity:.6,depthTest:false}));wire.renderOrder=1000;
  mesh.add(wire);
  var headJ=new THREE.Mesh(jointGeo(),new THREE.MeshBasicMaterial({color:0x7bd8ff,depthTest:false}));
  headJ.scale.setScalar(.035);headJ.renderOrder=1001;
  var tailJ=new THREE.Mesh(jointGeo(),new THREE.MeshBasicMaterial({color:0xff9ac2,depthTest:false}));
  tailJ.scale.setScalar(.03);tailJ.renderOrder=1001;
  be.bone.add(mesh);be.bone.add(headJ);be.bone.add(tailJ);
  be.mesh=mesh;be.wire=wire;be.headJoint=headJ;be.tailJoint=tailJ;
  mesh.userData.boneRef=be;headJ.userData.boneRef=be;headJ.userData.jointKind='head';
  tailJ.userData.boneRef=be;tailJ.userData.jointKind='tail';
  updateBoneVisualShape(be);}
function updateBoneVisualShape(be){
  var dir=be.tail.clone().sub(be.head),len=Math.max(dir.length(),1e-4);
  be.mesh.scale.set(1,len,1);
  be.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
  be.tailJoint.position.copy(dir);be.headJoint.position.set(0,0,0);}
function setBoneSelVisual(be,sel){be.mesh.material.color.setHex(sel?0xffd27a:0x8fd6ff);be.mesh.material.opacity=sel?.95:.55;}

/* ---------------- rig / bone construction ---------------- */
function newRigWithId(id,name){
  var numId=+(''+id).replace(/\D/g,'');if(!isNaN(numId)&&numId>=rigIdc)rigIdc=numId+1;
  var root=new THREE.Group();root.name=name||'Armature';
  poseScene.userData.armatureHolder.add(root);
  var rig={id:id,name:name||'Armature',bones:[],root:root,skeleton:null};
  Rigs[id]=rig;registerRigTarget(id,root);syncSkeleton(rig);return rig;}
function newRig(name){return newRigWithId(mkRigId(),name);}

function addBoneWithId(rig,id,name,head,tail,parentId){
  var numId=+(''+id).replace(/\D/g,'');if(!isNaN(numId)&&numId>=boneIdc)boneIdc=numId+1;
  name=uniqueBoneName(rig,name||'Bone',null);
  var bone=new THREE.Bone();bone.name=name;
  var be={id:id,name:name,head:head.clone(),tail:tail.clone(),parentId:parentId||null,bone:bone,rig:rig,limits:null,constraints:[]};
  rig.bones.push(be);
  var parentObj=rig.root,parentHead=new THREE.Vector3(0,0,0);
  if(parentId){var pe=findBone(rig,parentId);if(pe){parentObj=pe.bone;parentHead=pe.head;}}
  parentObj.add(bone);
  bone.position.copy(head.clone().sub(parentHead));
  buildBoneVisual(be);
  registerRigTarget(boneTargetId(rig.id,name),bone);
  syncSkeleton(rig);scheduleAnimAutosave();
  return be;}
function addBone(rig,name,head,tail,parentId){return addBoneWithId(rig,mkBoneId(),name,head,tail,parentId);}

function ensureRig(){
  if(Arm.rigId&&Rigs[Arm.rigId])return Rigs[Arm.rigId];
  var rig=newRig('Armature');Arm.rigId=rig.id;scheduleAnimAutosave();return rig;}

// Reposition `be` (and its direct children) after its head/tail were mutated in place —
// the single entry point every edit-mode joint drag / rebuild goes through.
function applyBoneEdit(be){
  var rig=be.rig,parentHead=be.parentId?findBone(rig,be.parentId).head:new THREE.Vector3(0,0,0);
  be.bone.position.copy(be.head.clone().sub(be.parentId?parentHead:new THREE.Vector3(0,0,0)));
  updateBoneVisualShape(be);
  rig.bones.forEach(function(c){if(c.parentId===be.id)c.bone.position.copy(c.head.clone().sub(be.head));});
  scheduleAnimAutosave();}

// Re-parent `childId` under `parentId` (or un-parent if null), keeping world position —
// safe because rest quaternions are identity, so recomputing position=head-parentHead
// exactly reproduces the child's unchanged world-space head. Refuses cycles.
function setBoneParent(rig,childId,parentId){
  var child=findBone(rig,childId);if(!child||parentId===childId)return false;
  if(parentId){var walk=findBone(rig,parentId);while(walk){if(walk.id===childId)return false;walk=walk.parentId?findBone(rig,walk.parentId):null;}}
  if(child.bone.parent)child.bone.parent.remove(child.bone);
  var parentObj=rig.root,parentHead=new THREE.Vector3(0,0,0);
  if(parentId){var pe=findBone(rig,parentId);if(pe){parentObj=pe.bone;parentHead=pe.head;}}
  parentObj.add(child.bone);
  child.parentId=parentId||null;
  child.bone.position.copy(child.head.clone().sub(parentHead));
  scheduleAnimAutosave();return true;}

function deleteBoneAndDescendants(rig,boneId){
  var doomed=collectSubtree(rig,boneId),ids={};doomed.forEach(function(b){ids[b.id]=true;});
  doomed.forEach(function(b){
    var tid=boneTargetId(rig.id,b.name);delete Registry[tid];delete RigTargetIds[tid];
    (b.constraints||[]).forEach(function(c){if(c.type!=='limitRot'){var cid=constraintTargetId(tid,c);
      delete Registry[cid];delete RigTargetIds[cid];
      Anim.tracks=Anim.tracks.filter(function(tr){return tr.targetId!==cid;});}});
    if(b.bone.parent)b.bone.parent.remove(b.bone);
    Anim.tracks=Anim.tracks.filter(function(tr){return tr.targetId!==tid;});
    removeConstraintsTargeting(tid); // Wave C4: drop dangling references from OTHER bones/objects
  });
  rig.bones=rig.bones.filter(function(b){return !ids[b.id];});
  if(Arm.selBoneId&&ids[Arm.selBoneId])Arm.selBoneId=null;
  syncSkeleton(rig);scheduleAnimAutosave();}

function renameBone(rig,boneId,newName){
  var be=findBone(rig,boneId);if(!be)return;
  newName=uniqueBoneName(rig,newName,be.id);
  var oldTid=boneTargetId(rig.id,be.name),newTid=boneTargetId(rig.id,newName);
  if(oldTid===newTid)return;
  delete Registry[oldTid];delete RigTargetIds[oldTid];
  be.name=newName;be.bone.name=newName;
  registerRigTarget(newTid,be.bone);
  Anim.tracks.forEach(function(tr){if(tr.targetId===oldTid)tr.targetId=newTid;});
  (be.constraints||[]).forEach(function(c){if(c.type!=='limitRot'){ // Wave C4: rekey this bone's own constraint-influence targets
    var oldCid=oldTid+'/con:'+c.id,newCid=newTid+'/con:'+c.id;
    if(Registry[oldCid]){delete Registry[oldCid];delete RigTargetIds[oldCid];}
    registerRigTarget(newCid,c);
    Anim.tracks.forEach(function(tr){if(tr.targetId===oldCid)tr.targetId=newCid;});}});
  retargetConstraints(oldTid,newTid); // Wave C4: fix up any OTHER bone/object's constraint that targeted this bone
  if(state.selTarget===oldTid)state.selTarget=newTid;
  scheduleAnimAutosave();}

// Duplicate the selected bone + all its descendants mirrored across armature-local X,
// swapping .L/.R name suffixes (appending .R when the original has neither). The mirrored
// root keeps the SAME parent as the original (so e.g. Arm.R hangs off the same Shoulder
// Arm.L does) — standard rigging convention.
function mirrorChainX(rig,rootBoneId){
  var root=findBone(rig,rootBoneId);if(!root)return null;
  var subtree=collectSubtree(rig,rootBoneId),idMap={};
  subtree.forEach(function(orig){
    var nh=orig.head.clone();nh.x=-nh.x;var nt=orig.tail.clone();nt.x=-nt.x;
    var newParentId=(orig.id===root.id)?root.parentId:idMap[orig.parentId];
    var nb=addBone(rig,mirrorName(orig.name),nh,nt,newParentId);
    idMap[orig.id]=nb.id;});
  scheduleAnimAutosave();return idMap[root.id];}

function resetBonePose(be){be.bone.quaternion.identity();scheduleAnimAutosave();}
function resetAllPose(rig){rig.bones.forEach(function(b){b.bone.quaternion.identity();});scheduleAnimAutosave();}

function selectBone(rig,boneId){
  if(Arm.selBoneId){var prev=findBone(rig,Arm.selBoneId);if(prev)setBoneSelVisual(prev,false);}
  Arm.rigId=rig.id;Arm.selBoneId=boneId;
  var be=findBone(rig,boneId);
  if(be){setBoneSelVisual(be,true);state.selTarget=boneTargetId(rig.id,be.name);}
  invalidate();}

/* ---------------- edit-mode tool state + chain-extend / parent-pick flows ----------------
   "Add Bone"/"Add Child" mirror EM.extrude's click-to-extend mobile UX (GAP_ANALYSIS §3):
   arm the tool, then each viewport TAP extends the chain by one more bone. */
var Arm={mode:'edit',rigId:null,selBoneId:null,chainActive:false,chainRigId:null,chainAnchor:null,chainLastBoneId:null,parentPickActive:false,
  axisMode:'free', // Wave C3: 'free' (trackball drag, C1 behavior) | 'x'|'y'|'z' (constrain FK drag to one local axis)
  ikOn:false,ikChainLen:2,ikChainBoneIds:null,ikTargetPos:null,ikPoleOn:false,ikPolePos:null, // Wave C3: IK toggle state
  addConType:null}; // Wave C4: transient — which constraint-type chip was tapped, showing the target picker now
function setArmMode(mode){
  var rig=Rigs[Arm.rigId];
  if(mode==='edit'){Arm.chainActive=false;Arm.parentPickActive=false;
    if(Arm.ikOn)setIkOn(false); // IK handles are a Pose-mode-only overlay
    if(rig)rig.bones.forEach(function(b){b.bone.quaternion.identity();});} // Edit mode always shows/edits the bind pose (see file header note)
  Arm.mode=mode;renderPanel();invalidate();}

function startAddBoneChain(){var rig=ensureRig();
  Arm.chainActive=true;Arm.chainRigId=rig.id;Arm.chainLastBoneId=null;Arm.chainAnchor=null;
  toast('Tap the viewport to place the first joint, then keep tapping to extend the chain');renderPanel();}
function startAddChildChain(){var rig=Rigs[Arm.rigId];if(!rig||!Arm.selBoneId){toast('Select a bone first');return;}
  var be=findBone(rig,Arm.selBoneId);if(!be)return;
  Arm.chainActive=true;Arm.chainRigId=rig.id;Arm.chainLastBoneId=be.id;Arm.chainAnchor=be.tail.clone();
  toast('Tap the viewport to extend from '+be.name);renderPanel();}
function finishChain(){Arm.chainActive=false;Arm.chainAnchor=null;Arm.chainLastBoneId=null;renderPanel();toast('Chain finished');}
function chainExtendTo(pt){ // pure: given a target world point, add the next chain bone
  var rig=Rigs[Arm.chainRigId];if(!rig)return null;
  if(pt.distanceTo(Arm.chainAnchor)<.02){toast('Tap further away to add a bone segment');return null;}
  var be=addBone(rig,'Bone',Arm.chainAnchor.clone(),pt.clone(),Arm.chainLastBoneId);
  Arm.chainLastBoneId=be.id;Arm.chainAnchor=pt.clone();Arm.selBoneId=be.id;
  toast('Added '+be.name+' — tap to extend, or Finish Chain');renderPanel();invalidate();return be;}
function chainExtendTap(e){
  var rig=Rigs[Arm.chainRigId];if(!rig){Arm.chainActive=false;return;}
  if(Arm.chainAnchor==null){Arm.chainAnchor=groundPlaneRaycast(e.clientX,e.clientY);
    toast('Anchor placed — tap again to extend the first bone');renderPanel();return;}
  var pt=workPlaneRaycast(e.clientX,e.clientY,Arm.chainAnchor);
  if(!pt){toast('Could not project tap onto the work plane');return;}
  chainExtendTo(pt);}

function startParentPick(){if(!Arm.selBoneId){toast('Select a bone first');return;}
  Arm.parentPickActive=true;renderPanel();toast('Tap another bone to become its parent');}
function cancelParentPick(){Arm.parentPickActive=false;renderPanel();toast('Cancelled');}
function parentPickTap(e){var rig=Rigs[Arm.rigId];var hb=hitBoneMesh(e);Arm.parentPickActive=false;
  if(!hb||hb.id===Arm.selBoneId){toast('Cancelled');renderPanel();return;}
  setBoneParent(rig,Arm.selBoneId,hb.id);toast('Parented to '+hb.name);renderPanel();invalidate();}

/* ---------------- raycasting helpers ---------------- */
function screenDeltaToWorld(dx,dy){ // same math as index.html's screenDeltaToWorld, scoped to this file's `vs`
  var right=new THREE.Vector3().setFromMatrixColumn(vs.cam.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(vs.cam.matrix,1);
  var k=vs.rad*.0016;return new THREE.Vector3().addScaledVector(right,dx*k).addScaledVector(up,-dy*k);}
function ndcFromEvent(e){var r=dom.getBoundingClientRect();return {x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1};}
function groundPlaneRaycast(cx,cy){
  var ray=new THREE.Raycaster();ray.setFromCamera(ndcFromEvent({clientX:cx,clientY:cy}),vs.cam);
  var hit=new THREE.Vector3();return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-1),hit)?hit:new THREE.Vector3(0,1,0);}
function workPlaneRaycast(cx,cy,planePoint){
  var ray=new THREE.Raycaster();ray.setFromCamera(ndcFromEvent({clientX:cx,clientY:cy}),vs.cam);
  var camDir=new THREE.Vector3();vs.cam.getWorldDirection(camDir);
  var plane=new THREE.Plane().setFromNormalAndCoplanarPoint(camDir,planePoint);
  var hit=new THREE.Vector3();return ray.ray.intersectPlane(plane,hit)?hit:null;}
function hitBoneMesh(e){var rig=Rigs[Arm.rigId];if(!rig||!rig.bones.length)return null;
  var ray=new THREE.Raycaster();ray.setFromCamera(ndcFromEvent(e),vs.cam);
  var h=ray.intersectObjects(rig.bones.map(function(b){return b.mesh;}),false)[0];if(!h)return null;
  var be=h.object.userData.boneRef;return {rig:rig,id:be.id,name:be.name,be:be};}
function hitJoint(e){var rig=Rigs[Arm.rigId];if(!rig||!rig.bones.length)return null;
  var joints=[];rig.bones.forEach(function(b){joints.push(b.headJoint,b.tailJoint);});
  var ray=new THREE.Raycaster();ray.setFromCamera(ndcFromEvent(e),vs.cam);
  var h=ray.intersectObjects(joints,false)[0];if(!h)return null;
  return {be:h.object.userData.boneRef,which:h.object.userData.jointKind};}

/* ---------------- edit-mode joint drag / pose-mode trackball drag ---------------- */
var jointDrag=null,poseDrag=null;
function dragJointMove(e){
  var dx=e.clientX-jointDrag.px,dy=e.clientY-jointDrag.py;jointDrag.px=e.clientX;jointDrag.py=e.clientY;
  var delta=screenDeltaToWorld(dx,dy),be=jointDrag.be;
  if(jointDrag.which==='head')be.head.add(delta);else be.tail.add(delta);
  applyBoneEdit(be);invalidate();}

// Trackball-style free rotation (chosen over an axis-chip scheme, see GAP_ANALYSIS §3 —
// simpler to make touch-reliable than picking an axis first): drag right/left spins the
// bone about the camera's current up vector, drag up/down about its current right vector,
// both re-expressed in the bone's PARENT-local frame so the result composes correctly
// through the FK chain regardless of how the parent itself is currently posed.
// Wave C3 adds Arm.axisMode: when not 'free', the drag is constrained to one of the
// bone's own local axes instead (more controllable on touch for e.g. elbow bends) — see
// applyAxisRotationStep below.
function dragPoseMove(e){
  var dx=e.clientX-poseDrag.px,dy=e.clientY-poseDrag.py;poseDrag.px=e.clientX;poseDrag.py=e.clientY;
  if(!dx&&!dy)return;
  var be=poseDrag.be,k=.01;
  if(Arm.axisMode!=='free'){applyAxisRotationStep(be,Arm.axisMode,dx*k);return;}
  var parent=be.bone.parent;
  parent.updateWorldMatrix(true,false);
  var pq=new THREE.Quaternion();parent.getWorldQuaternion(pq);var pqInv=pq.clone().invert();
  var camRight=new THREE.Vector3().setFromMatrixColumn(vs.cam.matrix,0).applyQuaternion(pqInv);
  var camUp=new THREE.Vector3().setFromMatrixColumn(vs.cam.matrix,1).applyQuaternion(pqInv);
  var qYaw=new THREE.Quaternion().setFromAxisAngle(camUp,-dx*k),qPitch=new THREE.Quaternion().setFromAxisAngle(camRight,-dy*k);
  var delta=qYaw.multiply(qPitch);
  be.bone.quaternion.copy(delta.multiply(be.bone.quaternion)).normalize();
  clampBoneRotation(be);
  scheduleAnimAutosave();invalidate();}

/* ═══════════════════════════════════════════════════════
   Wave C3 — per-axis FK, rotation limits, CCD IK, pole target.

   - Arm.axisMode constrains dragPoseMove to one local axis (applyAxisRotationStep).
   - setBoneEulerAxisDeg is the tap-to-type numeric fallback for exact-degree posing
     (drives the three "Rot X/Y/Z °" sliders in panelArmPose — each is itself
     tap-to-type via slider()'s label, per the app-wide numeric-entry convention).
   - be.limits = {x:[min,max]|null, y:..., z:...} (radians), default null per axis
     (unlimited). Enforced by clampBoneRotation after every FK drag/type AND inside
     every solveIK iteration (see below) — this is deliberately the same clamp
     entry point FK and IK both go through, so it doubles as C4's future "Limit
     Rotation" constraint groundwork. Approach: decompose the live quaternion to
     Euler XYZ, clamp any axis that has a limit, recompose — a known simplification
     (gimbal-order-dependent near ±90° on other axes) acceptable for a posing tool.
   ═══════════════════════════════════════════════════════ */
var AX_X=new THREE.Vector3(1,0,0),AX_Y=new THREE.Vector3(0,1,0),AX_Z=new THREE.Vector3(0,0,1);

function clampBoneRotation(be){
  if(!be||!be.limits)return;
  var lim=be.limits,changed=false;
  var e=new THREE.Euler().setFromQuaternion(be.bone.quaternion,'XYZ');
  ['x','y','z'].forEach(function(ax){var L=lim[ax];if(L){var v=clamp(e[ax],L[0],L[1]);
    if(Math.abs(v-e[ax])>1e-9){e[ax]=v;changed=true;}}});
  if(changed)be.bone.quaternion.setFromEuler(e);}

function setBoneLimit(be,axis,min,max){ // min/max in radians; either null clears that axis's limit
  if(!be.limits)be.limits={x:null,y:null,z:null};
  be.limits[axis]=(min==null||max==null)?null:[min,max];
  clampBoneRotation(be);scheduleAnimAutosave();invalidate();}

// Pure rotation step around one of the bone's own LOCAL axes (post-multiplied, so the
// axis is expressed in the bone's currently-rotated frame — i.e. repeated calls rotate
// around the bone's own current local X/Y/Z, matching how the axis chip is described:
// "constrain the drag rotation to the bone's local axis").
function applyAxisRotationStep(be,axis,angle){
  var axisVec=axis==='x'?AX_X:(axis==='y'?AX_Y:AX_Z);
  var dq=new THREE.Quaternion().setFromAxisAngle(axisVec,angle);
  be.bone.quaternion.multiply(dq).normalize();
  clampBoneRotation(be);
  scheduleAnimAutosave();invalidate();return be.bone.quaternion;}

function boneEulerDeg(be){var e=new THREE.Euler().setFromQuaternion(be.bone.quaternion,'XYZ');
  return {x:e.x*180/Math.PI,y:e.y*180/Math.PI,z:e.z*180/Math.PI};}
function setBoneEulerAxisDeg(be,axis,deg){ // tap-to-type exact-degree entry for one axis, others held at their current decomposed value
  var e=new THREE.Euler().setFromQuaternion(be.bone.quaternion,'XYZ');
  e[axis]=deg*Math.PI/180;
  be.bone.quaternion.setFromEuler(e);
  clampBoneRotation(be);scheduleAnimAutosave();invalidate();}

/* ---------------- CCD IK solver (Wave C3) ----------------
   solveIK(chainBEs, targetPos, iterations, opts): cyclic coordinate descent over an
   N-bone chain. chainBEs is ROOT -> TIP ordered (2-4 Bone records, see buildIkChain).
   Each iteration sweeps from the TIP-most rotatable joint back to the ROOT: for joint i,
   rotate be[i]'s LOCAL quaternion by the minimal-angle rotation that swings the current
   chain-tip position toward targetPos, pivoting about that joint's head. The per-step
   angle is clamped (opts.maxStep, default .35 rad) for stability on long/fast drags, and
   every joint rotation is immediately re-clamped by clampBoneRotation so IK respects the
   same per-bone limits FK does. The sweep repeats for `iterations` passes or until the
   tip is within opts.tolerance (default .01 world units) of the target — whichever first;
   an unreachable target simply straightens the chain to point at it (classic CCD
   behavior), it does not diverge or NaN.
   opts.pole (optional THREE.Vector3, world space): bias the chain's bend PLANE toward a
   pole target after each sweep — see applyPoleBend for the approach and its documented
   2-3-bone-chain scope. */
function solveIK(chainBEs,targetPos,iterations,opts){
  opts=opts||{};
  var maxStep=opts.maxStep!=null?opts.maxStep:.35;
  var tol=opts.tolerance!=null?opts.tolerance:.01;
  var pole=opts.pole||null;
  if(!chainBEs||chainBEs.length<2||!targetPos)return;
  var rig=chainBEs[0].rig;
  rig.root.updateMatrixWorld(true);
  var tipBE=chainBEs[chainBEs.length-1];
  for(var iter=0;iter<iterations;iter++){
    for(var i=chainBEs.length-1;i>=0;i--){
      var be=chainBEs[i];
      be.bone.updateMatrixWorld(true);
      var jointPos=new THREE.Vector3();be.headJoint.getWorldPosition(jointPos);
      var tipPos=new THREE.Vector3();tipBE.tailJoint.getWorldPosition(tipPos);
      var toTip=tipPos.clone().sub(jointPos),toTarget=targetPos.clone().sub(jointPos);
      if(toTip.lengthSq()<1e-10||toTarget.lengthSq()<1e-10)continue;
      toTip.normalize();toTarget.normalize();
      var dot=clamp(toTip.dot(toTarget),-1,1),angle=Math.acos(dot);
      if(angle<1e-6)continue;
      var axis=new THREE.Vector3().crossVectors(toTip,toTarget);
      if(axis.lengthSq()<1e-10)continue; // toTip/toTarget anti-parallel: no well-defined swing axis, skip this joint this pass
      axis.normalize();
      angle=Math.min(angle,maxStep);
      var worldQ=new THREE.Quaternion().setFromAxisAngle(axis,angle);
      var curWorldQ=new THREE.Quaternion();be.bone.getWorldQuaternion(curWorldQ);
      var newWorldQ=worldQ.multiply(curWorldQ);
      var parentWorldQ=new THREE.Quaternion();if(be.bone.parent)be.bone.parent.getWorldQuaternion(parentWorldQ);
      var newLocalQ=parentWorldQ.clone().invert().multiply(newWorldQ);
      be.bone.quaternion.copy(newLocalQ).normalize();
      clampBoneRotation(be);
      be.bone.updateMatrixWorld(true);
    }
    if(pole)applyPoleBend(chainBEs,pole);
    var tp2=new THREE.Vector3();tipBE.tailJoint.getWorldPosition(tp2);
    if(tp2.distanceTo(targetPos)<tol)break;
  }
  rig.root.updateMatrixWorld(true);}

// Pole vector / bend-direction bias: standard pole-vector IK re-derives each internal
// joint's swing around the root-tip axis individually; as a FEASIBLE simplification for
// a compact mobile posing tool (2-3 bone chains, per GAP_ANALYSIS §4 C3) this instead
// rotates the whole chain's ROOT bone about the root->tip axis by just enough to swing
// the chain's single dominant "elbow" (the middle bone's head joint) onto the pole's
// side of the root-tip line. For a 4-bone chain only that first internal joint is
// biased — documented scope, not a full per-joint pole solve. Called once per solveIK
// sweep so it composes with the CCD tip-correction on the next sweep.
function applyPoleBend(chainBEs,polePos){
  if(!chainBEs||chainBEs.length<2||!polePos)return;
  var rootBE=chainBEs[0],tipBE=chainBEs[chainBEs.length-1],midBE=chainBEs[Math.floor(chainBEs.length/2)];
  rootBE.bone.updateMatrixWorld(true);
  var rootPos=new THREE.Vector3();rootBE.headJoint.getWorldPosition(rootPos);
  var tipPos=new THREE.Vector3();tipBE.tailJoint.getWorldPosition(tipPos);
  var midPos=new THREE.Vector3();midBE.headJoint.getWorldPosition(midPos);
  var axis=tipPos.clone().sub(rootPos);if(axis.lengthSq()<1e-10)return;axis.normalize();
  function offAxis(p){var d=p.clone().sub(rootPos);return d.sub(axis.clone().multiplyScalar(d.dot(axis)));}
  var poleProj=offAxis(polePos),midProj=offAxis(midPos);
  if(poleProj.lengthSq()<1e-10||midProj.lengthSq()<1e-10)return;
  poleProj.normalize();midProj.normalize();
  var dot=clamp(midProj.dot(poleProj),-1,1),cross=new THREE.Vector3().crossVectors(midProj,poleProj);
  var sign=cross.dot(axis)>=0?1:-1,angle=sign*Math.acos(dot);
  if(!isFinite(angle)||Math.abs(angle)<1e-6)return;
  var worldQ=new THREE.Quaternion().setFromAxisAngle(axis,angle);
  var curWorldQ=new THREE.Quaternion();rootBE.bone.getWorldQuaternion(curWorldQ);
  var newWorldQ=worldQ.multiply(curWorldQ);
  var parentWorldQ=new THREE.Quaternion();if(rootBE.bone.parent)rootBE.bone.parent.getWorldQuaternion(parentWorldQ);
  var newLocalQ=parentWorldQ.clone().invert().multiply(newWorldQ);
  rootBE.bone.quaternion.copy(newLocalQ).normalize();
  clampBoneRotation(rootBE);
  rootBE.bone.updateMatrixWorld(true);}

/* ---------------- IK interaction: chain selection + draggable target/pole handles (Wave C3) ----------------
   Arm.ikOn arms IK inside Pose mode. With it on, tapping a bone in the viewport defines
   that bone as the CHAIN TIP (ikSelectTip): the chain is that bone plus its nearest
   Arm.ikChainLen-1 ancestors (buildIkChain), root->tip. A small sphere "IK target"
   handle (yellow) appears at the chain's current tip world position; dragging it
   re-solves the chain live every pointermove (dragIkMove -> runIkSolve -> solveIK). On
   release nothing needs to be "applied" — the solved pose already IS the bones' current
   quaternions, so it is immediately keyable via the normal FK "Key Rotation" button and
   slerp-samples through Anim like any other pose (see panelArmPose's Key Rotation, and
   Anim.sample's quaternion slerp path). An optional second sphere handle (green) defines
   the pole/bend-direction target (only offered for chains of 2-3 bones, see
   applyPoleBend). The target/pole handles are scene gizmos, not part of the rig data
   model — they persist only while Arm.ikOn is true and clear on toggle-off, per the
   "keep the target as a scene handle while IK toggle is on, clear on toggle off" spec. */
var IK_HANDLE_GEO=null;
function ikHandleGeo(){if(IK_HANDLE_GEO)return IK_HANDLE_GEO;IK_HANDLE_GEO=new THREE.SphereGeometry(1,12,10);return IK_HANDLE_GEO;}
var ikTargetMesh=null,ikPoleMesh=null,ikDrag=null;
function ensureIkHandles(){
  if(!ikTargetMesh){ikTargetMesh=new THREE.Mesh(ikHandleGeo(),new THREE.MeshBasicMaterial({color:0xffe066,depthTest:false,transparent:true,opacity:.92}));
    ikTargetMesh.scale.setScalar(.045);ikTargetMesh.renderOrder=1002;ikTargetMesh.visible=false;
    ikTargetMesh.userData.ikHandle='target';poseScene.userData.armatureHolder.add(ikTargetMesh);}
  if(!ikPoleMesh){ikPoleMesh=new THREE.Mesh(ikHandleGeo(),new THREE.MeshBasicMaterial({color:0x8fffb0,depthTest:false,transparent:true,opacity:.92}));
    ikPoleMesh.scale.setScalar(.035);ikPoleMesh.renderOrder=1002;ikPoleMesh.visible=false;
    ikPoleMesh.userData.ikHandle='pole';poseScene.userData.armatureHolder.add(ikPoleMesh);}}
function buildIkChain(rig,tipBoneId,len){ // returns [rootId...tipId], up to `len` bones, root-most bone first
  var chain=[],cur=findBone(rig,tipBoneId);
  while(cur&&chain.length<len){chain.unshift(cur.id);cur=cur.parentId?findBone(rig,cur.parentId):null;}
  return chain;}
function ikSelectTip(rig,boneId){
  ensureIkHandles();
  var chain=buildIkChain(rig,boneId,Arm.ikChainLen);
  if(chain.length<2){toast('Need a parent bone to form an IK chain');Arm.ikChainBoneIds=null;
    ikTargetMesh.visible=false;ikPoleMesh.visible=false;return;}
  Arm.ikChainBoneIds=chain;
  var tipBE=findBone(rig,chain[chain.length-1]);
  rig.root.updateMatrixWorld(true);
  var tp=new THREE.Vector3();tipBE.tailJoint.getWorldPosition(tp);
  Arm.ikTargetPos=tp;ikTargetMesh.position.copy(tp);ikTargetMesh.visible=true;
  if(Arm.ikPoleOn&&chain.length<=3){
    if(!Arm.ikPolePos){var rootBE=findBone(rig,chain[0]);var rp=new THREE.Vector3();rootBE.headJoint.getWorldPosition(rp);
      Arm.ikPolePos=rp.clone().add(new THREE.Vector3(0,0,1));}
    ikPoleMesh.position.copy(Arm.ikPolePos);ikPoleMesh.visible=true;
  }else ikPoleMesh.visible=false;
  toast('IK chain: '+chain.length+' bones — drag the yellow target');invalidate();}
function setIkOn(on){
  Arm.ikOn=!!on;
  if(!Arm.ikOn){Arm.ikChainBoneIds=null;Arm.ikTargetPos=null;Arm.ikPolePos=null;
    if(ikTargetMesh)ikTargetMesh.visible=false;if(ikPoleMesh)ikPoleMesh.visible=false;}
  renderPanel();invalidate();}
function setIkPoleOn(on){
  Arm.ikPoleOn=!!on;
  if(!Arm.ikPoleOn){Arm.ikPolePos=null;if(ikPoleMesh)ikPoleMesh.visible=false;}
  else if(Arm.ikChainBoneIds&&Arm.ikChainBoneIds.length<=3){var rig=Rigs[Arm.rigId];
    if(rig)ikSelectTip(rig,Arm.ikChainBoneIds[Arm.ikChainBoneIds.length-1]);}
  renderPanel();invalidate();}
function setIkChainLen(n){
  Arm.ikChainLen=clamp(Math.round(n)||2,2,4);
  if(Arm.ikChainBoneIds&&Arm.ikChainBoneIds.length){var rig=Rigs[Arm.rigId];
    if(rig)ikSelectTip(rig,Arm.ikChainBoneIds[Arm.ikChainBoneIds.length-1]);}
  renderPanel();}
function runIkSolve(){
  var rig=Rigs[Arm.rigId];if(!rig||!Arm.ikChainBoneIds||!Arm.ikTargetPos)return;
  var chainBEs=Arm.ikChainBoneIds.map(function(id){return findBone(rig,id);}).filter(Boolean);
  if(chainBEs.length<2)return;
  var opts={};if(Arm.ikPoleOn&&Arm.ikPolePos&&chainBEs.length<=3)opts.pole=Arm.ikPolePos;
  solveIK(chainBEs,Arm.ikTargetPos,12,opts);
  scheduleAnimAutosave();invalidate();}
function hitIkHandle(e){
  var objs=[];if(ikTargetMesh&&ikTargetMesh.visible)objs.push(ikTargetMesh);if(ikPoleMesh&&ikPoleMesh.visible)objs.push(ikPoleMesh);
  if(!objs.length)return null;
  var ray=new THREE.Raycaster();ray.setFromCamera(ndcFromEvent(e),vs.cam);
  var h=ray.intersectObjects(objs,false)[0];return h?h.object.userData.ikHandle:null;}
function dragIkMove(e){
  var dx=e.clientX-ikDrag.px,dy=e.clientY-ikDrag.py;ikDrag.px=e.clientX;ikDrag.py=e.clientY;
  var delta=screenDeltaToWorld(dx,dy);
  if(ikDrag.which==='target'){Arm.ikTargetPos.add(delta);ikTargetMesh.position.copy(Arm.ikTargetPos);}
  else{Arm.ikPolePos.add(delta);ikPoleMesh.position.copy(Arm.ikPolePos);}
  runIkSolve();invalidate();}

/* ═══════════════════════════════════════════════════════
   Wave C4 — Constraints (Copy Location, Copy Rotation, Track-To,
   Limit Rotation) on bones AND scene objects.

   Constraint = { id, type:'copyLoc'|'copyRot'|'trackTo'|'limitRot',
                  targetId, influence:0..1, enabled:bool, params:{...} }
   - Bones store their list at be.constraints (per-bone, mirroring the
     be.limits precedent from C3). Scene objects (Registry entries that
     are NOT bones — models/parts) store theirs at obj.userData.constraints,
     evaluated too ("if cheap" per the brief) but NOT yet carried through
     the anim autosave — models aren't serialized in this file at all
     (they come fresh from the modeler bridge/demo figure each load), so
     object-level constraints are runtime-only for now (documented
     deviation). Bone constraints DO round-trip — see serializeRigs/
     rebuildRigFromSerialized below, autosave v4.
   - Evaluation order: applyConstraints(rig) walks that rig's bones
     PARENT-BEFORE-CHILD (boneEvalOrder, a fresh BFS from the roots
     rather than trusting rig.bones' creation-order array, which can go
     stale after a re-parent) so a parent's constraints have already
     settled by the time a child's run. Called once per rendered frame
     from loop() (applyAllConstraints), AFTER Anim.sample and any live
     FK/IK drag have written this frame's base pose, and BEFORE
     renderer.render.
   - 'limitRot' is a thin UI/serialization wrapper, NOT a second clamp
     implementation: it just re-invokes C3's clampBoneRotation (which
     reads be.limits) at its position in the constraint stack, so e.g. a
     copyRot/trackTo constraint earlier in the list can be clamped by a
     limitRot entry placed after it. Bone limits stay ALWAYS enforced at
     every direct FK/IK call site regardless of whether a limitRot row
     exists (unchanged C3 behavior) — the row only controls whether THIS
     render pass also reclamps after other constraints have run.
   - Cycle/self-target guard: wouldCreateCycle walks the live constraint
     graph (constraintListFor) from the candidate target back toward the
     constrained entity; addConstraint refuses with a toast rather than
     crashing.
   - Influence is keyframeable: each non-limitRot constraint gets its own
     Registry entry at '<ownerTargetId>/con:<constraintId>' mapping
     directly to the constraint object itself, so Anim.insertKey/
     Anim.sample's existing dotted-path resolver can key 'influence' with
     zero sampler changes (resolvePath just does obj['influence'] — the
     constraint object needs no special-casing). Deviation from the
     literal 'con:0' index example in the brief: we key by the
     constraint's own stable id, not its array position, so deleting an
     earlier constraint in the list never re-targets a surviving track at
     the wrong entry.
   ═══════════════════════════════════════════════════════ */
var conIdc=1;
var CONSTRAINT_LABELS={copyLoc:'Copy Location',copyRot:'Copy Rotation',trackTo:'Track To',limitRot:'Limit Rotation'};

function findBoneByTargetId(targetId){
  for(var rid in Rigs){var rig=Rigs[rid];
    for(var i=0;i<rig.bones.length;i++)if(boneTargetId(rig.id,rig.bones[i].name)===targetId)return rig.bones[i];}
  return null;}

// Resolve the constraint list owned by ANY targetId — a bone (be.constraints) or a plain
// scene object (obj.userData.constraints) — so the rest of this section (and the UI) never
// needs to care which kind of thing it's looking at.
function constraintListFor(targetId){
  var be=findBoneByTargetId(targetId);
  if(be){if(!be.constraints)be.constraints=[];return be.constraints;}
  var obj=resolveTarget(targetId);
  if(obj){if(!obj.userData.constraints)obj.userData.constraints=[];return obj.userData.constraints;}
  return null;}

function constraintTargetId(ownerTargetId,con){return ownerTargetId+'/con:'+con.id;}

function wouldCreateCycle(fromId,toId){
  if(fromId===toId)return true;
  var visited={},stack=[toId];
  while(stack.length){
    var cur=stack.pop();
    if(cur===fromId)return true;
    if(visited[cur])continue;visited[cur]=true;
    var list=constraintListFor(cur)||[];
    list.forEach(function(c){if(c.targetId)stack.push(c.targetId);});}
  return false;}

function defaultConstraintParams(type){
  if(type==='trackTo')return {axis:'auto',up:'y'}; // axis: 'auto'|'x'|'y'|'z' (aim), up: 'x'|'y'|'z' (roll reference)
  return {};}

function addConstraint(ownerTargetId,type,conTargetId){
  var list=constraintListFor(ownerTargetId);
  if(!list){toast('Unknown target');return null;}
  if(type==='limitRot'){
    if(list.some(function(c){return c.type==='limitRot';})){toast('Limit Rotation already added');return null;}
    var lbe=findBoneByTargetId(ownerTargetId);
    if(!lbe){toast('Limit Rotation only applies to bones');return null;}
    if(!lbe.limits)lbe.limits={x:null,y:null,z:null};
    var lc={id:'con'+(conIdc++),type:'limitRot',targetId:null,influence:1,enabled:true,params:{}};
    list.push(lc);scheduleAnimAutosave();invalidate();return lc;}
  if(!conTargetId){toast('Pick a target first');return null;}
  if(conTargetId===ownerTargetId){toast('Cannot target self');return null;}
  if(wouldCreateCycle(ownerTargetId,conTargetId)){toast('That would create a constraint cycle');return null;}
  var c={id:'con'+(conIdc++),type:type,targetId:conTargetId,influence:1,enabled:true,params:defaultConstraintParams(type)};
  list.push(c);
  registerTarget(constraintTargetId(ownerTargetId,c),c);
  if(RigTargetIds[ownerTargetId])RigTargetIds[constraintTargetId(ownerTargetId,c)]=true;
  scheduleAnimAutosave();invalidate();return c;}

function removeConstraint(ownerTargetId,conId){
  var list=constraintListFor(ownerTargetId);if(!list)return;
  var i=list.findIndex(function(c){return c.id===conId;});if(i<0)return;
  var cid=constraintTargetId(ownerTargetId,list[i]);
  delete Registry[cid];delete RigTargetIds[cid];
  Anim.tracks=Anim.tracks.filter(function(tr){return tr.targetId!==cid;});
  list.splice(i,1);
  scheduleAnimAutosave();invalidate();}

// Drop any constraint (on any bone/object) that targets `deadTid` — called when a bone is
// deleted so other entries don't keep a dangling reference.
function removeConstraintsTargeting(deadTid){
  Object.keys(Rigs).forEach(function(rid){Rigs[rid].bones.forEach(function(be){
    if(be.constraints)be.constraints=be.constraints.filter(function(c){return c.targetId!==deadTid;});});});
  Object.keys(Registry).forEach(function(id){var o=Registry[id];
    if(o&&o.userData&&o.userData.constraints)o.userData.constraints=o.userData.constraints.filter(function(c){return c.targetId!==deadTid;});});}

// Re-point every constraint that targeted `oldTid` at `newTid` — called on bone rename.
function retargetConstraints(oldTid,newTid){
  Object.keys(Rigs).forEach(function(rid){Rigs[rid].bones.forEach(function(be){
    (be.constraints||[]).forEach(function(c){if(c.targetId===oldTid)c.targetId=newTid;});});});
  Object.keys(Registry).forEach(function(id){var o=Registry[id];
    if(o&&o.userData&&o.userData.constraints)o.userData.constraints.forEach(function(c){if(c.targetId===oldTid)c.targetId=newTid;});});}

// The "along the bone" axis for Track-To's 'auto' mode: bones are NOT rolled to align local
// +Y with head->tail at rest (see the Armature section header), so this is a per-bone custom
// direction, not a fixed unit axis — computed from the REST head/tail, which is constant
// across pose changes (only be.bone.quaternion moves during posing).
function trackToAimAxisLocal(be){
  if(be){var d=be.tail.clone().sub(be.head);if(d.lengthSq()>1e-10)return d.normalize();}
  return new THREE.Vector3(0,1,0);}
function axisVecFromParam(a,fallback){
  if(a==='x')return new THREE.Vector3(1,0,0);
  if(a==='y')return new THREE.Vector3(0,1,0);
  if(a==='z')return new THREE.Vector3(0,0,1);
  return fallback||new THREE.Vector3(0,1,0);}

// Best-effort roll correction: after the minimal aim-swing, rotate around the (now-aimed)
// world axis so a reference local axis lines up with the requested world "up" direction — a
// simplified stand-in for Blender's full Track-To roll resolution (documented C4 scope: aim
// direction is exact, roll is an approximation).
function applyRollToUp(worldQuat,aimAxisLocal,upWorld){
  var ref=Math.abs(aimAxisLocal.y)>0.9?new THREE.Vector3(0,0,1):new THREE.Vector3(0,1,0);
  var aimWorld=aimAxisLocal.clone().applyQuaternion(worldQuat).normalize();
  var refWorld=ref.clone().applyQuaternion(worldQuat).normalize();
  function projPerp(v){var d=v.clone().sub(aimWorld.clone().multiplyScalar(v.dot(aimWorld)));return d.lengthSq()>1e-8?d.normalize():null;}
  var refP=projPerp(refWorld),upP=projPerp(upWorld);
  if(!refP||!upP)return worldQuat;
  var dot=clamp(refP.dot(upP),-1,1);
  var cross=new THREE.Vector3().crossVectors(refP,upP);
  var sign=cross.dot(aimWorld)>=0?1:-1,angle=sign*Math.acos(dot);
  if(!isFinite(angle)||Math.abs(angle)<1e-6)return worldQuat;
  var rollQ=new THREE.Quaternion().setFromAxisAngle(aimWorld,angle);
  return rollQ.multiply(worldQuat);}

// Apply one enabled constraint to `obj` (a THREE.Bone or a plain Object3D). `be` is the
// owning bone record when obj is a bone (used for the trackTo 'auto' aim axis and the
// limitRot clamp), null for scene objects.
function applyOneConstraint(obj,c,be){
  if(!c.enabled)return;
  if(c.type==='limitRot'){if(be)clampBoneRotation(be);return;}
  var target=resolveTarget(c.targetId);if(!target)return;
  target.updateMatrixWorld(true);
  var influence=clamp(c.influence==null?1:c.influence,0,1);
  if(influence<=0)return;
  if(c.type==='copyLoc'){
    var curW=new THREE.Vector3();obj.getWorldPosition(curW);
    var tgtW=new THREE.Vector3();target.getWorldPosition(tgtW);
    var newW=curW.clone().lerp(tgtW,influence);
    var localPos=obj.parent?obj.parent.worldToLocal(newW.clone()):newW.clone();
    obj.position.copy(localPos);
  }else if(c.type==='copyRot'){
    var curQ=new THREE.Quaternion();obj.getWorldQuaternion(curQ);
    var tgtQ=new THREE.Quaternion();target.getWorldQuaternion(tgtQ);
    var newQ=curQ.clone().slerp(tgtQ,influence);
    var parentQ=new THREE.Quaternion();if(obj.parent)obj.parent.getWorldQuaternion(parentQ);
    obj.quaternion.copy(parentQ.clone().invert().multiply(newQ)).normalize();
  }else if(c.type==='trackTo'){
    var aimLocal=(c.params&&c.params.axis&&c.params.axis!=='auto')?axisVecFromParam(c.params.axis):trackToAimAxisLocal(be);
    var upWorld=axisVecFromParam(c.params&&c.params.up,new THREE.Vector3(0,1,0));
    var objW=new THREE.Vector3();obj.getWorldPosition(objW);
    var tgtW2=new THREE.Vector3();target.getWorldPosition(tgtW2);
    var dir=tgtW2.clone().sub(objW);if(dir.lengthSq()<1e-10)return;dir.normalize();
    var curQ2=new THREE.Quaternion();obj.getWorldQuaternion(curQ2);
    var curAimWorld=aimLocal.clone().applyQuaternion(curQ2).normalize();
    var swingQ=new THREE.Quaternion().setFromUnitVectors(curAimWorld,dir);
    var fullQ=swingQ.multiply(curQ2.clone());
    fullQ=applyRollToUp(fullQ,aimLocal,upWorld);
    var blendedQ=curQ2.clone().slerp(fullQ,influence);
    var parentQ2=new THREE.Quaternion();if(obj.parent)obj.parent.getWorldQuaternion(parentQ2);
    obj.quaternion.copy(parentQ2.clone().invert().multiply(blendedQ)).normalize();
  }
  obj.updateMatrixWorld(true);}

// Parent-before-child bone evaluation order for a rig — a fresh BFS from the roots rather
// than trusting rig.bones' creation-order array (which can go stale after Set Parent).
function boneEvalOrder(rig){
  var childrenOf={};
  rig.bones.forEach(function(b){var k=b.parentId||'__root__';(childrenOf[k]=childrenOf[k]||[]).push(b);});
  var order=[],queue=(childrenOf['__root__']||[]).slice();
  while(queue.length){var b=queue.shift();order.push(b);(childrenOf[b.id]||[]).forEach(function(c){queue.push(c);});}
  return order;}

// The Wave C4 entry point named in the brief: evaluate one rig's bone constraints, parent
// bones settled before children.
function applyConstraints(rig){
  if(!rig)return;
  rig.root.updateMatrixWorld(true);
  boneEvalOrder(rig).forEach(function(be){
    if(!be.constraints||!be.constraints.length)return;
    be.bone.updateMatrixWorld(true);
    be.constraints.forEach(function(c){applyOneConstraint(be.bone,c,be);});});
  rig.root.updateMatrixWorld(true);}

function objDepth(o){var d=0;while(o&&o.parent){d++;o=o.parent;}return d;}
// Scene-object constraints (Registry entries that are not rig-owned) — "if cheap" per the
// brief: evaluated every frame like bone constraints, but NOT yet serialized (see file
// header note above — models aren't carried by this file's autosave at all).
function applyObjectConstraints(){
  var ids=Object.keys(Registry).filter(function(id){
    if(RigTargetIds[id]||id.indexOf('/con:')>=0)return false;
    var o=Registry[id];return o&&o.userData&&o.userData.constraints&&o.userData.constraints.length;});
  ids.sort(function(a,b){return objDepth(Registry[a])-objDepth(Registry[b]);}); // parents before children
  ids.forEach(function(id){var obj=Registry[id];obj.updateMatrixWorld(true);
    obj.userData.constraints.forEach(function(c){applyOneConstraint(obj,c,null);});});}

// Render-path entry point: every rig's bone constraints, then every plain object's — called
// once per rendered frame from loop(), after Anim.sample/live FK-IK drag, before render.
function applyAllConstraints(){
  Object.keys(Rigs).forEach(function(rid){applyConstraints(Rigs[rid]);});
  applyObjectConstraints();}

/* ---------------- serialize / restore (rides in the anim autosave — see doAnimAutosave) ---------------- */
function serializeRigs(){return Object.keys(Rigs).map(function(rid){var rig=Rigs[rid];
  return {id:rig.id,name:rig.name,bones:rig.bones.map(function(b){
    var bd={id:b.id,name:b.name,parentId:b.parentId,head:[b.head.x,b.head.y,b.head.z],tail:[b.tail.x,b.tail.y,b.tail.z],
      quat:[b.bone.quaternion.x,b.bone.quaternion.y,b.bone.quaternion.z,b.bone.quaternion.w]};
    if(b.limits&&(b.limits.x||b.limits.y||b.limits.z))bd.limits=b.limits; // v3 (Wave C3): rotation limits, omitted when fully unlimited
    if(b.constraints&&b.constraints.length)bd.constraints=b.constraints.map(function(c){ // v4 (Wave C4)
      return {id:c.id,type:c.type,targetId:c.targetId,influence:c.influence,enabled:c.enabled,params:c.params};});
    return bd;})};});}
function rebuildRigFromSerialized(rd){
  var rig=newRigWithId(rd.id,rd.name),list=rd.bones||[];
  list.forEach(function(bd){ // pass 1: create every bone as a temporary root (guarantees all ids exist for pass 2's parent lookups)
    addBoneWithId(rig,bd.id,bd.name,new THREE.Vector3().fromArray(bd.head),new THREE.Vector3().fromArray(bd.tail),null);});
  list.forEach(function(bd){ // pass 2: real parenting (keep-offset) + restore pose quaternion + limits (v2 saves simply lack the field)
    if(bd.parentId)setBoneParent(rig,bd.id,bd.parentId);
    var be=findBone(rig,bd.id);if(!be)return;
    if(bd.limits)be.limits={x:bd.limits.x||null,y:bd.limits.y||null,z:bd.limits.z||null};
    if(bd.quat)be.bone.quaternion.set(bd.quat[0],bd.quat[1],bd.quat[2],bd.quat[3]);
    if(bd.constraints&&bd.constraints.length){ // v4 (Wave C4): v2/v3 saves simply lack the field -> stays the default []
      be.constraints=bd.constraints.map(function(cd){return {id:cd.id,type:cd.type,targetId:cd.targetId,
        influence:cd.influence!=null?cd.influence:1,enabled:cd.enabled!==false,params:cd.params||{}};});
      var maxCid=0;be.constraints.forEach(function(c){var n=+(''+c.id).replace(/\D/g,'');if(n>maxCid)maxCid=n;});
      if(maxCid>=conIdc)conIdc=maxCid+1;
      be.constraints.forEach(function(c){if(c.type!=='limitRot')registerRigTarget(constraintTargetId(boneTargetId(rig.id,be.name),c),c);});
    }});
  syncSkeleton(rig);return rig;}

/* ═══════════════════════════════════════════════════════
   Wave C2 — SKINNING (mesh -> skeleton bind + automatic weights)

   bindMeshToRig(mesh, rig, opts) turns a plain THREE.Mesh (one of a bridged
   model's `grp.children`, or the demo figure's parts) into a THREE.SkinnedMesh
   sharing `rig.skeleton` — Three.js r128's native SkinnedMesh/Skeleton runtime
   does the actual per-frame deform for free once skinIndex/skinWeight
   attributes + a correct bind pose are in place (GAP_ANALYSIS §2.7); this
   section is entirely the authoring-time weight computation + bind wiring.

   Weight source per mesh (a whole-part decision, not per-vertex): if
   mesh.userData.vgroups (carried through from the modeler's project JSON by
   partsToModel, or absent on the demo figure) has any group whose `name`
   matches a bone name in the target rig, that mesh binds from EXPLICIT
   GROUPS (computeGroupWeightsForMesh) — vertices no group covers fall back
   to the nearest-bone automatic weight individually, so a mesh with partial
   coverage never collapses to the origin (skinWeight summing to 0). A mesh
   with no matching group at all binds fully from AUTOMATIC WEIGHTS
   (computeAutoWeightsForMesh) — inverse-distance-to-nearest-bone-SEGMENT,
   clearly NOT Blender's heat-diffusion solve (see GAP_ANALYSIS §2.7
   "Automatic weights" row): for each vertex, take the AUTO_WEIGHT_K nearest
   bone segments (head->tail, closest-point-on-segment distance) and weight
   them by 1/distance^AUTO_WEIGHT_P, normalized to sum to 1. Cheap, O(verts *
   bones), no linear solve — the documented, intentional approximation.

   Bind pose: bindMeshToRig resets the rig's bone quaternions to identity
   (rest) before computing anything and before calling `skinned.bind(skeleton)`
   — SkinnedMesh.bind() with no explicit bindMatrix calls
   `skeleton.calculateInverses()` itself, capturing THAT rest pose as the
   permanent boneInverses, exactly the "posed to rest, then
   calculateInverses()" sequence the wave brief calls for — then restores the
   pose the rig was actually in, so binding never disturbs whatever the user
   was posing. be.head/be.tail (the rest-pose joint positions the Armature
   system already keeps in armature-local == world space, see the Armature
   section header) are what the automatic-weights distance calculation reads,
   so it works identically before/after the temporary rest-pose reset.

   Deform integration: nothing else has to change. `loop()` already calls
   applyAllConstraints() then renderer.render(poseScene,...) every frame;
   THREE.WebGLRenderer calls `object.skeleton.update()` for every SkinnedMesh
   it renders as part of that same render() call, which recomputes each
   bone's skin offset matrix from its (possibly just-posed/IK'd/constrained)
   current matrixWorld. A bound mesh moves the instant its rig is posed, FK,
   IK, or constraint-driven, with zero extra plumbing.

   Persistence (bumps ANIM_AUTOSAVE_KEY to v5, additive — see doAnimAutosave):
   SkinBinds is a flat map partTargetId -> {rigId, forceAuto} recording INTENT
   (which part is bound to which rig, and whether the user forced automatic
   weights via "Recompute Auto Weights" even where matching groups exist) —
   not the computed skinIndex/skinWeight arrays themselves. On restore,
   applyPendingSkinBinds() re-runs bindMeshToRig for each recorded pair once
   the bridged/demo model and the rigs are both back in the Registry, which
   deterministically reproduces the same weights from the same mesh+rig
   inputs. Chosen over persisting raw skin attribute arrays: much smaller
   autosave payload, and "recompute" is exactly as correct here since neither
   the vertex groups nor the bone rest positions change between saves for a
   model that round-trips unchanged. Documented tradeoff: if the user reloads
   with a DIFFERENT model (re-imported/re-bridged with different geometry) the
   stored partTargetId simply won't resolve in the fresh Registry and the
   stale bind record is silently skipped — same "best effort, ids assumed
   stable" contract the rest of this file's Registry already relies on.
   ═══════════════════════════════════════════════════════ */
var AUTO_WEIGHT_K=4,AUTO_WEIGHT_P=3; // K nearest bones; inverse-distance power (~2-4 per GAP_ANALYSIS)
var SkinBinds={}; // partTargetId -> {rigId, forceAuto} — see persistence note above
function recordSkinBind(targetId,rigId,forceAuto){SkinBinds[targetId]={rigId:rigId,forceAuto:!!forceAuto};}
function clearSkinBind(targetId){delete SkinBinds[targetId];}
function serializeSkinBinds(){return Object.keys(SkinBinds).map(function(tid){var r=SkinBinds[tid];
  return {targetId:tid,rigId:r.rigId,forceAuto:r.forceAuto};});}
var pendingSkinBinds=null; // set by tryRestoreAnimAutosave (v5 `skins` field), consumed once by applyPendingSkinBinds()
function applyPendingSkinBinds(){
  if(!pendingSkinBinds||!pendingSkinBinds.length)return;
  var list=pendingSkinBinds;pendingSkinBinds=null;
  list.forEach(function(rec){
    var mesh=Registry[rec.targetId],rig=Rigs[rec.rigId];
    if(mesh&&rig&&!mesh.isSkinnedMesh)bindMeshToRig(mesh,rig,{forceAuto:rec.forceAuto,silent:true});});}

function closestPointOnSegment(p,a,b){
  var ab=b.clone().sub(a),len2=ab.lengthSq();
  var t=len2>1e-12?clamp(p.clone().sub(a).dot(ab)/len2,0,1):0;
  return a.clone().addScaledVector(ab,t);}
function distPointToSegment(p,a,b){return p.distanceTo(closestPointOnSegment(p,a,b));}

// Rest-pose bone segment endpoints in world space (be.head/be.tail are armature-local, which
// the Armature section documents as effectively world space — still run through rig.root's
// matrixWorld for correctness on the off chance the rig root itself carries a transform).
function boneRestWorldSegment(rig,be){
  var m=rig.root.matrixWorld;
  return {head:be.head.clone().applyMatrix4(m),tail:be.tail.clone().applyMatrix4(m)};}

function topKWeights(cands,K){ // cands: [{i,d}], smallest distance first after sort — inverse-distance-power, normalized
  cands.sort(function(a,b){return a.d-b.d;});
  var top=cands.slice(0,Math.min(K,cands.length));
  var w=top.map(function(t){return 1/Math.pow(Math.max(t.d,1e-4),AUTO_WEIGHT_P);});
  var sum=w.reduce(function(a,x){return a+x;},0)||1;
  return top.map(function(t,idx){return {i:t.i,w:w[idx]/sum};});}

function packInfluences(n,assignFn){ // assignFn(vi) -> [{i,w}] (already top-K, normalized or empty)
  var skinIndex=new Float32Array(n*4),skinWeight=new Float32Array(n*4);
  for(var vi=0;vi<n;vi++){
    var infl=assignFn(vi);
    for(var k=0;k<4;k++){
      if(k<infl.length){skinIndex[vi*4+k]=infl[k].i;skinWeight[vi*4+k]=infl[k].w;}
      else{skinIndex[vi*4+k]=0;skinWeight[vi*4+k]=0;}}}
  return {skinIndex:skinIndex,skinWeight:skinWeight};}

// Automatic weights (GAP_ANALYSIS §2.7 "Automatic weights" — explicitly an approximation, NOT
// heat diffusion): every vertex gets the AUTO_WEIGHT_K nearest bone SEGMENTS (closest-point
// distance, not just distance-to-head), weighted 1/distance^AUTO_WEIGHT_P and normalized.
function computeAutoWeightsForMesh(mesh,rig,boneOrder){
  var segs=boneOrder.map(function(be){return boneRestWorldSegment(rig,be);});
  mesh.updateMatrixWorld(true);
  var pos=mesh.geometry.attributes.position,n=pos.count,v=new THREE.Vector3();
  return packInfluences(n,function(vi){
    v.fromBufferAttribute(pos,vi).applyMatrix4(mesh.matrixWorld);
    var cands=segs.map(function(s,i){return {i:i,d:distPointToSegment(v,s.head,s.tail)};});
    return topKWeights(cands,AUTO_WEIGHT_K);});}

// Explicit vertex-group weights: `matching` is the subset of mesh.userData.vgroups whose name
// equals a bone's name in `boneOrder`. Per vertex, gather every matching group's weight at that
// vertex index (index space matches g.attributes.position 1:1 — see index.html's _exportVGroups
// header comment for the export-order contract), take the top 4 by weight, normalize. A vertex
// with NO group weight at all (sum 0) falls back to that single vertex's nearest-bone automatic
// weight so partial group coverage never leaves a vertex fully unweighted (would degenerate to
// the origin under skinning, since skinWeight summing to 0 transforms by nothing).
function computeGroupWeightsForMesh(mesh,rig,boneOrder,matching){
  var boneIndexByName={};boneOrder.forEach(function(be,i){boneIndexByName[be.name]=i;});
  var pos=mesh.geometry.attributes.position,n=pos.count;
  var fallbackVerts=[];
  var out=packInfluences(n,function(vi){
    var cands=[];
    matching.forEach(function(g){var w=g.w[vi];if(w!==undefined&&w>0)cands.push({i:boneIndexByName[g.name],d:1/Math.max(w,1e-6)});});
    // reuse topKWeights' inverse-distance machinery: treat 1/weight as a pseudo-distance so
    // higher explicit weights win exactly the same top-K + normalize path automatic weights use
    if(!cands.length){fallbackVerts.push(vi);return [];}
    var top=cands.sort(function(a,b){return a.d-b.d;}).slice(0,4);
    var w=top.map(function(t){return 1/t.d;}); // back to the original weight
    var sum=w.reduce(function(a,x){return a+x;},0)||1;
    return top.map(function(t,idx){return {i:t.i,w:w[idx]/sum};});});
  if(fallbackVerts.length){
    var segs=boneOrder.map(function(be){return boneRestWorldSegment(rig,be);});
    mesh.updateMatrixWorld(true);
    var v=new THREE.Vector3();
    fallbackVerts.forEach(function(vi){
      v.fromBufferAttribute(pos,vi).applyMatrix4(mesh.matrixWorld);
      var cands=segs.map(function(s,i){return {i:i,d:distPointToSegment(v,s.head,s.tail)};});
      var infl=topKWeights(cands,AUTO_WEIGHT_K);
      for(var k=0;k<4;k++){
        if(k<infl.length){out.skinIndex[vi*4+k]=infl[k].i;out.skinWeight[vi*4+k]=infl[k].w;}
        else{out.skinIndex[vi*4+k]=0;out.skinWeight[vi*4+k]=0;}}});}
  out.fallbackCount=fallbackVerts.length;
  return out;}

// Bind (or re-bind, e.g. "Recompute Auto Weights") one mesh to one rig. `opts.forceAuto` skips
// the vertex-group path even when matching groups exist. `opts.silent` suppresses the toast
// (used by applyPendingSkinBinds so a normal reload doesn't spam toasts per part).
function bindMeshToRig(mesh,rig,opts){
  opts=opts||{};
  if(!mesh||!rig||!rig.bones.length){toast('Rig has no bones yet');return null;}
  var geo=mesh.geometry;
  // Skeleton bone order is authoritative for skinIndex values (they index skeleton.bones /
  // skeleton.boneInverses directly) — map each skeleton bone back to its `be` record rather
  // than trusting rig.bones' own array order, which can drift after Set Parent.
  var boneOrder=rig.skeleton.bones.map(function(boneObj){
    for(var i=0;i<rig.bones.length;i++)if(rig.bones[i].bone===boneObj)return rig.bones[i];
    return null;});
  if(boneOrder.some(function(x){return !x;})){toast('Rig/skeleton out of sync — reselect the rig');return null;}

  var vgroups=mesh.userData.vgroups;
  var matching=(!opts.forceAuto&&vgroups)?vgroups.filter(function(g){
    return boneOrder.some(function(be){return be.name===g.name;});}):[];

  // Bind pose: rest the rig, compute weights + bind (which captures THIS rest pose via
  // skeleton.calculateInverses()), then restore whatever pose the user was actually in.
  var savedQuats=rig.bones.map(function(be){return be.bone.quaternion.clone();});
  rig.bones.forEach(function(be){be.bone.quaternion.identity();});
  rig.root.updateMatrixWorld(true);

  var source,res;
  if(matching.length){source='groups';res=computeGroupWeightsForMesh(mesh,rig,boneOrder,matching);}
  else{source='auto';res=computeAutoWeightsForMesh(mesh,rig,boneOrder);}

  geo.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(res.skinIndex,4));
  geo.setAttribute('skinWeight',new THREE.Float32BufferAttribute(res.skinWeight,4));

  var skinned=mesh.isSkinnedMesh?mesh:new THREE.SkinnedMesh(geo,mesh.material);
  if(!mesh.isSkinnedMesh){
    skinned.name=mesh.name;skinned.castShadow=mesh.castShadow;skinned.receiveShadow=mesh.receiveShadow;
    skinned.userData=mesh.userData;
    skinned.position.copy(mesh.position);skinned.quaternion.copy(mesh.quaternion);skinned.scale.copy(mesh.scale);
    var parent=mesh.parent;parent.add(skinned);parent.remove(mesh);}
  skinned.bind(rig.skeleton); // no explicit bindMatrix -> calculateInverses() runs now, against the rest pose above
  skinned.normalizeSkinWeights();

  rig.bones.forEach(function(be,i){be.bone.quaternion.copy(savedQuats[i]);});
  rig.root.updateMatrixWorld(true);

  skinned.userData.skinBind={rigId:rig.id,source:source};
  var tid=skinned.userData.targetId;
  if(tid){registerTarget(tid,skinned);recordSkinBind(tid,rig.id,!!opts.forceAuto);}
  if(!opts.silent)toast(source==='auto'?'Bound '+skinned.name+' — automatic weights (no matching vertex groups)':'Bound '+skinned.name+' — vertex groups');
  scheduleAnimAutosave();invalidate();

function unbindMesh(mesh){
  if(!mesh||!mesh.isSkinnedMesh)return null;

  plain.name=mesh.name;plain.castShadow=mesh.castShadow;plain.receiveShadow=mesh.receiveShadow;
  plain.userData=mesh.userData;
  plain.position.copy(mesh.position);plain.quaternion.copy(mesh.quaternion);plain.scale.copy(mesh.scale);
  delete plain.userData.skinBind;
  var parent=mesh.parent;parent.add(plain);parent.remove(mesh);
  var tid=plain.userData.targetId;
  if(tid){registerTarget(tid,plain);clearSkinBind(tid);}
  scheduleAnimAutosave();invalidate();
  return plain;}

// Whole-model convenience wrappers (the Skinning UI operates on the active model's parts as a
// unit, Blender-"select mesh(es)+armature, bind"-style, rather than one part at a time).
function activeModelGroup(){
  if(!state.models||!state.models.length)return null;
  var found=state.models.filter(function(g){return g.userData&&g.userData.targetId===state.activeId;})[0];
  return found||state.models[0];}
function bindModelToRig(grp,rig){
  if(!grp||!rig||!rig.bones.length){toast('Rig has no bones yet');return;}
  var parts=grp.children.slice(),usedAuto=false,n=0;
  parts.forEach(function(mesh){if(!mesh.isMesh&&!mesh.isSkinnedMesh)return;
    var sk=bindMeshToRig(mesh,rig,{silent:true});if(sk){n++;if(sk.userData.skinBind.source==='auto')usedAuto=true;}});
  if(!n){toast('Nothing to bind');return;}
  toast(usedAuto?'Bound '+n+' part(s) to '+rig.name+' — some used automatic weights (no matching vertex groups)':'Bound '+n+' part(s) to '+rig.name);}
function unbindModel(grp){
  if(!grp)return;var n=0;
  grp.children.slice().forEach(function(mesh){if(mesh.isSkinnedMesh){unbindMesh(mesh);n++;}});
  toast(n?'Unbound '+n+' part(s)':'Nothing was bound');}
function recomputeAutoWeightsForModel(grp){
  if(!grp)return;var n=0;
  grp.children.slice().forEach(function(mesh){
    if(!mesh.isSkinnedMesh)return;var rig=Rigs[mesh.userData.skinBind&&mesh.userData.skinBind.rigId];if(!rig)return;
    bindMeshToRig(mesh,rig,{forceAuto:true,silent:true});n++;});
  toast(n?'Recomputed automatic weights for '+n+' part(s)':'Nothing bound to recompute');}

/* ═══════════════════════════════════════════════════════
   ANIMATION CORE (Wave D1 seed) — the load-bearing data model
   every later wave (dope sheet, graph editor, camera/path anim,
   action clips, onion skin, video/code export) builds on.

   Anim   = { fps, start, end, time, playing, tracks:[Track] }
   Track  = { id, targetId, path, keys:[{ t, v, interp }] }
     - targetId resolves through Registry (targetId -> live Object3D)
     - path is a dotted accessor ('position.x', 'rotation.y', ...)
       resolved against the live object via resolvePath()
     - v is currently always a number (scalar tracks only — this
       seed does not yet store quaternion/vector keys as one unit)
   ═══════════════════════════════════════════════════════ */
var trackIdc=1;
var Anim={fps:24,start:0,end:96,time:0,playing:false,loop:true,tracks:[]};

// Resolve a dotted path ('position.x') against a live object into {obj,key}
// so callers can do obj[key] to read or obj[key]=v to write.
function resolvePath(target,path){
  var segs=path.split('.'),obj=target;
  for(var i=0;i<segs.length-1;i++){obj=obj[segs[i]];if(obj==null)return null;}
  return {obj:obj,key:segs[segs.length-1]};}

Anim.getValue=function(targetId,path){var t=resolveTarget(targetId);if(!t)return null;
  var r=resolvePath(t,path);return r?r.obj[r.key]:null;};
Anim.setValue=function(targetId,path,v){var t=resolveTarget(targetId);if(!t)return;
  var r=resolvePath(t,path);if(!r)return;
  if(Array.isArray(v)&&r.obj[r.key]&&r.obj[r.key].isQuaternion)r.obj[r.key].set(v[0],v[1],v[2],v[3]);
  else r.obj[r.key]=v;};
Anim.findTrack=function(targetId,path){for(var i=0;i<this.tracks.length;i++){
  var tr=this.tracks[i];if(tr.targetId===targetId&&tr.path===path)return tr;}return null;};

// Insert (or overwrite, if one already sits at t) a key at time t, reading the CURRENT
// live value off the resolved object — this is what every "Key ___" UI action calls.
// Scalar tracks store a plain number; quaternion tracks (e.g. a bone's 'quaternion' path,
// see the Armature system above) store a plain [x,y,z,w] array so the whole track stays
// JSON-safe for the autosave round-trip — Anim.sample slerps these instead of lerping.
Anim.insertKey=function(targetId,path,t){
  var v=this.getValue(targetId,path);
  var isQuat=!!(v&&v.isQuaternion);
  if(v==null||(!isQuat&&typeof v!=='number'))return null; // scalar or quaternion tracks only
  var tr=this.findTrack(targetId,path);
  if(!tr){tr={id:'trk'+(trackIdc++),targetId:targetId,path:path,keys:[],valueType:isQuat?'quat':'scalar'};this.tracks.push(tr);}
  var eps=1e-6,existIdx=-1;
  for(var i=0;i<tr.keys.length;i++){if(Math.abs(tr.keys[i].t-t)<eps){existIdx=i;break;}}
  var key={t:t,v:isQuat?[v.x,v.y,v.z,v.w]:v,interp:'linear'};
  if(existIdx>=0)tr.keys[existIdx]=key;else{tr.keys.push(key);tr.keys.sort(function(a,b){return a.t-b.t;});}
  scheduleAnimAutosave();
  return tr;};

var _slerpA=new THREE.Quaternion(),_slerpB=new THREE.Quaternion();
function slerpQuatArr(a,b,f){_slerpA.set(a[0],a[1],a[2],a[3]);_slerpB.set(b[0],b[1],b[2],b[3]);
  _slerpA.slerp(_slerpB,f);return [_slerpA.x,_slerpA.y,_slerpA.z,_slerpA.w];}

// Evaluate every track at `time` and write the interpolated value through the path
// resolver. Binary-searches the surrounding key pair per track, then lerps (scalar tracks)
// or slerps (quaternion tracks, via THREE.Quaternion.slerp — proper spherical interpolation,
// not a componentwise lerp+normalize approximation).
Anim.sample=function(time){
  var self=this;
  this.tracks.forEach(function(tr){
    var keys=tr.keys;if(!keys.length)return;
    var isQuat=tr.valueType==='quat';
    if(keys.length===1){self.setValue(tr.targetId,tr.path,keys[0].v);return;}
    if(time<=keys[0].t){self.setValue(tr.targetId,tr.path,keys[0].v);return;}
    if(time>=keys[keys.length-1].t){self.setValue(tr.targetId,tr.path,keys[keys.length-1].v);return;}
    var lo=0,hi=keys.length-1;
    while(hi-lo>1){var mid=(lo+hi)>>1;if(keys[mid].t<=time)lo=mid;else hi=mid;}
    var a=keys[lo],b=keys[hi],span=b.t-a.t,f=span>1e-9?(time-a.t)/span:0,val;
    if(a.interp==='constant')val=a.v;
    else if(isQuat)val=slerpQuatArr(a.v,b.v,f);
    else val=a.v+(b.v-a.v)*f;
    self.setValue(tr.targetId,tr.path,val);});
  this.time=time;};

// Convenience for the Timeline "Key Position" button: key all three axes at once.
function insertPositionKey(targetId,t){
  ['position.x','position.y','position.z'].forEach(function(p){Anim.insertKey(targetId,p,t);});}

/* ---------------- animation autosave (own key, separate from the modeler's) ---------------- */
var ANIM_AUTOSAVE_KEY='roxyAnimAutosave',animAutosaveTimer=null;
function scheduleAnimAutosave(){clearTimeout(animAutosaveTimer);animAutosaveTimer=setTimeout(doAnimAutosave,600);}
// v2 (Wave C1): adds `rigs` (serialized armatures — see serializeRigs/rebuildRigFromSerialized
// above). v1 saves (no `rigs` key, no `v` tag at all) still load fine: tryRestoreAnimAutosave
// only rebuilds rigs when the field is present.
// v3 (Wave C3): bones may carry a `limits` field (per-axis rotation clamps). v2 saves load
// unchanged (missing field -> unlimited), and a v3 save read by v2 code simply ignores it —
// the bump is additive, no migration needed.
// v4 (Wave C4): bones may carry a `constraints` field (copyLoc/copyRot/trackTo/limitRot list).
// v2/v3 saves load unchanged (missing field -> empty constraints array). Scene-object
// constraints are intentionally NOT part of this payload — see the C4 section header above.
// Wave D3 adds `loop` (transport loop toggle) additively — still v4: older payloads simply
// lack the field and restore to the default (true), older code ignores it.
// v5 (Wave C2): adds `skins` (SkinBinds — which part is bound to which rig, groups-vs-forced-
// auto — see the Skinning section header above for why intent, not raw skin arrays, is what's
// persisted). v2/v3/v4 saves load unchanged (missing field -> pendingSkinBinds stays null, no
// binds reconstructed, exactly like a save from before skinning existed).
function doAnimAutosave(){try{localStorage.setItem(ANIM_AUTOSAVE_KEY,JSON.stringify(
  {v:5,fps:Anim.fps,start:Anim.start,end:Anim.end,loop:Anim.loop,tracks:Anim.tracks,rigs:serializeRigs(),skins:serializeSkinBinds()}));}catch(e){}}
function tryRestoreAnimAutosave(){
  var raw;try{raw=localStorage.getItem(ANIM_AUTOSAVE_KEY);}catch(e){return false;}
  if(!raw)return false;
  var data;try{data=JSON.parse(raw);}catch(e){return false;}
  if(!data)return false;
  Anim.fps=data.fps||24;Anim.start=data.start||0;Anim.end=data.end!=null?data.end:96;
  Anim.loop=data.loop!==false;Anim.tracks=data.tracks||[];
  var maxId=0;Anim.tracks.forEach(function(tr){var n=+(''+tr.id).replace(/\D/g,'');if(n>maxId)maxId=n;});trackIdc=maxId+1;
  pendingSkinBinds=(data.skins&&data.skins.length)?data.skins:null; // v5+; consumed by applyPendingSkinBinds() once the model is loaded
  if(data.rigs&&data.rigs.length){data.rigs.forEach(rebuildRigFromSerialized);
    var rigIds=Object.keys(Rigs);if(rigIds.length&&!Arm.rigId)Arm.rigId=rigIds[0];} // v1 saves simply have no rigs to restore
  return true;}

/* ---------------- playback clock: fixed-timestep accumulation over requestAnimationFrame ---------------- */
var pbLast=null,pbAcc=0;
function stepPlayback(now){
  if(!Anim.playing){pbLast=null;pbAcc=0;return;}
  if(pbLast==null){pbLast=now;return;}
  var dt=(now-pbLast)/1000;pbLast=now;pbAcc+=dt;
  var stepDur=1/Math.max(1,Anim.fps),moved=false,stopped=false;
  while(pbAcc>=stepDur){pbAcc-=stepDur;Anim.time+=1;moved=true;
    if(Anim.time>Anim.end){
      if(Anim.loop)Anim.time=Anim.start; // wrap (Wave D3: loop is a transport toggle now)
      else{Anim.time=Anim.end;Anim.playing=false;stopped=true;break;}}} // hold the last frame
  if(moved){Anim.sample(Anim.time);syncScrubUI();invalidate();}
  if(stopped)renderPanel();} // refresh the Play/Pause label after an auto-stop

function syncScrubUI(){var s=$('#tlScrub');if(s)s.value=Anim.time;
  var l=$('#tlTimeLbl');if(l)l.textContent='t='+Anim.time.toFixed(0)+'  ('+(Anim.time/Math.max(1,Anim.fps)).toFixed(2)+'s)';
  if(typeof Dope==='object'&&Dope.canvas&&Dope.canvas.isConnected)Dope.draw();} // keep the dope-sheet playhead in lockstep with the scrub bar
function clampTime(){if(Anim.time<Anim.start)Anim.time=Anim.start;if(Anim.time>Anim.end)Anim.time=Anim.end;}
// Transport helpers (Wave D3): whole-frame jumps shared by the |< -1 +1 >| buttons, the
// tap-to-type frame label, and the dope-sheet ruler scrub. One step = 1 frame = 1/fps s.
function gotoFrame(t){Anim.time=clamp(Math.round(t),Anim.start,Anim.end);Anim.sample(Anim.time);syncScrubUI();invalidate();}
function stepFrame(d){gotoFrame(Anim.time+d);}

/* ---------------- numeric field + tap-to-type slider (same pattern as index.html's slider()) ---------------- */
function slider(label,min,max,val,step,on){
  var out=el('span',{class:'muted small tap-edit',text:(+val).toFixed(2),title:'Tap to enter an exact value'});
  var r=el('input',{type:'range',min:min,max:max,step:step||.01,value:val,
    oninput:function(e){out.textContent=(+e.target.value).toFixed(2);on(+e.target.value);invalidate();}});
  out.addEventListener('click',function(){
    var sv=+r.value,input=prompt(label.replace(/\s+$/,'')+' (range '+min+' to '+max+'):',sv);
    if(input==null)return;var nv=+input;if(!isFinite(nv))return;
    nv=Math.max(min,Math.min(max,nv));r.value=nv;out.textContent=nv.toFixed(2);on(nv);invalidate();});
  return el('div',{},[el('label',{class:'fld'},[label+'  ',out]),r]);}
function numField(label,val,step,on){
  var inp=el('input',{type:'number',value:val,step:step||1,onchange:function(e){on(+e.target.value);}});
  return el('div',{},[el('label',{class:'fld',text:label}),inp]);}

/* ═══════════════════════════════════════════════════════
   Wave D3 — DOPE SHEET (the Timeline tab's centerpiece).

   Canvas-drawn sheet: rows = tracks grouped by target (one collapsible
   header row per targetId with a merged-key summary), columns = time
   (ruler with frame numbers at nice steps, fps-aware). The layout model
   is a flat `Dope.rows` array rebuilt by buildRows() on every draw —
   {kind:'group'|'track', tid, track?, y, label} — plus a pure time<->x
   mapping (timeToX/xToTime from Dope.t0 + Dope.pxf), so hit-testing
   (hitTest) and the verification suite share the exact geometry the
   renderer draws.

   Mobile-first interaction (GAP_ANALYSIS §3: keyframe diamonds need
   >=36px effective touch targets even though they draw ~12px — the
   hit-test uses an 18px horizontal slop across the full 36px row):
     - tap a diamond -> select it; an action bar under the canvas offers
       Frame / Value tap-to-type (prompt(), the slider() convention),
       Duplicate, Delete, Undo
     - drag a selected diamond -> retime, snapped to whole frames and
       clamped so no selected key crosses below t=0; exactly ONE undo
       snapshot per drag
     - long-press a diamond -> ADD it to the selection (multi-select);
       the Box Select toggle turns empty-area drags into a marquee
     - group-header diamonds are merged summaries: tapping one selects
       every key at that frame across the group's tracks (drag moves
       them together)
     - ruler tap/drag scrubs (same whole-frame snap + start/end clamp as
       #tlScrub; both stay in sync through syncScrubUI)
     - empty-area drag pans; two-pointer pinch zooms the time axis
       (the viewport's ptrs-Map two-pointer pattern), clamped between
       whole-anim-visible and 60 px/frame

   Undo: this file has no global History object yet, so key edits get a
   minimal dedicated stack (KeyUndo) of JSON snapshots of Anim.tracks —
   tracks are JSON-safe by design (see the Anim section header). One
   snapshot per user action (drag / delete / duplicate / type-in).
   Every edit mutates Anim.tracks directly (single source of truth) and
   re-runs Anim.sample(Anim.time), so playback and the 3D view reflect
   edits immediately; scheduleAnimAutosave keeps persistence.
   ═══════════════════════════════════════════════════════ */
var KeyUndo=[]; // JSON snapshots of Anim.tracks — minimal undo for KEY edits only (see header)
function pushKeyUndo(){try{KeyUndo.push(JSON.stringify(Anim.tracks));if(KeyUndo.length>40)KeyUndo.shift();}catch(e){}}
function trackById(id){for(var i=0;i<Anim.tracks.length;i++)if(Anim.tracks[i].id===id)return Anim.tracks[i];return null;}
function keyIndexAt(tr,t){for(var i=0;i<tr.keys.length;i++)if(Math.abs(tr.keys[i].t-t)<1e-6)return i;return -1;}
function dopeGroupLabel(tid){var m=/bone:([^\/]+)/.exec(tid);if(m)return m[1];
  var c=/con:(\w+)$/.exec(tid);if(c)return 'con:'+c[1];return tid;}
function dopeGroupTimes(row){var seen={},out=[];row.tracks.forEach(function(tr){tr.keys.forEach(function(k){
  var kk=k.t.toFixed(4);if(!seen[kk]){seen[kk]=1;out.push(k.t);}});});out.sort(function(a,b){return a-b;});return out;}
function diamondPath(c,x,y,r){c.beginPath();c.moveTo(x,y-r);c.lineTo(x+r,y);c.lineTo(x,y+r);c.lineTo(x-r,y);c.closePath();}
// Nice ruler label interval: smallest candidate giving >=44px between labels; fps multiples
// are included so second boundaries land on labels at typical zooms.
function rulerStep(pxf,fps){var cand=[1,2,5,10,20,50,100,200,500,1000,2000,5000];
  if(fps>2)cand.push(fps,fps*2,fps*4);
  cand.sort(function(a,b){return a-b;});
  for(var i=0;i<cand.length;i++)if(cand[i]*pxf>=44)return cand[i];
  return cand[cand.length-1];}

var Dope={
 canvas:null,ctx:null,cssW:0,cssH:0,
 t0:0,pxf:0, // left visible frame + horizontal zoom (px per frame); pxf=0 means "fit on first draw"
 labelW:92,rowH:36,rulerH:26,
 collapsed:{},sel:[],boxMode:false,box:null,rows:[],
 _ptrs:new Map(),_drag:null,_pinch:null,_longT:null,

 attach:function(cv){ // called by panelTimeline for each freshly built canvas
  this.canvas=cv;this.ctx=cv.getContext('2d');
  this._ptrs.clear();this._drag=null;this._pinch=null;this.box=null;
  var self=this;
  cv.addEventListener('pointerdown',function(e){self._down(e);});
  cv.addEventListener('pointermove',function(e){self._move(e);});
  cv.addEventListener('pointerup',function(e){self._up(e,false);});
  cv.addEventListener('pointercancel',function(e){self._up(e,true);});
  cv.addEventListener('wheel',function(e){e.preventDefault();self.zoomAt(self._ex(e),Math.pow(1.0015,-e.deltaY));self.draw();},{passive:false});},
 _ex:function(e){return e.clientX-this.canvas.getBoundingClientRect().left;},
 _ey:function(e){return e.clientY-this.canvas.getBoundingClientRect().top;},

 /* ---- view maths ---- */
 timeToX:function(t){return this.labelW+(t-this.t0)*this.pxf;},
 xToTime:function(x){return this.t0+(x-this.labelW)/this.pxf;},
 _minPxf:function(){var vw=Math.max(40,this.cssW-this.labelW);
  return Math.min(vw/(Math.max(1,Anim.end-Anim.start)+1),60);},
 fitAll:function(){this.pxf=this._minPxf();this.t0=Anim.start;},
 clampView:function(){this.pxf=clamp(this.pxf,this._minPxf(),60); // whole-anim-visible <-> per-frame detail
  var visSpan=Math.max(1,this.cssW-this.labelW)/this.pxf,lo=Math.min(Anim.start,0);
  this.t0=clamp(this.t0,lo,Math.max(lo,Anim.end+1-visSpan));},
 zoomAt:function(px,f){var t=this.xToTime(px);this.pxf=this.pxf*f;this.clampView();
  this.t0+=t-this.xToTime(px);this.clampView();},
