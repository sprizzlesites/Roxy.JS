<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Blaster Studio — a tiny 3D editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14100c;--ink:#f3ece4;--muted:#a8978a;--faint:#6f635a;--line:rgba(255,255,255,.10);
  --panel:rgba(24,19,15,.86);--card:rgba(255,255,255,.045);--pink:#ff8fb1;--pink2:#ff6f9c;--ok:#9be0b0;--err:#ff9b9b;
  --rail:64px;--side:320px;--bar:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Space Grotesk",system-ui,sans-serif;font-size:14px}
button{font-family:inherit;color:var(--ink);cursor:pointer;border:1px solid var(--line);background:var(--card);
  border-radius:10px;padding:9px 11px;font-size:13px;transition:background .14s,border-color .14s,transform .04s}
button:hover{background:rgba(255,255,255,.10)}button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
button.pri{background:var(--pink);color:#2a141d;border-color:transparent;font-weight:600}
button.pri:hover{background:#ffa3c0}
button.on{background:rgba(255,143,177,.18);border-color:rgba(255,143,177,.45);color:#ffd4e2}
input[type=range]{width:100%;accent-color:var(--pink)}
input[type=text],input[type=number],select{font-family:inherit;font-size:13px;color:var(--ink);background:rgba(0,0,0,.28);
  border:1px solid var(--line);border-radius:9px;padding:8px 9px;width:100%}
input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
label.fld{display:block;font-size:11px;letter-spacing:.04em;color:var(--muted);margin:0 0 5px}
.spread{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px}
.muted{color:var(--muted)}.small{font-size:11.5px}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}

#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--rail) 1fr var(--side);grid-template-rows:var(--bar) 1fr;
  grid-template-areas:"bar bar bar" "rail stage panel";}
#bar{grid-area:bar;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(12px);z-index:5}
#bar .logo{font:600 15px/1 "Fraunces",serif;letter-spacing:.01em}
#bar .dot{width:9px;height:9px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink)}
#bar .vtitle{font-size:12px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
#bar .sp{flex:1}
#bar .act{padding:7px 9px;font-size:12px}

#rail{grid-area:rail;display:flex;flex-direction:column;gap:4px;padding:8px 6px;border-right:1px solid var(--line);background:var(--panel)}
#rail .tab{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;border-radius:12px;
  padding:9px 4px;color:var(--muted);font-size:9.5px;letter-spacing:.04em}
#rail .tab .ic{width:22px;height:22px;display:block}
#rail .tab.on{color:var(--ink);background:var(--card)}
#rail .tab.on .ic{filter:drop-shadow(0 0 6px rgba(255,143,177,.5))}

#stage{grid-area:stage;position:relative;overflow:hidden;background:
  radial-gradient(120% 120% at 50% 20%, #241b14 0%, #160f0b 60%, #0e0a07 100%)}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.gl-slot{position:absolute;inset:0}
canvas{display:block;touch-action:none}

/* paint view split */
.view[data-view=paint]{display:none}
.view[data-view=paint].on{display:grid;grid-template-columns:1fr 360px}
.paint2d{position:relative;display:flex;align-items:center;justify-content:center;background:#0d0a07;overflow:hidden}
.paint2d canvas{max-width:96%;max-height:96%;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.paint-prev{position:relative;border-left:1px solid var(--line)}

#panel{grid-area:panel;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
#panel h2{font:600 13px/1.1 "Space Grotesk";margin:0 0 2px}
#panel .sub{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.section-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:14px 0 8px}

#tabbar{display:none}
#sheetHandle{display:none}

.assets-body{position:absolute;inset:0;overflow:auto;padding:18px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.thumb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.thumb .nm{font-weight:600}.thumb .mt{font-size:11px;color:var(--muted)}
.modlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.modrow{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.modrow .top{display:flex;align-items:center;gap:8px}
.modrow .nm{flex:1;font-weight:500;font-size:12.5px}
.pill{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.dbitem{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px}
.dbitem .nm{flex:1}.dbitem .tg{font-size:10px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#241b14;border:1px solid var(--line);
  color:var(--ink);padding:9px 14px;border-radius:999px;font-size:12.5px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.fab{position:absolute;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;background:var(--pink);color:#2a141d;
  border:none;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:6}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.chip.on{background:rgba(255,143,177,.16);border-color:rgba(255,143,177,.4)}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99;
  font-size:14px;color:var(--muted);text-align:center;padding:24px}

/* ---------- mobile ---------- */
@media (max-width:820px){
  :root{--side:0px}
  #app{grid-template-columns:1fr;grid-template-rows:var(--bar) 1fr;grid-template-areas:"bar" "stage"}
  #rail{display:none}
  .view[data-view=paint].on{grid-template-columns:1fr;grid-template-rows:1fr}
  .paint-prev{display:none}
  #panel{position:fixed;left:0;right:0;bottom:0;top:auto;height:62vh;border-left:none;border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;transform:translateY(calc(100% - 42px));transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:20;
    box-shadow:0 -16px 40px rgba(0,0,0,.5)}
  #panel.open{transform:translateY(0)}
  #sheetHandle{display:flex;align-items:center;justify-content:center;gap:8px;height:30px;margin:-4px -14px 8px;cursor:grab}
  #sheetHandle .bar{width:42px;height:4px;border-radius:99px;background:var(--faint)}
  #sheetHandle .lbl{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:58px;background:var(--panel);
    border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  #tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;
    border:none;color:var(--muted);font-size:9.5px;letter-spacing:.03em}
  #tabbar .tab .ic{width:21px;height:21px}
  #tabbar .tab.on{color:var(--pink)}
  #panel{bottom:58px}
  .fab{bottom:74px}
}
@media (max-width:820px){ .desktop-only{display:none} }
@media (min-width:821px){ .mobile-only{display:none} }
#rotBall{position:absolute;right:12px;top:12px;width:80px;height:80px;cursor:grab;display:none;z-index:8;touch-action:none;border-radius:50%}
</style>
</head>
<body>
<div id="boot">loading studio…</div>

<div id="app" aria-hidden="false">
  <header id="bar">
    <span class="dot"></span><span class="logo">Blaster Studio</span>
    <span class="vtitle" id="vtitle">Viewer</span>
    <span class="small muted desktop-only" id="stat" style="margin-left:6px"></span>
    <span class="sp"></span>
    <button class="act" id="btnUndo" title="Undo (Ctrl+Z)" style="font-size:15px;line-height:1">↶</button>
    <button class="act" id="btnRedo" title="Redo (Ctrl+Y)" style="font-size:15px;line-height:1">↷</button>
    <button class="act" id="btnSnap" title="Grid snap">Snap</button>
    <button class="act" id="btnFrame" title="Frame">Frame</button>
    <button class="act" id="btnShot" title="Screenshot">Shot</button>
  </header>

  <nav id="rail"></nav>

  <main id="stage">
    <section class="view on" data-view="viewer"><div class="gl-slot" id="slot-viewer"></div></section>
    <section class="view" data-view="paint">
      <div class="paint2d"><canvas id="paintCanvas" width="1024" height="1024"></canvas></div>
      <div class="paint-prev gl-slot" id="slot-paint"></div>
    </section>
    <section class="view" data-view="build"><div class="gl-slot" id="slot-build"></div><button class="fab" id="fabBuild">+</button></section>
    <section class="view" data-view="scene"><div class="gl-slot" id="slot-scene"></div><button class="fab" id="fabScene">+</button></section>
    <section class="view" data-view="assets"><div class="assets-body" id="assetsBody"></div></section>
    <section class="view" data-view="edit"><div class="gl-slot" id="slot-edit"></div></section>
    <canvas id="rotBall" width="80" height="80"></canvas>
  </main>

  <aside id="panel">
    <div id="sheetHandle"><span class="bar"></span><span class="lbl" id="sheetLbl">Tools</span></div>
    <div id="panelBody"></div>
  </aside>

  <nav id="tabbar"></nav>
</div>

<input type="file" id="fileModel" accept=".obj,.glb,.gltf" style="display:none">
<input type="file" id="fileImg" accept="image/*" style="display:none">
<input type="file" id="fileProj" accept=".json" style="display:none">
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
 onerror="document.getElementById('boot').textContent='Could not load Three.js (CDN blocked). Open this file in a normal browser tab.'"></script>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var boot=$('#boot');
if(typeof THREE==='undefined'){boot.textContent='Three.js failed to load.';return;}
function el(t,a,kids){var n=document.createElement(t);a=a||{};for(var k in a){if(k==='class')n.className=a[k];
  else if(k==='html')n.innerHTML=a[k];else if(k==='text')n.textContent=a[k];else if(k.slice(0,2)==='on')n.addEventListener(k.slice(2).toLowerCase(),a[k]);
  else n.setAttribute(k,a[k]);}(kids||[]).forEach(function(c){if(c==null)return;n.appendChild(typeof c==='string'?document.createTextNode(c):c);});return n;}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},1800);}
function icon(p){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var ICONS={
 viewer:'<circle cx="12" cy="12" r="3.2"/><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/>',
 paint:'<path d="M12 3a9 9 0 0 0 0 18c1 0 1.6-.8 1.6-1.7 0-1.2-1-1.6-1-2.6 0-.8.7-1.4 1.5-1.4H16a5 5 0 0 0 5-5c0-4-4-7.3-9-7.3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16.5" cy="11" r="1"/>',
 build:'<path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/>',
 scene:'<rect x="2.5" y="6" width="13" height="9" rx="1.5"/><path d="M15.5 9l5-2.5v9L15.5 12"/>',
 assets:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
 edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>'
};
var VIEWS=[['viewer','Viewer'],['paint','Paint'],['build','Build'],['scene','Scene'],['assets','Assets'],['edit','Edit']];

/* ---------------- renderer ---------------- */
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var maxAniso=renderer.capabilities.getMaxAnisotropy();
var pmrem=new THREE.PMREMGenerator(renderer);

/* shared canvas helpers */
function dataURLtoU8(d){var b=atob(d.split(',')[1]);var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function concat(L){var n=0;L.forEach(function(a){n+=a.length;});var o=new Uint8Array(n),k=0;L.forEach(function(a){o.set(a,k);k+=a.length;});return o;}
function download(blob,name){var u=URL.createObjectURL(blob);var a=el('a',{href:u,download:name});document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);}
function downloadURL(url,name){var a=el('a',{href:url,download:name});document.body.appendChild(a);a.click();a.remove();}

/* fbm noise canvas */
function fbm(size,layers){var c=el('canvas');c.width=c.height=size;var g=c.getContext('2d');
  g.fillStyle='#808080';g.fillRect(0,0,size,size);g.globalCompositeOperation='overlay';
  layers.forEach(function(L){var sm=el('canvas');sm.width=sm.height=L.s;var sg=sm.getContext('2d');var im=sg.createImageData(L.s,L.s);
    for(var p=0;p<im.data.length;p+=4){var v=Math.random()*255;im.data[p]=im.data[p+1]=im.data[p+2]=v;im.data[p+3]=255;}
    sg.putImageData(im,0,0);g.globalAlpha=L.a;g.imageSmoothingEnabled=true;g.drawImage(sm,0,0,size,size);});
  g.globalAlpha=1;g.globalCompositeOperation='source-over';return c;}
function tex(cv,srgb,rep){var t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);
  if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;t.needsUpdate=true;return t;}

/* ---------------- environment presets ---------------- */
var ENVS=[
 {id:'studio',name:'Studio Warm',bg:'#160f0b',stops:[[0,'#fff6ea'],[.45,'#caa98f'],[1,'#1b130d']],cards:[[300,150,230,.95],[760,120,150,.7],[540,330,380,.32]],floor:true},
 {id:'sunset',name:'Sunset',bg:'#241019',stops:[[0,'#ffd9a0'],[.4,'#ff9e7a'],[.75,'#7a3b6b'],[1,'#241019']],cards:[[280,170,260,.85],[820,260,200,.45]],floor:true},
 {id:'overcast',name:'Soft Overcast',bg:'#cdd2d6',stops:[[0,'#ffffff'],[.5,'#d7dce0'],[1,'#9aa1a8']],cards:[[512,120,520,.5]],floor:true},
 {id:'night',name:'Night Blue',bg:'#06080f',stops:[[0,'#48618f'],[.5,'#1b2740'],[1,'#05070d']],cards:[[300,140,200,.6],[760,160,160,.4]],floor:true},
 {id:'paper',name:'White Studio',bg:'#f3efe6',stops:[[0,'#ffffff'],[.6,'#f2eee4'],[1,'#d9d2c4']],cards:[[380,150,360,.7],[700,200,260,.4]],floor:false},
 {id:'void',name:'Void',bg:'#000000',stops:[[0,'#222222'],[1,'#000000']],cards:[[400,160,300,.5]],floor:false}
];
var envCache={};
function buildEnvTex(p){if(envCache[p.id])return envCache[p.id];
  var c=el('canvas');c.width=1024;c.height=512;var g=c.getContext('2d');
  var gr=g.createLinearGradient(0,0,0,512);p.stops.forEach(function(s){gr.addColorStop(s[0],s[1]);});g.fillStyle=gr;g.fillRect(0,0,1024,512);
  (p.cards||[]).forEach(function(cd){var rg=g.createRadialGradient(cd[0],cd[1],0,cd[0],cd[1],cd[2]);
    rg.addColorStop(0,'rgba(255,255,255,'+cd[3]+')');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.beginPath();g.arc(cd[0],cd[1],cd[2],0,7);g.fill();});
  var t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
  var env=pmrem.fromEquirectangular(t).texture;t.dispose();envCache[p.id]=env;return env;}
function applyEnv(scene,id){var p=ENVS.filter(function(e){return e.id===id;})[0]||ENVS[0];
  scene.environment=buildEnvTex(p);scene.background=new THREE.Color(p.bg);scene.userData.envId=id;scene.userData.floor=p.floor;
  if(scene.userData.grid)scene.userData.grid.visible=!!p.floor&&scene.userData.showGrid!==false;invalidate();}

/* ---------------- scenes ---------------- */
function studioLights(scene){
  var k=new THREE.DirectionalLight(0xfff0db,2.0);k.position.set(3.2,5,2.4);k.castShadow=true;
  k.shadow.mapSize.set(2048,2048);k.shadow.camera.near=.5;k.shadow.camera.far=20;
  k.shadow.camera.left=-5;k.shadow.camera.right=5;k.shadow.camera.top=5;k.shadow.camera.bottom=-5;k.shadow.bias=-.0004;k.shadow.radius=6;
  scene.add(k);var r=new THREE.DirectionalLight(0xa9c2ff,.6);r.position.set(-3,2.2,-3.4);scene.add(r);
  scene.add(new THREE.HemisphereLight(0xfff3e6,0x2a1d12,.22));scene.userData.keyLight=k;}
function addGround(scene){var g=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.ShadowMaterial({opacity:.32}));
  g.rotation.x=-Math.PI/2;g.position.y=-0.001;g.receiveShadow=true;scene.add(g);
  var grid=new THREE.GridHelper(20,20,0x6b584a,0x3a2e25);grid.position.y=0;scene.add(grid);scene.userData.grid=grid;}

var viewerScene=new THREE.Scene();studioLights(viewerScene);applyEnv(viewerScene,'studio');viewerScene.userData.modelHolder=new THREE.Group();viewerScene.add(viewerScene.userData.modelHolder);
var buildScene=new THREE.Scene();studioLights(buildScene);buildScene.background=new THREE.Color('#161b22');addGround(buildScene);buildScene.userData.holder=new THREE.Group();buildScene.add(buildScene.userData.holder);
var sceneScene=new THREE.Scene();studioLights(sceneScene);applyEnv(sceneScene,'studio');addGround(sceneScene);sceneScene.userData.holder=new THREE.Group();sceneScene.add(sceneScene.userData.holder);sceneScene.userData.lights=new THREE.Group();sceneScene.add(sceneScene.userData.lights);
var editScene=new THREE.Scene();studioLights(editScene);editScene.background=new THREE.Color('#0e1218');addGround(editScene);

/* ---------------- cameras + orbit ---------------- */
function mkCam(){return new THREE.PerspectiveCamera(40,1,.05,500);}
var viewState={ // per-view orbit state
 viewer:{th:.7,ph:1.0,rad:4,tx:0,ty:0,tz:0,cam:mkCam()},
 paint:{th:.7,ph:1.0,rad:4,tx:0,ty:0,tz:0,cam:mkCam()},
 build:{th:.8,ph:1.0,rad:7,tx:0,ty:1,tz:0,cam:mkCam()},
 scene:{th:.8,ph:1.0,rad:8,tx:0,ty:1,tz:0,cam:mkCam()},
 edit:{th:.7,ph:1.0,rad:4,tx:0,ty:.5,tz:0,cam:mkCam()}
};
var active={view:'viewer',scene:viewerScene,vs:viewState.viewer};

/* on-demand rendering: only draw when something changed (battery + perf win) */
var renderFrames=8;function invalidate(n){renderFrames=Math.max(renderFrames,n||4);}

/* undo / redo */
var History={st:[],i:-1,lim:80,
 push:function(u,r){this.st=this.st.slice(0,this.i+1);this.st.push({u:u,r:r});if(this.st.length>this.lim)this.st.shift();this.i=this.st.length-1;updUndo();},
 undo:function(){if(this.i<0)return;this.st[this.i].u();this.i--;updUndo();afterHist();},
 redo:function(){if(this.i>=this.st.length-1)return;this.i++;this.st[this.i].r();updUndo();afterHist();}};
function updUndo(){var u=$('#btnUndo'),r=$('#btnRedo');if(u)u.style.opacity=History.i>=0?1:.35;if(r)r.style.opacity=History.i<History.st.length-1?1:.35;}
function afterHist(){renderPanel();if(active.view==='assets')renderAssets();invalidate();}

/* draggable transform gizmo (translate axes + uniform scale) */
var gizmoDrag=null;

    paint.drawing=true;paint.last=null;paint._3dSnap=paint.ctx.getImageData(0,0,1024,1024);
    do3dPaint(e.clientX,e.clientY);}

    editDirect.pending=true;editDirect.ptId=e.pointerId;

  invalidate();});

  if(active.view==='paint'&&ptrs.size===1&&paint.mode3d){
    if(paint.drawing){clickStart=null;do3dPaint(e.clientX,e.clientY);}
    return;}
  if(active.view==='edit'&&ptrs.size===1){
    if(editDirect.ptId===e.pointerId){
      if(!editDirect.active&&editDirect.pending&&Math.hypot(e.clientX-editDirect.startX,e.clientY-editDirect.startY)>5){
        editDirect.active=true;editDirect.pending=false;
        editDirect.snap=EM.V.map(function(v){return v.clone();});clickStart=null;}
      if(editDirect.active){
        var ddx=e.clientX-editDirect.prevX,ddy=e.clientY-editDirect.prevY;
        editDirect.prevX=e.clientX;editDirect.prevY=e.clientY;EM.grab(screenDeltaToWorld(ddx,ddy));}}

  invalidate();});
function endPtr(e){

    if(editDirect.active){

var idc=1;function uid(){return 'm'+(idc++);}

function makeMaterial(opts){opts=opts||{};return new THREE.MeshStandardMaterial({color:opts.color!=null?opts.color:0xcfcfcf,
  roughness:opts.rough!=null?opts.rough:.65,metalness:opts.metal!=null?opts.metal:0,side:opts.side||THREE.FrontSide,envMapIntensity:1});}

/* a model = THREE.Group with userData.parts=[{baseGeo,mesh,mat}], userData.mods=[], userData.extras=Group */
function makeModel(name,parts){var g=new THREE.Group();g.name=name;var extras=new THREE.Group();extras.name='__extras';
  g.userData={id:uid(),name:name,parts:[],mods:[],extras:extras};
  parts.forEach(function(p){var mesh=new THREE.Mesh(p.geo.clone(),p.mat);mesh.castShadow=true;mesh.receiveShadow=true;mesh.userData.part=true;
    g.add(mesh);g.userData.parts.push({baseGeo:p.geo.clone(),mesh:mesh,mat:p.mat});});
  g.add(extras);return g;}

function rebuildModel(model){var ud=model.userData;
  ud.parts.forEach(function(part){var geo=part.baseGeo.clone();
    ud.mods.forEach(function(m){var def=MODDB[m.def];if(def&&def.kind==='deform'&&m.on)def.apply(geo,m.val);});
    geo.computeVertexNormals();var old=part.mesh.geometry;part.mesh.geometry=geo;if(old&&old!==part.baseGeo)old.dispose();});
  while(ud.extras.children.length)ud.extras.remove(ud.extras.children[0]);
  ud.mods.forEach(function(m){var def=MODDB[m.def];if(def&&def.kind==='gen'&&m.on){var o=def.apply(model,m.val);if(o)ud.extras.add(o);}});invalidate();}

  var m=getModel(id);if(m){holder.add(m);frameObject(m,viewState.viewer);}invalidate();if(active.view==='viewer'||active.view==='paint')renderPanel();}
function getModel(id){for(var i=0;i<state.models.length;i++)if(state.models[i].userData.id===id)return state.models[i];return null;}
function addModel(m){state.models.push(m);return m;}

  var c=new THREE.Vector3();box.getCenter(c);var r=Math.max(s.x,s.y,s.z)*0.5||1;vs.tx=c.x;vs.ty=c.y;vs.tz=c.z;vs.rad=r*3.2;}

function doughAlbedo(){var s=512,c=el('canvas');c.width=c.height=s;var g=c.getContext('2d');g.fillStyle='#c47a44';g.fillRect(0,0,s,s);
  var n=fbm(512,[{s:8,a:.5},{s:24,a:.4},{s:96,a:.32},{s:300,a:.25}]);g.globalCompositeOperation='multiply';g.globalAlpha=.5;g.drawImage(n,0,0,s,s);
  g.globalCompositeOperation='overlay';g.globalAlpha=.55;g.drawImage(n,0,0,s,s);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  for(var i=0;i<1400;i++){var x=Math.random()*s,y=Math.random()*s,r=Math.random()*1.4+.3;g.fillStyle='rgba(255,238,214,'+(Math.random()*.55)+')';g.beginPath();g.arc(x,y,r,0,7);g.fill();}return c;}
function buildDonutIcingGeo(){var DR=1,IT=.52,PH=Math.PI*.93,uSeg=200,vSeg=56,pos=[],nor=[],uv=[],idx=[];
  function lo(u){return -Math.PI*(.10+.22*Math.pow(.5+.5*Math.sin(u*9),3));}
  for(var i=0;i<=uSeg;i++){var u=i/uSeg*Math.PI*2,l=lo(u);for(var j=0;j<=vSeg;j++){var vr=-Math.PI+j/vSeg*Math.PI*2,v=Math.min(Math.max(vr,l),PH);
    var cv=Math.cos(v),sv=Math.sin(v),cu=Math.cos(u),su=Math.sin(u),ring=DR+IT*cv;pos.push(ring*cu,IT*sv,ring*su);nor.push(cv*cu,sv,cv*su);uv.push(i/uSeg,j/vSeg);}}
  var w=vSeg+1;for(var a=0;a<uSeg;a++)for(var b=0;b<vSeg;b++){var p=a*w+b,q=p+w,r=p+1,s=q+1;idx.push(p,q,s,p,s,r);}
  var geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(idx);return geo;}
function buildDonut(){var dGeo=new THREE.TorusGeometry(1,.46,40,160);dGeo.rotateX(-Math.PI/2);
  var dMat=makeMaterial({color:0xffffff,rough:.62});dMat.map=tex(doughAlbedo(),true,[8,3]);dMat.bumpMap=tex(fbm(512,[{s:8,a:.45},{s:32,a:.4},{s:140,a:.3}]),false,[8,3]);dMat.bumpScale=.016;
  var iMat=new THREE.MeshPhysicalMaterial({color:0xf6a8c4,roughness:.22,clearcoat:.85,clearcoatRoughness:.28,side:THREE.DoubleSide,envMapIntensity:1.3});
  var m=makeModel('Donut',[{geo:dGeo,mat:dMat},{geo:buildDonutIcingGeo(),mat:iMat}]);return m;}

 sprinkles:{name:'Sprinkles',kind:'gen',tags:'scatter surface decorate candy donut',param:{label:'Count',min:0,max:400,def:160},apply:function(model,v){var grp=new THREE.Group();var box=bbox(model);var ray=new THREE.Raycaster();var meshes=[];model.traverse(function(o){if(o.userData&&o.userData.part)meshes.push(o);});var sg=new THREE.CylinderGeometry(.016,.016,.092,6);var up=new THREE.Vector3(0,1,0);var top=box.max.y+1;for(var k=0;k<v;k++){var x=box.min.x+Math.random()*(box.max.x-box.min.x),z=box.min.z+Math.random()*(box.max.z-box.min.z);ray.set(new THREE.Vector3(x,top,z),new THREE.Vector3(0,-1,0));var hit=ray.intersectObjects(meshes,false)[0];if(!hit)continue;if(hit.face){var n=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);if(n.y<.15)continue;var t=new THREE.Vector3(1,0,0).cross(n).normalize();if(t.lengthSq()<.01)t.set(0,0,1);var a=Math.random()*Math.PI*2;var dir=t.applyAxisAngle(n,a);var m=new THREE.Mesh(sg,candyMat());m.position.copy(model.worldToLocal(hit.point.clone())).addScaledVector(n,.012);m.quaternion.setFromUnitVectors(up,dir);var s=.85+Math.random()*.4;m.scale.set(s,s,s);m.castShadow=true;grp.add(m);}}return grp;}},

function do3dPaint(clientX,clientY){
  var m=getModel(state.activeId);if(!m||!m.userData.parts[paint.part])return;
  var mesh=m.userData.parts[paint.part].mesh;
  var r=dom.getBoundingClientRect();var mx=((clientX-r.left)/r.width)*2-1,my=-((clientY-r.top)/r.height)*2+1;
  var ray=new THREE.Raycaster();ray.setFromCamera({x:mx,y:my},active.vs.cam);
  var hits=ray.intersectObject(mesh,false);if(!hits.length){paint.last=null;return;}
  var hit=hits[0];if(!hit.uv){paint.last=null;return;}
  paintAt(hit.uv.x*1024,(1-hit.uv.y)*1024);}

  b.appendChild(el('div',{class:'grid2'},[
    el('div',{},[el('label',{class:'fld',text:'Primitive'}),el('div',{class:'spread'},[primSel,el('button',{text:'Load',onclick:function(){EM.fromPrim(primSel.value);frameObject(EM._meshObj,viewState.edit);renderPanel();toast('Loaded '+primSel.value);}})])]),
    el('div',{},[el('label',{class:'fld',text:'From model'}),el('div',{class:'spread'},[fromModelSel,el('button',{text:'Load',onclick:function(){var m=getModel(fromModelSel.value);if(m){EM.fromModel(m);frameObject(EM._meshObj,viewState.edit);renderPanel();}}})])])
  ]));

  if(!EM.V.length)return;

  b.appendChild(el('div',{class:'section-title',text:'Select mode'}));
  var modeRow=el('div',{class:'chiprow'});
  ['vert','edge','face'].forEach(function(m){
    modeRow.appendChild(el('button',{class:'chip'+(editState.mode===m?' on':''),text:m.charAt(0).toUpperCase()+m.slice(1),onclick:function(){editState.mode=m;EM.clearSel();EM._refresh();renderPanel();}}));});
  b.appendChild(modeRow);
  b.appendChild(el('div',{class:'spread',style:'margin-top:6px'},[
    el('button',{style:'flex:1',text:'All (A)',onclick:function(){EM.selAll();}}),
    el('button',{style:'flex:1',text:'None',onclick:function(){EM.clearSel();EM._refresh();renderPanel();}})
  ]));

  var selN=EM.selCount();
  if(selN>0)b.appendChild(el('div',{class:'card',style:'text-align:center;margin-top:8px;color:var(--pink)'},[el('span',{text:selN+' '+editState.mode+(selN>1?'s':'')+' selected'})]));

  b.appendChild(el('div',{class:'section-title',text:'Transform'}));
  b.appendChild(el('p',{class:'small muted',style:'margin-bottom:6px',text:'Select elements then drag them in the 3D view to move · RotBall to orbit · two-finger to zoom/pan'}));

  b.appendChild(el('div',{class:'section-title',text:'Operations'}));
  b.appendChild(el('div',{class:'grid2'},[
    el('button',{text:'Extrude  [E]',onclick:function(){EM.extrude();}}),
    el('button',{text:'Inset Face  [I]',onclick:function(){EM.inset();}})
  ]));
  b.appendChild(el('div',{class:'grid2',style:'margin-top:6px'},[
    el('button',{text:'Subdivide  [S]',onclick:function(){EM.subdivide();renderPanel();}}),
    el('button',{text:'Loop Cut',onclick:function(){EM.loopCut();renderPanel();}})
  ]));
  b.appendChild(el('div',{class:'grid2',style:'margin-top:6px'},[
    el('button',{text:'Delete  [X]',onclick:function(){EM.deleteSelected();}}),
    el('button',{text:'Flip Normals',onclick:function(){EM.flipNormals();}})
  ]));
  b.appendChild(el('div',{class:'grid2',style:'margin-top:6px'},[
    el('button',{text:'Merge Verts',onclick:function(){EM.mergeSelected();}}),
    el('button',{text:'Smooth',onclick:function(){EM.smoothVerts();renderPanel();}})
  ]));
  b.appendChild(el('div',{class:'grid2',style:'margin-top:6px'},[
    el('button',{text:'Weld Close',onclick:function(){EM.weldClose();renderPanel();}}),
    el('button',{text:'Select All  [A]',onclick:function(){EM.selAll();}})
  ]));

  b.appendChild(el('hr',{class:'sep'}));
  b.appendChild(el('div',{class:'section-title',text:'Keyboard shortcuts (desktop)'}));
  b.appendChild(el('p',{class:'small muted',text:'E=Extrude  I=Inset  S=Subdivide  X=Delete  A=Select All  drag selected → move  6=Open this tab'}));

  b.appendChild(el('hr',{class:'sep'}));
  b.appendChild(el('div',{class:'section-title',text:'Export to library'}));
  b.appendChild(el('button',{class:'pri',style:'width:100%',text:'Save mesh as model',onclick:function(){EM.exportToModel();}}));}

/* ---------------- nav build ---------------- */
function buildNav(){var rail=$('#rail'),tab=$('#tabbar');VIEWS.forEach(function(v){
  rail.appendChild(el('button',{class:'tab','data-v':v[0],html:icon(ICONS[v[0]])+'<span>'+v[1]+'</span>',onclick:function(){setView(v[0]);}}));
  tab.appendChild(el('button',{class:'tab','data-v':v[0],html:icon(ICONS[v[0]])+'<span>'+v[1]+'</span>',onclick:function(){setView(v[0]);openSheet(true);}}));});}
/* mobile sheet */
function openSheet(on){var p=$('#panel');if(on==null)on=!p.classList.contains('open');p.classList.toggle('open',on);}
$('#sheetHandle').addEventListener('click',function(){openSheet();});
$('#btnFrame').addEventListener('click',function(){
  if(active.view==='viewer'){var m=getModel(state.activeId);if(m)frameObject(m,active.vs);}
  else if(active.view==='edit'){if(EM._meshObj)frameObject(EM._meshObj,active.vs);}
  else{var h=(active.view==='build'?buildScene:sceneScene).userData.holder;frameObject(h,active.vs);}invalidate();});
$('#btnShot').addEventListener('click',function(){renderer.render(active.scene,active.vs.cam);downloadURL(renderer.domElement.toDataURL('image/png'),active.view+'_shot.png');toast('Saved screenshot');});
$('#btnUndo').addEventListener('click',function(){History.undo();});
$('#btnRedo').addEventListener('click',function(){History.redo();});
$('#btnSnap').addEventListener('click',function(e){Gizmo.snap=!Gizmo.snap;e.currentTarget.className=Gizmo.snap?'act on':'act';toast(Gizmo.snap?'Grid snap on':'Grid snap off');});
window.addEventListener('keydown',function(e){var tag=(e.target&&e.target.tagName)||'';if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  var z=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&z==='z'){e.preventDefault();History.undo();}
  else if((e.ctrlKey||e.metaKey)&&(z==='y'||(e.shiftKey&&z==='z'))){e.preventDefault();History.redo();}
  else if(z>='1'&&z<='6'){setView(VIEWS[+z-1][0]);}
  else if(z==='f'){$('#btnFrame').click();}
  else if(active.view==='edit'){
    if(z==='a'){e.preventDefault();EM.selAll();}
    else if(z==='e'){e.preventDefault();EM.extrude();}
    else if(z==='i'){EM.inset();}
    else if(z==='x'){EM.deleteSelected();}
    else if(z==='s'&&!e.ctrlKey&&!e.metaKey){EM.subdivide();renderPanel();}
  }});
$('#fabBuild').addEventListener('click',function(){addPrim('Cube');openSheet(true);});
$('#fabScene').addEventListener('click',function(){if(state.models.length){addPlacement(state.models[0].userData.id);openSheet(true);}else toast('No models yet');});

window.addEventListener('resize',resizeActive);

/* ---------------- init ---------------- */
buildNav();
Gizmo.build();
RotBall.init();
var donut=buildDonut();addModel(donut);setActiveModel(donut.userData.id);
setView('viewer');updUndo();
loop();
boot.style.display='none';
toast('Welcome — drag to orbit, tap to select, drag the gizmo to move');
})();
</script>
</body>
