<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>ROXY.JS — 3D Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Light "metallic" chrome (bars/panels/buttons) over a dark 3D viewport — the viewport
     itself (#stage, the Three.js scene backgrounds) is styled separately below and stays
     dark; these variables only govern the floating UI surfaces. */
  --bg:#f3f4f6;--ink:#14161a;--muted:#6b7280;--faint:#9aa1ab;--line:rgba(0,0,0,.10);
  --panel:rgba(255,255,255,.86);--card:rgba(0,0,0,.045);--pink:#ff8fb1;--pink2:#ff6f9c;--pinkInk:#c2386a;--ok:#2f8f5b;--err:#d94b4b;
  --rail:64px;--side:320px;--bar:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Space Grotesk",system-ui,sans-serif;font-size:14px}
button{font-family:inherit;color:var(--ink);cursor:pointer;border:1px solid var(--line);background:var(--card);
  border-radius:10px;padding:9px 11px;font-size:13px;transition:background .14s,border-color .14s,transform .04s}
button:hover{background:rgba(0,0,0,.055)}button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
button.pri{background:var(--pink);color:#2a141d;border-color:transparent;font-weight:600}
button.pri:hover{background:#ffa3c0}
button.on{background:rgba(255,143,177,.18);border-color:rgba(255,143,177,.45);color:var(--pinkInk)}
input[type=range]{width:100%;accent-color:var(--pink)}
input[type=text],input[type=number],select{font-family:inherit;font-size:13px;color:var(--ink);background:rgba(0,0,0,.055);
  border:1px solid var(--line);border-radius:9px;padding:8px 9px;width:100%}
input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
label.fld{display:block;font-size:11px;letter-spacing:.04em;color:var(--muted);margin:0 0 5px}
.tap-edit{cursor:pointer;border-bottom:1px dashed var(--faint);padding-bottom:1px}
.tap-edit:hover{color:var(--ink);border-bottom-color:var(--pink)}
.spread{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px}
.muted{color:var(--muted)}.small{font-size:11.5px}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}

#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--rail) 1fr var(--side);grid-template-rows:var(--bar) 1fr;
  grid-template-areas:"bar bar bar" "rail stage panel";}
#bar{grid-area:bar;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(rgba(255,255,255,.82),rgba(244,245,247,.68));
  backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);z-index:5}
#bar .logo{font:600 14px/1 "Space Grotesk",sans-serif;letter-spacing:.08em;text-transform:uppercase}
#bar .vtitle{font-size:12px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
#bar .sp{flex:1}
#bar .act{padding:7px 9px;font-size:12px}

#rail{grid-area:rail;display:flex;flex-direction:column;gap:4px;padding:8px 6px;border-right:1px solid var(--line);background:var(--panel)}
#rail .tab{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;border-radius:12px;
  padding:9px 4px;color:var(--muted);font-size:9.5px;letter-spacing:.04em}
#rail .tab .ic{width:22px;height:22px;display:block}
#rail .tab.on{color:var(--ink);background:var(--card)}
#rail .tab.on .ic{filter:drop-shadow(0 0 6px rgba(255,143,177,.5))}

#stage{grid-area:stage;position:relative;overflow:hidden;-webkit-touch-callout:none;background:
  radial-gradient(120% 120% at 50% 20%, #1c1f25 0%, #12141a 60%, #0b0c0f 100%)}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.gl-slot{position:absolute;inset:0}
canvas{display:block;touch-action:none}

/* paint view split */
.view[data-view=paint]{display:none}
.view[data-view=paint].on{display:grid;grid-template-columns:1fr 360px}
.view[data-view=paint].on.mode3d{grid-template-columns:1fr}
.view[data-view=paint].on.mode3d .paint2d{display:none}
.paint2d{position:relative;display:flex;align-items:center;justify-content:center;background:#0a0b0e;overflow:hidden}
.paint2d canvas{max-width:96%;max-height:96%;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.paint-prev{position:relative;border-left:1px solid var(--line)}

/* Wave G0: node-graph editor view — one full-bleed 2D canvas, no gl-slot (it never
   touches the THREE renderer; curSlot()/resizeActive() skip it by design). */
.view[data-view=nodes]{background:#12141a}
#nodesCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#panel{grid-area:panel;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
#panel h2{font:600 13px/1.1 "Space Grotesk";margin:0 0 2px}
#panel .sub{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.section-title{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:14px 0 8px}
.sec-toggle{display:flex;align-items:center;cursor:pointer;user-select:none;padding:3px 0}
.sec-toggle::after{content:'▾';margin-left:auto;font-size:10px;opacity:.55;transition:transform .16s}
.sec-toggle.closed::after{transform:rotate(-90deg)}

#tabbar{display:none}
#navMask{display:none}
#sheetHandle{display:none}

.assets-body{position:absolute;inset:0;overflow:auto;padding:18px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.thumb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.thumb-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);
  background:radial-gradient(120% 120% at 50% 20%,#22252b 0%,#15171b 100%)}
.thumb .nm{font-weight:600}.thumb .mt{font-size:11px;color:var(--muted)}
.modlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.modrow{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.modrow .top{display:flex;align-items:center;gap:8px}
.modrow .nm{flex:1;font-weight:500;font-size:12.5px}
.pill{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.dbitem{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px}
.dbitem .nm{flex:1}.dbitem .tg{font-size:10px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(255,255,255,.86);border:1px solid rgba(0,0,0,.10);
  backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:0 8px 24px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.7);
  color:var(--ink);padding:9px 14px;border-radius:999px;font-size:12.5px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.fab{position:absolute;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;background:var(--pink);color:#2a141d;
  border:none;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(0,0,0,.12);z-index:6}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.chip.on{background:rgba(255,143,177,.16);border-color:rgba(255,143,177,.4)}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:99;
  font-size:14px;color:var(--muted);text-align:center;padding:24px}

/* Base (desktop) sizing for the zoom knob — declared here, before the mobile
   media query, so the mobile-only overrides for these same properties actually
   win on mobile instead of losing to a same-specificity rule declared later. */
#zoomKnob{position:absolute;right:18px;top:100px;display:none;flex-direction:column;align-items:center;gap:3px;z-index:8;width:28px;
  padding:5px 0;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.10);
  backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:0 6px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.7)}
.zk-btn{width:26px;height:26px;border-radius:50%;background:transparent;border:none;color:rgba(20,22,26,.8);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;line-height:1;padding:0;font-family:inherit}
#zkSlider{writing-mode:vertical-lr;direction:rtl;width:26px;height:80px;cursor:ns-resize;accent-color:rgba(255,143,177,.8);touch-action:none}
/* Same reasoning: the mobile override only sets `bottom` (to clear the tabbar),
   so the rest of this rule must come first or that override loses the cascade. */
#paintHud{position:absolute;left:12px;bottom:14px;display:none;align-items:center;gap:9px;z-index:8;
  padding:8px 11px;border-radius:16px;background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.10);
  backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:0 6px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.7)}

/* ---------- mobile ---------- */
@media (max-width:820px){
  :root{--side:0px;--bar:52px}
  #app{grid-template-columns:1fr;grid-template-rows:var(--bar) 1fr;grid-template-areas:"bar" "stage"}
  #rail{display:none}
  /* finger-sized touch targets */
  button{min-height:42px;font-size:13.5px}
  #bar{gap:6px;padding:0 8px}
  #bar .vtitle{display:none} /* active tab in the dock already names the view */
  #bar .act{min-height:38px;padding:8px 10px}
  /* Below ~360px (iPhone SE 1st/2nd/3rd gen, some budget Android phones) the top bar's
     logo + Undo/Redo/Snap/Frame/Shot no longer fit; #bar has no wrap/scroll, so the last
     button silently clips off-screen with no way to reach it. Tighten spacing only at
     this width rather than shrinking touch targets everywhere. */
  .chip{min-height:36px}
  .hud-btn{min-height:36px}
  input[type=text],input[type=number],select{min-height:42px;font-size:14px}
  input[type=color]{width:44px;height:38px}
  .zk-btn{width:32px;height:32px;min-height:32px;font-size:19px}
  #zoomKnob{width:34px}
  /* Responsive slider length: caps at 96px on tall viewports, shrinks continuously
     on short (landscape) ones so the knob (anchored below RotBall) never extends
     down far enough to be covered by the tabbar, with a 32px usability floor. */
  #zkSlider{width:32px;height:min(96px,max(24px,calc(100vh - 320px)))}
  .view[data-view=paint].on{grid-template-columns:1fr;grid-template-rows:1fr}
  .paint-prev{display:none}
  .view[data-view=paint].on.mode3d .paint-prev{display:block}
  #panel{position:fixed;left:8px;right:8px;bottom:calc(78px + env(safe-area-inset-bottom));top:auto;height:60vh;
    border:1px solid rgba(0,0,0,.10);border-radius:24px;
    background:linear-gradient(rgba(255,255,255,.82),rgba(247,248,249,.9));
    backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);
    transform:translateY(calc(100% - 48px));transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:20;
    box-shadow:0 18px 48px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.8)}
  #panel.open{transform:translateY(0)}
  #sheetHandle{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;margin:-6px -14px 6px;cursor:grab;touch-action:none}
  #sheetHandle .bar{width:48px;height:5px;border-radius:99px;background:var(--faint)}
  #sheetHandle .lbl{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  /* Covers the thin slivers around the tabbar (above/below it, within the panel's
     reserved bottom offset) so the collapsed sheet's peek can never show real
     content through them — the gap there is fixed-size regardless of viewport
     height, but a short (landscape) viewport shrinks the panel enough that real
     text lands in exactly that gap instead of blank space. */
  #navMask{display:block;position:fixed;left:0;right:0;bottom:0;height:calc(78px + env(safe-area-inset-bottom));
    background:var(--bg);z-index:25;pointer-events:none}
  #tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));height:62px;
    border:1px solid rgba(0,0,0,.10);border-radius:26px;padding:0 4px;
    background:linear-gradient(rgba(255,255,255,.85),rgba(248,249,250,.92));
    backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);
    box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.8);z-index:30}
  #tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;
    border:none;color:var(--muted);font-size:9.5px;letter-spacing:.03em;margin:6px 2px;border-radius:20px;
    transition:background .18s,color .18s}
  #tabbar .tab .ic{width:21px;height:21px}
  #tabbar .tab.on{color:var(--pinkInk);background:rgba(255,143,177,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .fab{bottom:calc(86px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom))}
  #paintHud{bottom:calc(134px + env(safe-area-inset-bottom))}
}
@media (max-width:359px){
  #bar{gap:3px;padding:0 6px}
  #bar .logo{font-size:12px}
  #bar .act{padding:8px 6px}
}
@media (max-width:820px){ .desktop-only{display:none} }
@media (min-width:821px){ .mobile-only{display:none} }
/* Respect the OS "reduce motion" setting: the bottom sheet's translateY slide and every
   other transition snap to near-instant for vestibular-sensitive users. Default (motion
   allowed) is untouched — this whole block is inert unless the user has opted in. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* ---------- edit HUD ---------- */
#editHud{position:absolute;left:0;right:0;bottom:16px;display:none;flex-direction:column;align-items:center;gap:8px;z-index:7;pointer-events:none}
#editHud.on{display:flex}
.hud-row{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
.hud-btn{font-family:inherit;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.10);color:var(--ink);
  border-radius:12px;padding:10px 14px;font-size:13px;cursor:pointer;
  backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:0 4px 14px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.7);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .12s,border-color .12s,transform .06s}
.hud-btn.on{background:rgba(255,143,177,.28);border-color:rgba(255,143,177,.55);color:var(--pinkInk)}
.hud-btn:active{transform:scale(.93)}
.hud-sel{font-size:11.5px;color:var(--pinkInk);background:rgba(255,255,255,.82);padding:4px 12px;
  border-radius:999px;border:1px solid rgba(255,143,177,.35);pointer-events:none;backdrop-filter:blur(8px)}
#selBox{position:fixed;display:none;border:1.5px dashed rgba(255,143,177,.9);background:rgba(255,143,177,.14);
  border-radius:3px;z-index:12;pointer-events:none}
.hud-srow{align-items:center}
.hud-range{width:150px;pointer-events:auto;touch-action:none}
.hud-slbl{font-size:11px;color:var(--pinkInk);background:rgba(255,255,255,.85);padding:6px 9px;border-radius:8px;pointer-events:none}
.hud-sval{font-size:11px;color:rgba(255,212,226,.85);min-width:30px;text-align:center;pointer-events:none}
.hud-compact{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start;max-width:100%;scrollbar-width:none}
.hud-compact::-webkit-scrollbar{display:none}
/* Only applied (via JS, once actual overflow is measured) to rows with more buttons than fit —
   fades the trailing edge so it reads as "swipe for more" instead of looking like clipped layout.
   The "..." HUD-expand toggle lives at the end of this row and was otherwise invisible off-screen. */
.hud-compact.has-overflow{mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent 100%);
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent 100%)}
/* right:98px clears RotBall (right:12px, 80px wide) with a real gap — it was 90px,
   2px short of RotBall's own left edge, so the HUD row's fade-scroll edge touched the
   orbit gizmo's circle instead of stopping cleanly before it. */
@media(max-width:820px){#editHud{top:8px;bottom:auto;gap:5px;left:0;right:98px;align-items:flex-start;padding-left:8px}.hud-btn{font-size:11px;padding:6px 10px}.hud-range{width:110px}}
#rotBall{position:absolute;right:12px;top:12px;width:80px;height:80px;cursor:grab;display:none;z-index:8;touch-action:none;border-radius:50%}
#zoomKnob.on{display:flex}
#paintHud.on{display:flex}
#phColor{width:34px;height:32px;border:1px solid var(--line);border-radius:9px;background:none;padding:2px}
#phSize{width:120px;touch-action:none}
#phErase,#phEyedrop{font-size:12px;padding:8px 11px;min-height:0!important}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:88%;z-index:9;
  padding:9px 14px;border-radius:999px;font-size:12px;color:var(--pinkInk);text-align:center;cursor:pointer;
  background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.10);
  backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:0 6px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.7);
  opacity:0;pointer-events:none;transition:opacity .35s}
#hint.show{opacity:1;pointer-events:auto}
@media (max-width:820px){#hint{bottom:calc(134px + env(safe-area-inset-bottom))}}
#quickUndo{display:none}
@media (max-width:820px){
  #quickUndo{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:8}
  #quickUndo.off{display:none}
  #quickUndo button{width:44px;height:44px;min-height:0;border-radius:50%;font-size:19px;line-height:1;padding:0;
    background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.10);color:rgba(20,22,26,.8);
    backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
    box-shadow:0 6px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.7)}
}
</style>
</head>
<body>
<div id="boot">loading studio…</div>

<div id="app" aria-hidden="false">
  <header id="bar">
    <span class="logo">ROXY.JS</span>
    <span class="vtitle" id="vtitle">Viewer</span>
    <span class="small muted desktop-only" id="stat" style="margin-left:6px"></span>
    <span class="sp"></span>
    <button class="act" id="btnUndo" title="Undo (Ctrl+Z)" style="font-size:15px;line-height:1">↶</button>
    <button class="act" id="btnRedo" title="Redo (Ctrl+Y)" style="font-size:15px;line-height:1">↷</button>
    <button class="act" id="btnSnap" title="Grid snap">Snap</button>
    <button class="act" id="btnFrame" title="Frame">Frame</button>
    <button class="act" id="btnShot" title="Screenshot">Shot</button>
  </header>

  <nav id="rail"></nav>

  <main id="stage">
    <section class="view on" data-view="viewer"><div class="gl-slot" id="slot-viewer"></div></section>
    <section class="view" data-view="paint">
      <div class="paint2d"><canvas id="paintCanvas" width="1024" height="1024"></canvas></div>
      <div class="paint-prev gl-slot" id="slot-paint"></div>
    </section>
    <section class="view" data-view="build"><div class="gl-slot" id="slot-build"></div><button class="fab" id="fabBuild" title="Add a cube" aria-label="Add a cube">+</button></section>
    <section class="view" data-view="scene"><div class="gl-slot" id="slot-scene"></div><button class="fab" id="fabScene" title="Add a model to the scene" aria-label="Add a model to the scene">+</button></section>
    <section class="view" data-view="assets"><div class="assets-body" id="assetsBody"></div></section>
    <section class="view" data-view="edit"><div class="gl-slot" id="slot-edit"></div><div id="editHud"></div></section>
    <section class="view" data-view="nodes"><canvas id="nodesCanvas"></canvas></section>
    <canvas id="rotBall" width="80" height="80" role="img" aria-label="Orbit gizmo — drag to rotate the view"></canvas>

  deleteSelected:function(){

  mergeSelected:function(){
    var selI=[];for(var i=0;i<this.V.length;i++)if(this.V[i].sel)selI.push(i);

    var _b=this._topoSnapshot();
    var c=new THREE.Vector3();selI.forEach(function(i){c.add(this.V[i]);},this);c.divideScalar(selI.length);

  weldClose:function(){var _b=this._topoSnapshot();this._weld(0.05);this._buildEdges();this._refresh();this._pushTopo(_b);toast('Welded nearby verts');},

  // Heuristic auto-orient: flip any face whose normal points toward the mesh's

  smoothVerts:function(){

  // ─── Wave A1: Slide / Shrink-Fatten / Rip / Randomize / Shear ────────

  // Vertex/Edge Slide: whether the current mode+selection is a legal slide target
  // (exactly one vertex in Vert mode, or any edges in Edge mode — mirrors the HUD's

  _slideApplicable:function(){
    var mode=editState.mode;

    if(mode==='edge')return this.E.some(function(e){return e.sel;});

  // Randomize: jitters each selected vertex along its own normal by a pseudo-random signed

  // Selection-scoped edit-mode Shear (vs. MODDB.shear, which shears the WHOLE mesh): moves each

  // ─── Wave A2: Knife tool (core, no pointer-event dependency — see Knife for the tap UX) ──

  _edgeIndexFor:function(a,b){for(var i=0;i<this.E.length;i++){var e=this.E[i];if((e.a===a&&e.b===b)||(e.a===b&&e.b===a))return i;}return -1;},

    if(hint2!=null){var f2=this.F[hint2];if(f2&&f2.vi.indexOf(va)>=0&&f2.vi.indexOf(vb)>=0)return hint2;}

  // ─── Wave A2: Spin (lathe revolve) / Screw (helical sweep) ──────────────────────────

  // selected edges endpoint to endpoint), else the natural index order of selected verts
  // (Vert mode), else the unique verts touched by selected faces (Face mode fallback).

/* Rebuild any mesh's UVs into a per-face atlas so every triangle gets its
   own unique UV tile — prevents painting on one face from bleeding to
   geometrically unrelated faces (e.g. the back of a sphere). */
function ensureAtlasUVs(m,pi,keepCanvas){
  var part=m&&m.userData.parts[pi];if(!part||part._atlasUVs)return;
  var geo=part.mesh.geometry;
  // Non-destructive fast path: a mesh that already carries a real UV unwrap (imported GLB,
  // or a textured mesh exported from the editor) does NOT need the per-face atlas repack.
  // do3dPaint only needs the geometry un-indexed (it addresses faces as fi*3); un-indexing
  // alone keeps the ORIGINAL uvs, so painting happens in the model's own texture space and
  // toggling "Paint on 3D surface" never rebakes/scrambles the existing texture.
  if(part._hasProperUVs&&geo.attributes.uv){
    var ni=geo.index?geo.toNonIndexed():geo.clone();
    part.mesh.geometry.dispose();part.mesh.geometry=ni;part._atlasUVs=true;
    invalidate();return;
  }
  var posAttr=geo.attributes.position,norAttr=geo.attributes.normal,idxAttr=geo.index;
  var origUVAttr=geo.attributes.uv; // save original UVs before rebuild
  var triCount=idxAttr?idxAttr.count/3:posAttr.count/3;
  var faceData=[],pos=[],nor=[],uv=[];
  for(var fi=0;fi<triCount;fi++){
    var i0,i1,i2;
    if(idxAttr){i0=idxAttr.getX(fi*3);i1=idxAttr.getX(fi*3+1);i2=idxAttr.getX(fi*3+2);}
    else{i0=fi*3;i1=fi*3+1;i2=fi*3+2;}
    var v0=new THREE.Vector3().fromBufferAttribute(posAttr,i0);
    var v1=new THREE.Vector3().fromBufferAttribute(posAttr,i1);
    var v2=new THREE.Vector3().fromBufferAttribute(posAttr,i2);
    var n=new THREE.Vector3().crossVectors(new THREE.Vector3().subVectors(v1,v0),new THREE.Vector3().subVectors(v2,v0)).normalize();
    if(n.lengthSq()<.01)n.set(0,1,0);
    var vns=[i0,i1,i2].map(function(vi){return norAttr?new THREE.Vector3().fromBufferAttribute(norAttr,vi):n.clone();});
    var ax=Math.abs(n.x),ay=Math.abs(n.y),az=Math.abs(n.z),up=new THREE.Vector3();
    if(ax<=ay&&ax<=az)up.set(1,0,0);else if(ay<=az)up.set(0,1,0);else up.set(0,0,1);
    var tan=new THREE.Vector3().crossVectors(n,up).normalize();
    var bit=new THREE.Vector3().crossVectors(n,tan);
    var verts=[v0,v1,v2],pts=verts.map(function(v){return{u:v.dot(tan),v:v.dot(bit)};});
    var mnU=pts[0].u,mxU=pts[0].u,mnV=pts[0].v,mxV=pts[0].v;
    for(var k=1;k<3;k++){if(pts[k].u<mnU)mnU=pts[k].u;if(pts[k].u>mxU)mxU=pts[k].u;if(pts[k].v<mnV)mnV=pts[k].v;if(pts[k].v>mxV)mxV=pts[k].v;}
    var szU=mxU-mnU,szV=mxV-mnV;if(szU<1e-5)szU=1e-5;if(szV<1e-5)szV=1e-5;

  }

  // deformed snapshot that a later rebuild would deform a second time.

  // keepCanvas: geometry was rebuilt under an already-atlased canvas (e.g. a modifier
  // re-deform) — face order is preserved so the existing atlas tiles still line up; only
  // the per-face UVs are re-derived above, the painted pixels must be left alone.
  if(!keepCanvas){
  // Bake existing canvas content into new atlas tiles instead of wiping to white
  if(origUVAttr&&paint.tex){
    // Copy current canvas to temp so we can read from it while writing to paint.cv
    var tmpCv=document.createElement('canvas');tmpCv.width=tmpCv.height=1024;
    tmpCv.getContext('2d').drawImage(paint.cv,0,0);
    paint.ctx.fillStyle='#ffffff';paint.ctx.fillRect(0,0,1024,1024);
    // GLB textures were placed on canvas with drawImage (v=0 at top, i.e. y=v*1024).
    // User paint strokes follow the flipY=true convention (v=0 at bottom, y=(1-v)*1024).
    var glbSrc=!!part._hasProperUVs;
    for(var bi=0;bi<nf;bi++){
      var bfd=faceData[bi],boi=bfd.oi,buvs=bfd.uvs;
      var atx=(bi%cols)*tw,aty=Math.floor(bi/cols)*th;
      // Source canvas positions (original UV → canvas, convention depends on source type)
      var S0x=origUVAttr.getX(boi[0])*1024;
      var S0y=glbSrc?origUVAttr.getY(boi[0])*1024:(1-origUVAttr.getY(boi[0]))*1024;
      var S1x=origUVAttr.getX(boi[1])*1024;
      var S1y=glbSrc?origUVAttr.getY(boi[1])*1024:(1-origUVAttr.getY(boi[1]))*1024;
      var S2x=origUVAttr.getX(boi[2])*1024;
      var S2y=glbSrc?origUVAttr.getY(boi[2])*1024:(1-origUVAttr.getY(boi[2]))*1024;
      // Destination canvas positions (new atlas UV → canvas, do3dPaint convention)
      var D0x=(atx+pad*tw+buvs[0][0]*tw*(1-2*pad))*1024,D0y=(1-(aty+pad*th+buvs[0][1]*th*(1-2*pad)))*1024;
      var D1x=(atx+pad*tw+buvs[1][0]*tw*(1-2*pad))*1024,D1y=(1-(aty+pad*th+buvs[1][1]*th*(1-2*pad)))*1024;
      var D2x=(atx+pad*tw+buvs[2][0]*tw*(1-2*pad))*1024,D2y=(1-(aty+pad*th+buvs[2][1]*th*(1-2*pad)))*1024;
      // Affine transform M such that D = M*S + offset (source image → dest canvas)
      var ss1x=S1x-S0x,ss1y=S1y-S0y,ss2x=S2x-S0x,ss2y=S2y-S0y;
      var ds1x=D1x-D0x,ds1y=D1y-D0y,ds2x=D2x-D0x,ds2y=D2y-D0y;
      var det=ss1x*ss2y-ss2x*ss1y;if(Math.abs(det)<1e-6)continue;
      var inv00=ss2y/det,inv01=-ss2x/det,inv10=-ss1y/det,inv11=ss1x/det;
      var M00=ds1x*inv00+ds2x*inv10,M01=ds1x*inv01+ds2x*inv11;
      var M10=ds1y*inv00+ds2y*inv10,M11=ds1y*inv01+ds2y*inv11;
      var bex=D0x-(M00*S0x+M01*S0y),bey=D0y-(M10*S0x+M11*S0y);
      paint.ctx.save();
      paint.ctx.beginPath();paint.ctx.moveTo(D0x,D0y);paint.ctx.lineTo(D1x,D1y);paint.ctx.lineTo(D2x,D2y);
      paint.ctx.closePath();paint.ctx.clip();
      paint.ctx.setTransform(M00,M10,M01,M11,bex,bey);
      paint.ctx.drawImage(tmpCv,0,0,1024,1024);
      paint.ctx.restore();}
  }else{
    paint.ctx.fillStyle='#ffffff';paint.ctx.fillRect(0,0,1024,1024);}
  if(paint.tex)paint.tex.needsUpdate=true;}
  invalidate();}

// Project a world-space point to dom-local screen pixels
function projLocal(w,cam,r){var p=w.clone().project(cam);return{x:(p.x*.5+.5)*r.width,y:(1-(p.y*.5+.5))*r.height};}

// Blender-style projection painting: discover every face under the brush and
// paint the brush's screen-space footprint into each face's atlas tile via a
// per-face affine transform. Adjacent faces meet exactly at shared 3D edges,
// so strokes stay continuous across faces and across high-poly meshes.
function do3dPaint(clientX,clientY){
  var m=getModel(state.activeId);if(!m||!m.userData.parts[paint.part])return;
  ensureAtlasUVs(m,paint.part); // ensure per-face atlas UVs on any mesh type
  var mesh=m.userData.parts[paint.part].mesh,geo=mesh.geometry;
  var posAttr=geo.attributes.position,uvAttr=geo.attributes.uv;if(!uvAttr)return;
  var cam=active.vs.cam;cam.updateMatrixWorld();cam.matrixWorldInverse.copy(cam.matrixWorld).invert();
  mesh.updateMatrixWorld();
  var r=dom.getBoundingClientRect();
  var Cx=clientX-r.left,Cy=clientY-r.top,R=Math.max(2,paint.size*.5);
  var ray=new THREE.Raycaster(),faces={},hitAny=false;
  function cast(sx,sy){
    ray.setFromCamera({x:(sx/r.width)*2-1,y:-(sy/r.height)*2+1},cam);
    var hits=ray.intersectObject(mesh,false);
    if(hits.length&&hits[0].faceIndex!=null){faces[hits[0].faceIndex]=true;hitAny=true;}}
  // Faces under the brush at the current position (rings handle occlusion via nearest-hit)
  cast(Cx,Cy);
  [[.55*R,6],[1.0*R,12]].forEach(function(rg){for(var i=0;i<rg[1];i++){var a=i/rg[1]*Math.PI*2;cast(Cx+Math.cos(a)*rg[0],Cy+Math.sin(a)*rg[0]);}});
  // Faces swept since the last sample (center-cast along the path)
  var pf=paint._last3d;
  if(pf){var sdx=Cx-pf.x,sdy=Cy-pf.y,sl=Math.hypot(sdx,sdy),steps=Math.max(1,Math.ceil(sl/(R*.5)));
    for(var s=1;s<steps;s++)cast(pf.x+sdx*s/steps,pf.y+sdy*s/steps);}
  if(!hitAny){paint._last3d=null;return;}
  var c=paint.ctx,mw=mesh.matrixWorld;
  Object.keys(faces).forEach(function(fk){
    var fi=+fk,base=fi*3;
    var w0=new THREE.Vector3().fromBufferAttribute(posAttr,base).applyMatrix4(mw);
    var w1=new THREE.Vector3().fromBufferAttribute(posAttr,base+1).applyMatrix4(mw);
    var w2=new THREE.Vector3().fromBufferAttribute(posAttr,base+2).applyMatrix4(mw);
    var s0=projLocal(w0,cam,r),s1=projLocal(w1,cam,r),s2=projLocal(w2,cam,r);
    var t0x=uvAttr.getX(base)*1024,t0y=(1-uvAttr.getY(base))*1024;
    var t1x=uvAttr.getX(base+1)*1024,t1y=(1-uvAttr.getY(base+1))*1024;
    var t2x=uvAttr.getX(base+2)*1024,t2y=(1-uvAttr.getY(base+2))*1024;
    // Affine map screen->texture for this triangle
    var M00=s1.x-s0.x,M01=s2.x-s0.x,M10=s1.y-s0.y,M11=s2.y-s0.y;
    var det=M00*M11-M01*M10;if(Math.abs(det)<1e-6)return;
    var iM00=M11/det,iM01=-M01/det,iM10=-M10/det,iM11=M00/det;
    var e1x=t1x-t0x,e1y=t1y-t0y,e2x=t2x-t0x,e2y=t2y-t0y;
    var J00=e1x*iM00+e2x*iM10,J01=e1x*iM01+e2x*iM11;
    var J10=e1y*iM00+e2y*iM10,J11=e1y*iM01+e2y*iM11;
    var ex=t0x-(J00*s0.x+J01*s0.y),ey=t0y-(J10*s0.x+J11*s0.y);
    var bx0=Math.min(t0x,t1x,t2x)-1,bx1=Math.max(t0x,t1x,t2x)+1;
    var by0=Math.min(t0y,t1y,t2y)-1,by1=Math.max(t0y,t1y,t2y)+1;
    c.save();
    c.beginPath();c.rect(bx0,by0,bx1-bx0,by1-by0);c.clip();
    c.setTransform(J00,J10,J01,J11,ex,ey);
    c.globalCompositeOperation=paint.erase?'destination-out':'source-over';
    c.strokeStyle=paint.color;c.fillStyle=paint.color;c.lineCap='round';c.lineJoin='round';
    if(paint.soft>0){c.shadowBlur=paint.soft*R*.9;c.shadowColor=paint.erase?'rgba(0,0,0,1)':paint.color;}else c.shadowBlur=0;
    if(pf){c.lineWidth=R*2;c.beginPath();c.moveTo(pf.x,pf.y);c.lineTo(Cx,Cy);c.stroke();}
    else{c.beginPath();c.arc(Cx,Cy,R,0,7);c.fill();}
    c.restore();
  });
  paint._last3d={x:Cx,y:Cy};paint.tex.needsUpdate=true;invalidate();}

/* ================================================================================
   Wave G0 — shared node-graph editor framework (data model + eval core)
   ================================================================================
   REGISTRY CONTRACT — every later node wave (G1 shader, G3a/b/c geometry, G4
   compositor) MUST author its registry object in exactly this shape. The editor
   widget (below, canvas/touch layer) and NodeGraph (this section, pure data/eval
   layer) never special-case a system — they only read this shape.

     REGISTRY = {
       <typeName>: {
         title: 'Human label shown on the card + inspector',
         color: '#hex',                     // optional title-bar accent; falls back to a neutral grey
         inputs:  [ {name, kind, default, label?}, ... ],   // input sockets, left edge, top→bottom
         outputs: [ {name, kind, label?}, ... ],             // output sockets, right edge, top→bottom
         params:  [ {name, type:'float'|'enum'|'color', default, min?, max?, options?}, ... ],
         eval: function(inputs, params){ return { <outputName>: value, ... }; }
       }, ...
     }

   - `kind` is an opaque string the widget/graph layer NEVER interprets beyond
     equality (inputKind===outputKind ⇒ connectable). Each system invents its own
     kind vocabulary ('float','color','vec','geometry','shader', …) — that is the
     entire mechanism that keeps this widget system-agnostic.
   - `inputs[i].default` is the value substituted when that input has no incoming
     link — sockets, not just params, carry defaults (per GAP_ANALYSIS §6.1).
   - `eval(inputs, params)` receives fully-resolved plain values: `inputs` is keyed
     by input name with every entry already resolved (upstream node's matching
     output value, or the socket default if unconnected); `params` is keyed by
     param name with `node.params[name]` overriding `param.default` when present.
     It MUST return a plain object keyed by output name and MUST NOT mutate
     `inputs`/`params` — evalGraph memoizes per node per pass and re-evaluating
     must be side-effect-free.

   GRAPH MODEL — Graph = {nodes:[{id,type,params:{},x,y}], links:[{from:[nodeId,
   socketName], to:[nodeId,socketName]}]}. `from` always names an OUTPUT socket,
   `to` always names an INPUT socket (data flows from→to). An input socket holds
   at most one incoming link — connecting a second link to the same input replaces
   the first, matching every visual node editor's behavior. `node.params` is
   sparse: only overrides are stored, everything else falls back to the
   registry's `param.default`.
   ================================================================================ */
var NodeGraph={
  make:function(){return {nodes:[],links:[],_seq:0};},
  findNode:function(graph,id){for(var i=0;i<graph.nodes.length;i++)if(graph.nodes[i].id===id)return graph.nodes[i];return null;},
  addNode:function(graph,type,x,y,params){
    graph._seq=(graph._seq||0)+1;
    var node={id:'n'+graph._seq,type:type,params:params||{},x:x||0,y:y||0};
    graph.nodes.push(node);return node;},
  removeNode:function(graph,id){
    graph.nodes=graph.nodes.filter(function(n){return n.id!==id;});
    graph.links=graph.links.filter(function(l){return l.from[0]!==id&&l.to[0]!==id;});},
  moveNode:function(graph,id,x,y){var n=this.findNode(graph,id);if(!n)return false;n.x=x;n.y=y;return true;},
  socketDef:function(registry,type,socketName,dir){
    var def=registry[type];if(!def)return null;
    var list=dir==='in'?(def.inputs||[]):(def.outputs||[]);
    for(var i=0;i<list.length;i++)if(list[i].name===socketName)return list[i];
    return null;},
  // Would adding an edge fromNodeId→toNodeId create a cycle? True iff toNodeId can
  // already reach fromNodeId by following existing links forward (from→to).
  wouldCycle:function(graph,fromNodeId,toNodeId){
    if(fromNodeId===toNodeId)return true;
    var seen={},stack=[toNodeId];
    while(stack.length){
      var cur=stack.pop();
      if(cur===fromNodeId)return true;
      if(seen[cur])continue;seen[cur]=true;
      for(var i=0;i<graph.links.length;i++)if(graph.links[i].from[0]===cur)stack.push(graph.links[i].to[0]);}
    return false;},
  // fromRef=[nodeId,socketName] naming an OUTPUT, toRef=[nodeId,socketName] naming an INPUT.
  canConnect:function(graph,registry,fromRef,toRef){
    var fn=this.findNode(graph,fromRef[0]),tn=this.findNode(graph,toRef[0]);
    if(!fn||!tn||fn.id===tn.id)return false;
    var fout=this.socketDef(registry,fn.type,fromRef[1],'out'),tin=this.socketDef(registry,tn.type,toRef[1],'in');
    if(!fout||!tin)return false;
    if(fout.kind!==tin.kind)return false;               // kind-equality is the ONLY compatibility rule
    if(this.wouldCycle(graph,fn.id,tn.id))return false;  // refuse at connection time
    return true;},
  connect:function(graph,registry,fromRef,toRef){
    if(!this.canConnect(graph,registry,fromRef,toRef))return false;
    graph.links=graph.links.filter(function(l){return !(l.to[0]===toRef[0]&&l.to[1]===toRef[1]);}); // one link per input
    graph.links.push({from:[fromRef[0],fromRef[1]],to:[toRef[0],toRef[1]]});
    return true;},
  disconnect:function(graph,toRef){
    var before=graph.links.length;
    graph.links=graph.links.filter(function(l){return !(l.to[0]===toRef[0]&&l.to[1]===toRef[1]);});
    return before-graph.links.length;},
  // Pull-based DAG walk from nodeId (the caller's designated "output" for this pass —
  // any node in the graph may be evaluated this way, not only nodes of a literal
  // "Output" type). Memoized per node per call; defensively cycle-guarded via a
  // `visiting` set so a cycle that slips into graph.links some other way (bulk
  // load, direct mutation) throws instead of recursing forever — caught below and
  // reported as `false` rather than propagating.

    var memo={},visiting={},self=this;
    function evalNode(id){
      if(Object.prototype.hasOwnProperty.call(memo,id))return memo[id];
      if(visiting[id])throw new Error('cycle detected at node '+id);
      visiting[id]=true;
      var node=self.findNode(graph,id);
      if(!node)throw new Error('missing node '+id);
      var def=registry[node.type];
      if(!def)throw new Error('unknown node type '+node.type);
      var inputs={};
      (def.inputs||[]).forEach(function(inp){
        var link=null;
        for(var i=0;i<graph.links.length;i++){var l=graph.links[i];if(l.to[0]===id&&l.to[1]===inp.name){link=l;break;}}
        if(link){
          var upstream=evalNode(link.from[0]);
          var v=upstream?upstream[link.from[1]]:undefined;
          inputs[inp.name]=(v===undefined)?inp.default:v;
        }else inputs[inp.name]=inp.default;});
      var params={};
      (def.params||[]).forEach(function(p){
        var v=node.params?node.params[p.name]:undefined;
        params[p.name]=(v===undefined)?p.default:v;});
      var outputs=def.eval(inputs,params)||{};
      delete visiting[id];
      memo[id]=outputs;
      return outputs;}
    try{return evalNode(nodeId);}catch(e){return false;}}
};

/* ================================================================================
   Wave G1 — shader nodes: baked-map path. Real nodes evaluated per-pixel over a
   UV grid into canvas textures, then assigned onto the active model part's
   MeshPhysicalMaterial (map/roughnessMap/metalnessMap/emissiveMap/normalMap/
   displacementMap). Authored strictly against the G0 REGISTRY CONTRACT above —
   NodeUI/NodeGraph need zero changes to host this registry.

   BAKE-TIME INPUT MECHANISM: `TexCoord`/`Geometry` are per-texel "uniforms" —
   like a shader, they can't be pure functions of (inputs,params) alone (there's
   no per-texel channel in that signature), so they read the shared `NodeBake`
   context object that the baker (and tests) set immediately before each
   NodeGraph.evalGraph() call. Every other node is a pure function of its
   resolved inputs/params, per contract.

   APPROXIMATION NOTE (GAP_ANALYSIS §6.2): Fresnel/LayerWeight are view-dependent
   and cannot bake into a static map — both are marked `approx:true` on their
   registry entry and evaluate to an editable constant (params.approxValue*)
   rather than a real per-angle Fresnel term. True fidelity is G2's GLSL path.

/* ---- Wave G1 bake pipeline ----
   bakeShaderMaterial(graph,registry,outputNodeId,res,model,partIndex) walks the
   UV grid at `res`×`res` texels. For each texel it sets NodeBake.u/v (and, only
   if the graph actually contains a `Geometry` node, a real per-texel object-space
   position/normal sample rasterized from the mesh's UV-mapped triangles — see
   buildUVGeomSampler) then calls NodeGraph.evalGraph ONCE on the Material Output
   node. Because PrincipledOutput.eval passes every resolved input through
   verbatim, that single call yields baseColor/roughness/metalness/emission/
   normal/displacement together — one DAG walk per texel bakes every connected
   channel, not one walk per channel. Only channels with an actual incoming link
   to the Output node are baked (an unconnected channel stays whatever the
   material already had). Channel -> material map:
     baseColor->map(srgb) roughness->roughnessMap metalness->metalnessMap
     emission->emissiveMap normal->normalMap(pre-encoded 0..1, flat={.5,.5,1})
     displacement->displacementMap (three.js's native MeshStandardMaterial
     vertex-displacement path -- the "existing texture-displace path" for this
     wave; the A6 procedural-displace modifier is a separate, still-TODO thing).
   Floats bake to a grayscale RGB canvas (so it's correct regardless of which
   channel three.js's shader happens to sample: g for roughness, b for
   metalness). Baked maps are plain THREE.CanvasTexture via the existing tex()
   helper, so they flow through GLB/OBJ export completely unchanged. */
function graphUsesNodeType(graph,type){return graph.nodes.some(function(n){return n.type===type;});}

    return function(){return {px:0,py:0,pz:0,nx:0,ny:0,nz:1};};

    tris.push(tri);
    var minU=Math.min(tri.u0,tri.u1,tri.u2),maxU=Math.max(tri.u0,tri.u1,tri.u2);
    var minV=Math.min(tri.v0,tri.v1,tri.v2),maxV=Math.max(tri.v0,tri.v1,tri.v2);
    var cx0=Math.max(0,Math.floor(minU*GRID)),cx1=Math.min(GRID-1,Math.floor(maxU*GRID));
    var cy0=Math.max(0,Math.floor(minV*GRID)),cy1=Math.min(GRID-1,Math.floor(maxV*GRID));
    for(var cx=cx0;cx<=cx1;cx++)for(var cy=cy0;cy<=cy1;cy++){var k=bkey(cx,cy);(buckets[k]=buckets[k]||[]).push(tri);}}

          py:pos.getY(tri.i0)*bc.b0+pos.getY(tri.i1)*bc.b1+pos.getY(tri.i2)*bc.b2,
          pz:pos.getZ(tri.i0)*bc.b0+pos.getZ(tri.i1)*bc.b1+pos.getZ(tri.i2)*bc.b2,
          nx:nrm.getX(tri.i0)*bc.b0+nrm.getX(tri.i1)*bc.b1+nrm.getX(tri.i2)*bc.b2,
          ny:nrm.getY(tri.i0)*bc.b0+nrm.getY(tri.i1)*bc.b1+nrm.getY(tri.i2)*bc.b2,
          nz:nrm.getZ(tri.i0)*bc.b0+nrm.getZ(tri.i1)*bc.b1+nrm.getZ(tri.i2)*bc.b2};}}
    return {px:0,py:0,pz:0,nx:0,ny:0,nz:1};};}

    return graph.links.some(function(l){return l.to[0]===outputNodeId&&l.to[1]===ch.input;});});

/* ================================================================================
   Wave G3a — geometry nodes: interpreter + inputs/primitives/mesh-op nodes.
   Authored strictly against the G0 REGISTRY CONTRACT above — NodeUI/NodeGraph need
   zero changes to host NODE_GEO, same as NODE_SHADER (G1).

   GEOMETRY SOCKET VALUE — the canonical "geometry" kind is a plain struct, NOT a
   THREE.BufferGeometry, so nodes can clone/mutate it cheaply with no GPU-side
   objects in the loop:
     { V:[THREE.Vector3,...], F:[[i0,i1,i2],...], UV:[[u,v],...]|null }
   F is ALWAYS triangle-only (every builder/op below both consumes and produces
   strictly-3-index faces) so the existing triangle-only cores this wave reuses
   unchanged — subdivStep, solidifyVF (see the "topology helpers" section far above,
   used today by MODDB.subsurf/solidify) — apply with no adaptation. geoToVF(geo)/
   vfToGeo(M) (same section) are the canonical BufferGeometry<->geometry-value
   converters; this registry introduces no new conversion code for that boundary.

   IMMUTABILITY — every eval() below returns freshly-cloned V/F/UV (Vector3.clone()
   per vertex, new arrays throughout), even when wrapping a reused core (solidifyVF's
   own output reuses some input Vector3 references internally — triangulateVF's
   always-clone pass, which every geometry-returning node routes its output through
   at least once, launders that back to full independence). No node ever mutates an
   upstream result in place.

   FIELDS SIMPLIFICATION (documented per GAP_ANALYSIS §6.3's explicit allowance —
   "simplified: per-vertex float attributes, not Blender's full field semantics"):
   Position/Normal/Index read a single shared GeoField snapshot for the WHOLE graph
   evaluation pass (same "bake-time input" mechanism NODE_SHADER's TexCoord/Geometry
   nodes use via NodeBake) rather than truly varying per vertex through arbitrary
   node chains — so `Set Position` offset wired from Position/Normal/Index acts as a
   constant (not a real per-vertex displace) in this wave. True per-vertex field
   propagation through arbitrary consumers is G3b's job (instancing/scatter +
   attribute fields, per the wave split in GAP_ANALYSIS §6.6). Set Position DOES
   correctly support the required case: a Value/Vector-driven CONSTANT offset moves
   every vertex uniformly.

function emptyGeoVF(){return {V:[],F:[],UV:null};}
function cloneGeoVF(M){

          F:M.F.map(function(f){return f.slice();}),
          UV:M.UV?M.UV.map(function(u){return u.slice();}):null};}

// Shared per-pass "bake" contexts — the same mechanism NODE_SHADER's NodeBake uses.
var GeoBake={inputGeometry:null};

// Triangulate (fan) any non-3-index face. Defensive/idempotent for this registry
// (every node here already emits triangle-only F) but also the one place every
// geometry-producing node routes through to guarantee independent output (see
// IMMUTABILITY note above) — it always rebuilds V/UV via .clone()/.slice().
function triangulateVF(M){
  var F=[];M.F.forEach(function(f){for(var t=1;t<f.length-1;t++)F.push([f[0],f[t],f[t+1]]);});
  return {V:M.V.map(function(v){return v.clone();}),F:F,
          UV:M.UV?M.UV.map(function(u){return u.slice();}):null};}

// Merge by Distance — same weld algorithm as EM._weld (topology helpers section),
// reimplemented standalone/pure since EM._weld mutates the live singleton editor
// state and groups bookkeeping that has no meaning for a geometry-node value.
function weldGeoVF(M,thresh){
  thresh=thresh==null?1e-4:thresh;

    if(f<0){R[i]=kept.length;kept.push(i);}else R[i]=f;}

  var newUV=M.UV?kept.map(function(i){return M.UV[i].slice();}):null;

    var dup=false;for(var a=0;a<nf.length;a++)for(var b=a+1;b<nf.length;b++)if(nf[a]===nf[b])dup=true;

// Recalculate Normals — same heuristic as EM.recalcNormals: flip any face whose
// normal points toward the mesh centroid instead of away from it.
function recalcNormalsVF(M){
  var V=M.V,c=new THREE.Vector3();V.forEach(function(v){c.add(v);});c.divideScalar(V.length||1);

// Extrude Mesh — whole-mesh extrude along per-vertex averaged face normals.
// SIMPLIFICATION (documented): this registry has no face-selection concept yet
// (that lands with G3b's fields work), so Extrude Mesh always extrudes the ENTIRE
// input, matching Blender's own degenerate case for a full-mesh selection: boundary
// edges (present in exactly one face) get side walls, interior edges (shared by two
// faces) don't — so a closed/manifold input (no boundary) produces no walls at all,
// behaving like a plain move-along-normal, while an open input (Grid/Plane) walls
// its rim and becomes closed, matching Blender's Grid->Extrude->offset workflow.

// composed into one matrix and applied to every vertex.

          F:M.F.map(function(f){return f.slice();}),

  GeoCone:{title:'Cone',color:'#ff8fb1',

  GeoExtrude:{title:'Extrude Mesh',color:'#c9a6ff',

// geoGraphOutputId(graph) -> the id of the graph's Group Output node (first match), or
// null if there isn't one yet — same "find the terminal node" pattern renderNodeBakePanel
// uses to find the shader graph's PrincipledOutput.
function geoGraphOutputId(graph){
  if(!graph)return null;
  for(var i=0;i<graph.nodes.length;i++)if(graph.nodes[i].type==='GeoOutput')return graph.nodes[i].id;
  return null;}

// evalGeoGraph(graph,registry,outputNodeId,hostGeoVF) — the G3a interpreter entry point.
// hostGeoVF (a geometry VALUE, not a BufferGeometry) is what Group Input reads back via
// the GeoBake context, primed here before the single NodeGraph.evalGraph pass — the exact
// same "prime a shared context, then call the generic evalGraph" pattern G1's
// bakeShaderMaterial uses per-texel for TexCoord/Geometry (NodeBake). Returns
// {geometry:...} (never null geometry — empty if the graph produced nothing), or null on
// a graph error (missing/cyclic node — NodeGraph.evalGraph itself returns false then) or
// a missing outputNodeId.
function evalGeoGraph(graph,registry,outputNodeId,hostGeoVF){
  if(!graph||!outputNodeId)return null;
  GeoBake.inputGeometry=hostGeoVF||emptyGeoVF();
  GeoField.x=GeoField.y=GeoField.z=0;GeoField.nx=GeoField.ny=0;GeoField.nz=1;GeoField.index=0;
  var out=NodeGraph.evalGraph(graph,registry,outputNodeId);
  if(!out)return null;
  return {geometry:out.geometry||emptyGeoVF()};}

/* ================================================================================
   Wave G0 — node-graph editor widget: canvas-2D rendering + touch interaction.
   makeNodeEditor(canvas) returns an editor object bound to one <canvas>. Redraws
   happen on state change/interaction only (no rAF loop) so hundreds of nodes stay
   cheap on mobile, per GAP_ANALYSIS §6.1.

   EDITOR OBJECT API (what G1/G3a/G4 hosts and tests drive):
     ed.setGraph(graph, registry)         — mount a Graph + its type registry
     ed.worldToScreen(x,y) / ed.screenToWorld(x,y) — pure transform, canvas-local px
     ed.hitTest(localX,localY)            — {kind:'socket',nodeId,socket,dir} | {kind:'node',nodeId} | null
     ed.selectNode(id|null)               — selection state (drives the inspector panel)
     ed.addNode(type,x,y,params) / ed.deleteNode(id) / ed.deleteSelected() / ed.duplicateSelected()
     ed.moveNode(id,x,y)                  — all of the above mutate ed.graph via NodeGraph and redraw
     ed.tapSocket(nodeId,socket,dir)      — stateful tap-then-tap flow (first tap arms ed.pendingSocket,
                                             second tap resolves via connectSockets, mismatched taps toast+cancel)
     ed.connectSockets(refA,refB)         — the actual connect primitive; refs are {nodeId,socket,dir}
                                             in either order (one must be 'out', the other 'in'); does the
                                             kind/cycle-checked NodeGraph.connect + toast on failure. This is
                                             what "tap a socket then tap a compatible socket" resolves to, and
                                             what tests drive directly to prove the tap-tap flow end to end.
     ed.resize() / ed.draw()              — layout + redraw
   ================================================================================ */
var NODE_W=150,NODE_TITLE_H=26,NODE_ROW_H=22,NODE_PAD=10,NODE_SOCK_HIT=20;
function nodeLayout(def){var rows=Math.max(((def&&def.inputs)||[]).length,((def&&def.outputs)||[]).length,1);
  return {w:NODE_W,h:NODE_TITLE_H+rows*NODE_ROW_H+NODE_PAD};}
function nodeKindColor(kind){var p={float:'#6cc6ff',color:'#ff8fb1',vec:'#9be0a3',geometry:'#ffd76c',shader:'#c9a6ff'};return p[kind]||'#9aa1ab';}
function roundRectPath(ctx,x,y,w,h,r,topOnly){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  if(topOnly){ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);}
  else{ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);}
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

function makeNodeEditor(canvas){
  var ed={
    canvas:canvas,ctx:canvas?canvas.getContext('2d'):null,
    graph:NodeGraph.make(),registry:{},
    tx:60,ty:50,zoom:1,_dpr:1,
    selectedNode:null,pendingSocket:null,
    catalogOpen:false,_catalogQuery:'',
    ptrs:new Map(),_dragNode:null,_dragMoved:false,_clickStart:null,_lastDist:0,_lastMid:null,

    setGraph:function(graph,registry){this.graph=graph||NodeGraph.make();if(registry)this.registry=registry;
      this.selectedNode=null;this.pendingSocket=null;this.catalogOpen=false;this.draw();},
    setRegistry:function(registry){this.registry=registry||{};},

    worldToScreen:function(x,y){return {x:x*this.zoom+this.tx,y:y*this.zoom+this.ty};},
    screenToWorld:function(x,y){return {x:(x-this.tx)/this.zoom,y:(y-this.ty)/this.zoom};},

    socketWorldPos:function(node,socketName,dir){
      var def=this.registry[node.type];if(!def)return null;
      var list=dir==='in'?(def.inputs||[]):(def.outputs||[]);
      var idx=-1;for(var i=0;i<list.length;i++)if(list[i].name===socketName){idx=i;break;}
      if(idx<0)return null;
      var layout=nodeLayout(def);
      return {x:node.x+(dir==='in'?0:layout.w),y:node.y+NODE_TITLE_H+idx*NODE_ROW_H+NODE_ROW_H/2};},
    socketScreenPos:function(node,socketName,dir){var wp=this.socketWorldPos(node,socketName,dir);return wp?this.worldToScreen(wp.x,wp.y):null;},

    // Hit-test in canvas-local (CSS pixel) screen coordinates — sockets use a fixed
    // ≥40px-diameter hit radius regardless of zoom (fat-finger-proof, §3 of GAP_ANALYSIS).
    hitTest:function(lx,ly){
      for(var i=this.graph.nodes.length-1;i>=0;i--){
        var n=this.graph.nodes[i],def=this.registry[n.type];if(!def)continue;
        var inputs=def.inputs||[],outputs=def.outputs||[];
        for(var a=0;a<inputs.length;a++){var p=this.socketScreenPos(n,inputs[a].name,'in');
          if(p&&Math.hypot(p.x-lx,p.y-ly)<=NODE_SOCK_HIT)return {kind:'socket',nodeId:n.id,socket:inputs[a].name,dir:'in'};}
        for(var b=0;b<outputs.length;b++){var p2=this.socketScreenPos(n,outputs[b].name,'out');
          if(p2&&Math.hypot(p2.x-lx,p2.y-ly)<=NODE_SOCK_HIT)return {kind:'socket',nodeId:n.id,socket:outputs[b].name,dir:'out'};}
        var layout=nodeLayout(def),p0=this.worldToScreen(n.x,n.y),wpx=layout.w*this.zoom,hpx=layout.h*this.zoom;
        if(lx>=p0.x&&lx<=p0.x+wpx&&ly>=p0.y&&ly<=p0.y+hpx)return {kind:'node',nodeId:n.id};}
      return null;},

    selectNode:function(id){this.selectedNode=id;this.pendingSocket=null;this.draw();},
    addNode:function(type,x,y,params){var n=NodeGraph.addNode(this.graph,type,x,y,params);this.selectNode(n.id);return n;},
    deleteNode:function(id){NodeGraph.removeNode(this.graph,id);if(this.selectedNode===id)this.selectedNode=null;this.draw();},
    deleteSelected:function(){if(this.selectedNode)this.deleteNode(this.selectedNode);},
    duplicateSelected:function(){
      var n=NodeGraph.findNode(this.graph,this.selectedNode);if(!n)return null;
      var params={};for(var k in n.params)params[k]=n.params[k];
      return this.addNode(n.type,n.x+30,n.y+24,params);},
    moveNode:function(id,x,y){NodeGraph.moveNode(this.graph,id,x,y);this.draw();},

    // The tap-tap primary flow (§6.1): first tap arms a pending socket, second tap
    // resolves the connection (or re-tapping the same socket cancels the pending state).
    tapSocket:function(nodeId,socket,dir){
      if(!this.pendingSocket){this.pendingSocket={nodeId:nodeId,socket:socket,dir:dir};this.draw();return;}
      var a=this.pendingSocket,b={nodeId:nodeId,socket:socket,dir:dir};
      this.pendingSocket=null;
      if(a.nodeId===b.nodeId&&a.socket===b.socket&&a.dir===b.dir){this.draw();return;}
      this.connectSockets(a,b);},
    // Order-independent: exactly one of refA/refB must be an 'out' socket and the
    // other an 'in' socket. Kind mismatch or a would-be cycle -> toast + no mutation.
    connectSockets:function(refA,refB){
      var out=refA.dir==='out'?refA:(refB.dir==='out'?refB:null);
      var inp=refA.dir==='in'?refA:(refB.dir==='in'?refB:null);
      if(!out||!inp||out===inp){toast('Pick one output and one input socket');this.draw();return false;}
      var ok=NodeGraph.connect(this.graph,this.registry,[out.nodeId,out.socket],[inp.nodeId,inp.socket]);
      if(!ok)toast('Incompatible sockets');
      this.draw();return ok;},

    resize:function(){
      if(!this.canvas||!this.canvas.parentElement)return;
      var r=this.canvas.parentElement.getBoundingClientRect();if(r.width<2||r.height<2)return;
      var dpr=Math.min(window.devicePixelRatio||1,2);this._dpr=dpr;
      this.canvas.width=Math.max(1,Math.round(r.width*dpr));this.canvas.height=Math.max(1,Math.round(r.height*dpr));
      this.canvas.style.width=r.width+'px';this.canvas.style.height=r.height+'px';
      this.draw();},

    _drawLink:function(a,b,color){
      var ctx=this.ctx,dx=Math.max(40,Math.abs(b.x-a.x)*.5);
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.bezierCurveTo(a.x+dx,a.y,b.x-dx,b.y,b.x,b.y);
      ctx.strokeStyle=color||'#9aa1ab';ctx.lineWidth=Math.max(1.5,2*this.zoom);ctx.stroke();},
    _drawSocket:function(pos,kind,side,label){
      if(!pos)return;var ctx=this.ctx;
      ctx.beginPath();ctx.arc(pos.x,pos.y,5*this.zoom,0,Math.PI*2);
      ctx.fillStyle=nodeKindColor(kind);ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='rgba(0,0,0,.4)';ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.78)';ctx.font=Math.max(8,10*this.zoom)+'px sans-serif';ctx.textBaseline='middle';
      if(side==='left'){ctx.textAlign='left';ctx.fillText(label,pos.x+9*this.zoom,pos.y);}
      else{ctx.textAlign='right';ctx.fillText(label,pos.x-9*this.zoom,pos.y);}},
    _drawNode:function(n){
      var ctx=this.ctx,def=this.registry[n.type]||{title:n.type,inputs:[],outputs:[],params:[]};
      var layout=nodeLayout(def),p0=this.worldToScreen(n.x,n.y),wpx=layout.w*this.zoom,hpx=layout.h*this.zoom,r=8*this.zoom;
      ctx.save();
      ctx.beginPath();roundRectPath(ctx,p0.x,p0.y,wpx,hpx,r);
      ctx.fillStyle='rgba(28,31,38,.95)';ctx.fill();
      ctx.lineWidth=(n.id===this.selectedNode)?2.5:1;ctx.strokeStyle=(n.id===this.selectedNode)?'#ff8fb1':'rgba(255,255,255,.18)';ctx.stroke();
      var titleH=NODE_TITLE_H*this.zoom;
      ctx.save();ctx.beginPath();roundRectPath(ctx,p0.x,p0.y,wpx,titleH,r,true);ctx.clip();
      ctx.fillStyle=def.color||'#3a3f4a';ctx.globalAlpha=.85;ctx.fillRect(p0.x,p0.y,wpx,titleH);ctx.restore();
      ctx.fillStyle='#fff';ctx.font=Math.max(9,12*this.zoom)+'px sans-serif';ctx.textBaseline='middle';ctx.textAlign='left';
      ctx.fillText(def.title||n.type,p0.x+8*this.zoom,p0.y+titleH/2);
      var self=this;
      (def.inputs||[]).forEach(function(inp){self._drawSocket(self.socketScreenPos(n,inp.name,'in'),inp.kind,'left',inp.label||inp.name);});
      (def.outputs||[]).forEach(function(o){self._drawSocket(self.socketScreenPos(n,o.name,'out'),o.kind,'right',o.label||o.name);});
      ctx.restore();},
    draw:function(){
      if(!this.canvas||!this.ctx)return;
      var ctx=this.ctx,w=this.canvas.clientWidth||0,h=this.canvas.clientHeight||0;
      ctx.save();ctx.setTransform(this._dpr||1,0,0,this._dpr||1,0,0);
      ctx.clearRect(0,0,w,h);ctx.fillStyle='#12141a';ctx.fillRect(0,0,w,h);
      var self=this;
      this.graph.links.forEach(function(l){
        var fn=NodeGraph.findNode(self.graph,l.from[0]),tn=NodeGraph.findNode(self.graph,l.to[0]);
        if(!fn||!tn)return;
        var a=self.socketScreenPos(fn,l.from[1],'out'),b=self.socketScreenPos(tn,l.to[1],'in');
        if(!a||!b)return;
        var kind=NodeGraph.socketDef(self.registry,fn.type,l.from[1],'out');
        self._drawLink(a,b,nodeKindColor(kind&&kind.kind));});
      this.graph.nodes.forEach(function(n){self._drawNode(n);});
      if(this.pendingSocket){
        var pn=NodeGraph.findNode(this.graph,this.pendingSocket.nodeId);
        if(pn){var p=this.socketScreenPos(pn,this.pendingSocket.socket,this.pendingSocket.dir);
          if(p){ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.strokeStyle='#ff8fb1';ctx.lineWidth=2;ctx.stroke();}}}
      ctx.restore();}
  };
  bindNodeEditorPointers(ed);
  return ed;}

// Pointer handling mirrors the main viewport's `ptrs` Map two-pointer pinch/pan
// pattern (§6.1: "reuse the viewport ptrs Map pattern"): one pointer drags a node
// body (or, starting on empty canvas, does nothing — pan needs two fingers, same
// as the main viewport reserving single-finger drag for orbit/selection); two
// pointers pinch-zoom + pan the graph. A plain tap (no drag) resolves via hitTest
// into tapSocket/selectNode.
function bindNodeEditorPointers(ed){
  var cv=ed.canvas;if(!cv)return;
  cv.addEventListener('pointerdown',function(e){
    cv.setPointerCapture(e.pointerId);
    var r=cv.getBoundingClientRect(),lx=e.clientX-r.left,ly=e.clientY-r.top;
    ed.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    ed._clickStart={x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId,moved:false};
    if(ed.ptrs.size===1){
      var hit=ed.hitTest(lx,ly);
      if(hit&&hit.kind==='node'){ed._dragNode=hit.nodeId;ed._dragMoved=false;}}
    else{ed._dragNode=null;}});
  cv.addEventListener('pointermove',function(e){
    var p=ed.ptrs.get(e.pointerId);if(!p)return;
    var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(ed._clickStart&&ed._clickStart.id===e.pointerId&&Math.hypot(e.clientX-ed._clickStart.x,e.clientY-ed._clickStart.y)>6)ed._clickStart.moved=true;
    if(ed.ptrs.size===1){
      if(ed._dragNode){
        var n=NodeGraph.findNode(ed.graph,ed._dragNode);
        if(n){n.x+=dx/ed.zoom;n.y+=dy/ed.zoom;ed._dragMoved=true;ed.draw();}}}
    else if(ed.ptrs.size===2){
      var v=Array.from(ed.ptrs.values());
      var d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);
      var mid={x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2};
      if(ed._lastDist)ed.zoom=clamp(ed.zoom*(d/ed._lastDist),.2,4);
      ed._lastDist=d;
      if(ed._lastMid){ed.tx+=mid.x-ed._lastMid.x;ed.ty+=mid.y-ed._lastMid.y;}
      ed._lastMid=mid;ed._dragNode=null;ed._clickStart=null;
      ed.draw();}});
  function endPtr(e){
    ed.ptrs.delete(e.pointerId);ed._lastDist=0;ed._lastMid=null;
    var wasDrag=ed._dragNode,moved=ed._dragMoved;
    ed._dragNode=null;ed._dragMoved=false;
    if(wasDrag){ed.selectNode(wasDrag);if(active.view==='nodes')renderPanel();}
    else if(ed._clickStart&&ed._clickStart.id===e.pointerId&&!ed._clickStart.moved&&!moved&&Date.now()-ed._clickStart.t<400){
      var r=cv.getBoundingClientRect(),hit=ed.hitTest(e.clientX-r.left,e.clientY-r.top);
      if(hit&&hit.kind==='socket')ed.tapSocket(hit.nodeId,hit.socket,hit.dir);
      else if(hit&&hit.kind==='node')ed.selectNode(hit.nodeId);
      else{ed.selectedNode=null;ed.pendingSocket=null;ed.draw();}
      if(active.view==='nodes')renderPanel();}
    ed._clickStart=null;ed.draw();}
  cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);}

var NodeUI=makeNodeEditor($('#nodesCanvas'));
// Wave G3a: the Nodes tab now hosts EITHER registry on this ONE editor instance (a
// registry/mode toggle, per GAP_ANALYSIS §6.3's integration note) — nodeUIMode picks
// which. The G1 shader graph stays a single session-scoped working graph exactly like
// before (shaderGraphState just names what used to be an anonymous NodeGraph.make()
// inlined here); the geometry graph is per-MODEL persisted data (model.userData.
// geoNodes.graph — see makeModel/buildProjectData/loadProject), so switching to
// Geometry mode loads/creates THAT model's own graph instead.
var shaderGraphState=NodeGraph.make();
var nodeUIMode='shader';
NodeUI.setGraph(shaderGraphState,NODE_SHADER);
function switchNodeUIMode(mode){
  nodeUIMode=mode;
  if(mode==='geo'){
    var m=getModel(state.activeId),gn=m?ensureModelGeoGraph(m):null;

/* Wave G1 integration: the Nodes tab bakes into the active model's active part.
   "Bake to material" finds the first PrincipledOutput node in the graph and
   runs bakeShaderMaterial against it -- baked maps land on
   getModel(state.activeId).userData.parts[nodeBakeState.part].mat, same
   material object the Viewer/Paint/Scene tabs already read, so the result is
   visible immediately and survives GLB/OBJ export unchanged. */
function renderNodeBakePanel(b,ed){
  var m=getModel(state.activeId);
  b.appendChild(el('div',{class:'section-title',text:'Bake target'}));
  if(!m||!m.userData.parts.length){
    b.appendChild(el('p',{class:'small muted',text:'No models yet — build one first (Build tab), then come back here.'}));
    b.appendChild(el('hr',{class:'sep'}));
    return;}
  b.appendChild(el('p',{class:'small muted',text:'Model: '+m.userData.name}));
  if(m.userData.parts.length>1){
    var pSel=el('select',{onchange:function(e){nodeBakeState.part=+e.target.value;}});
    m.userData.parts.forEach(function(p,i){pSel.appendChild(el('option',{value:i,text:'Part '+(i+1)}));});
    pSel.value=Math.min(nodeBakeState.part,m.userData.parts.length-1);
    b.appendChild(el('label',{class:'fld',text:'Target part'}));
    b.appendChild(pSel);
  }else nodeBakeState.part=0;
  var rSel=el('select',{onchange:function(e){nodeBakeState.res=+e.target.value;}});
  [128,256,512,1024].forEach(function(r){rSel.appendChild(el('option',{value:r,text:r+'×'+r}));});
  rSel.value=nodeBakeState.res;
  b.appendChild(el('label',{class:'fld',text:'Bake resolution'}));
  b.appendChild(rSel);
  b.appendChild(el('button',{class:'pri',style:'width:100%;margin-top:8px',text:'Bake to material',onclick:function(){
    var outNode=ed.graph.nodes.filter(function(n){return n.type==='PrincipledOutput';})[0];
    if(!outNode){toast('Add a Material Output node first');return;}
    var res=bakeShaderMaterial(ed.graph,ed.registry,outNode.id,nodeBakeState.res,m,nodeBakeState.part);
    if(res&&res.baked.length){toast('Baked '+res.res+'×'+res.res+': '+res.baked.join(', '));renderPanel();}
    else toast('Nothing wired into Material Output — connect a channel first');}}));
  b.appendChild(el('hr',{class:'sep'}));}

  b.appendChild(el('button',{style:'width:100%;margin-top:6px',title:'Select all the boundary edges around a hole (Edge mode), then cap it with one face',

  b.appendChild(el('div',{class:'grid2',style:'margin-top:6px'},[

  b.appendChild(el('button',{style:'width:100%;margin-top:6px',text:'Weld Close',onclick:function(){EM.weldClose();renderPanel();}}));

  ]));
  b.appendChild(el('button',{style:'width:100%;margin-top:6px',title:'Grow the selection to the whole connected mesh island',
    text:'Select Linked',onclick:function(){EM.selectLinked();}}));

  b.appendChild(el('div',{class:'section-title',text:'Bevel'}));
  b.appendChild(el('p',{class:'small muted',style:'margin-bottom:6px',text:'Edge bevel (Edge mode) cuts each selected interior edge back by the width fraction; 2+ segments round the cut into a circular arc between the two face planes. Vertex bevel (Vert mode) chamfers each selected corner with 3+ edges and caps it with an n-gon.'}));
  b.appendChild(slider('Bevel width (fraction of edge)',.02,.49,editState.bevelWidth,.01,function(x){editState.bevelWidth=x;}));
  b.appendChild(slider('Bevel segments',1,8,editState.bevelSegs,1,function(x){editState.bevelSegs=Math.round(x);}));
  b.appendChild(el('div',{class:'grid2'},[
    el('button',{text:'Bevel Edges  [B]',onclick:function(){EM.bevelEdges();}}),

  ]));

  b.appendChild(el('p',{class:'small muted',style:'margin-bottom:6px',text:'Offsets each selected vertex along its OWN normal — unlike Scale, verts on opposite sides of the mesh move apart instead of toward one shared center.'}));
  b.appendChild(slider('Shrink/Fatten amount',-1,1,editState.shrinkAmt,.01,function(x){editState.shrinkAmt=x;}));
  b.appendChild(el('div',{class:'grid2'},[
    el('button',{text:'Fatten (out) +',title:'Push the selection out along each vertex\'s own normal',onclick:function(){EM.shrinkFatten(editState.shrinkAmt);}}),

  ]));

  b.appendChild(el('div',{class:'section-title',text:'Rip / Split'}));
  b.appendChild(el('p',{class:'small muted',style:'margin-bottom:6px',text:'Vert/Edge mode: duplicates a selected vertex (2+ faces) and hands half its face-fan to the copy, opening a seam. Face mode: detaches the selected faces from their unselected neighbors.'}));
  b.appendChild(el('button',{style:'width:100%',text:'Rip / Split  [V]',onclick:function(){EM.rip();}}));

  b.appendChild(el('div',{class:'section-title',text:'Randomize'}));
  b.appendChild(el('p',{class:'small muted',style:'margin-bottom:6px',text:'Jitters the selection along vertex normals by a deterministic per-vertex random amount (same seed → same result).'}));
  b.appendChild(slider('Randomize amount',0,1,editState.randAmt,.01,function(x){editState.randAmt=x;}));
  b.appendChild(el('button',{style:'width:100%',text:'Randomize  [R]',title:'Re-press for a different pattern (advances the random seed)',onclick:function(){EM.randomize(editState.randAmt,editState.randSeed++);}}));

  b.appendChild(el('div',{class:'section-title',text:'Shear (selection-scoped)'}));
  b.appendChild(el('p',{class:'small muted',style:'margin-bottom:6px',text:'Displaces the selection along one axis proportionally to its coordinate on another, relative to the SELECTION\'s own centroid (not the whole mesh).'}));
  b.appendChild(el('button',{style:'width:100%',title:'Cycle which axis moves proportionally to which',text:'Shear axis: '+shearPairLabel(),onclick:cycleShearPair}));
  b.appendChild(slider('Shear amount',-1,1,editState.shearAmt,.01,function(x){editState.shearAmt=x;}));
  b.appendChild(el('button',{style:'width:100%',text:'Apply Shear',onclick:function(){EM.shearSelection(editState.shearAmt);}}));

  b.appendChild(el('div',{class:'section-title',text:'Spin / Screw (lathe revolve)'}));
  b.appendChild(el('p',{class:'small muted',style:'margin-bottom:6px',text:'Select a connected profile (Vert or Edge mode) and revolve it around an axis to build a swept quad grid — Spin sweeps in place, Screw adds a per-revolution offset along the axis for helical sweeps (springs, screw threads). A profile vertex sitting exactly on the axis stays put and closes into a triangle fan instead of a degenerate quad.'}));
  b.appendChild(el('div',{class:'grid2'},[
    el('button',{text:'Axis: '+'XYZ'[editState.spinAxis],title:'Cycle the revolve axis X → Y → Z',onclick:cycleSpinAxis}),
    el('button',{text:spinOriginLabel(),title:'Toggle between the selection centroid and world origin (0,0,0)',onclick:toggleSpinOrigin})
  ]));
  b.appendChild(slider('Spin angle (deg)',1,720,editState.spinAngle,1,function(x){editState.spinAngle=x;}));
  b.appendChild(slider('Spin steps',2,64,editState.spinSteps,1,function(x){editState.spinSteps=Math.round(x);}));
  b.appendChild(el('button',{class:'pri',style:'width:100%',text:'Spin (revolve profile)',onclick:function(){EM.spin();}}));
  b.appendChild(el('hr',{class:'sep',style:'margin:10px 0'}));
  b.appendChild(slider('Screw offset per revolution',-4,4,editState.screwOffset,.01,function(x){editState.screwOffset=x;}));
  b.appendChild(slider('Screw revolutions',1,8,editState.screwRevs,1,function(x){editState.screwRevs=Math.round(x);}));
  b.appendChild(el('button',{style:'width:100%',text:'Screw (helical sweep)',onclick:function(){EM.screw();}}));

  b.appendChild(el('div',{class:'section-title',text:'Symmetrize'}));
  b.appendChild(el('p',{class:'small muted',style:'margin-bottom:6px',text:'One shot: deletes everything on the − side of the axis plane (through the origin), mirrors the + side across, and welds the seam. Verts within a small tolerance of the plane snap onto it and become the seam; faces still crossing the plane after that are dropped with the − side (no polygon clipping).'}));
  b.appendChild(el('div',{class:'grid2'},[
    el('button',{text:'Axis: '+'XYZ'[editState.symmAxis],title:'Cycle the symmetry axis X → Y → Z',onclick:cycleSymmAxis}),
    el('button',{text:'Symmetrize + → −',title:'Keep the positive side, rebuild the negative side as its mirror',onclick:function(){EM.symmetrize();}})
  ]));

  b.appendChild(el('hr',{class:'sep'}));
  panelVertexGroups(b);

  b.appendChild(el('hr',{class:'sep'}));
  b.appendChild(el('div',{class:'section-title',text:'Keyboard shortcuts (desktop)'}));
  b.appendChild(el('p',{class:'small muted',text:'E=Extrude  I=Inset  S=Subdivide  B=Bevel  L=Loop Select  N=Recalc Normals  D=Duplicate  X=Delete  A=Select All  M=Multi-select  V=Rip  R=Randomize  K=Knife  drag selected → move  6=Open this tab'}));

  b.appendChild(el('hr',{class:'sep'}));
  b.appendChild(el('div',{class:'section-title',text:'Export to library'}));
  b.appendChild(el('button',{class:'pri',style:'width:100%',text:'Save mesh as model',onclick:function(){EM.exportToModel();}}));}

/* ---------------- nav build ---------------- */
function buildNav(){var rail=$('#rail'),tab=$('#tabbar');VIEWS.forEach(function(v){
  rail.appendChild(el('button',{class:'tab','data-v':v[0],html:icon(ICONS[v[0]])+'<span>'+v[1]+'</span>',onclick:function(){setView(v[0]);}}));
  tab.appendChild(el('button',{class:'tab','data-v':v[0],html:icon(ICONS[v[0]])+'<span>'+v[1]+'</span>',
    onclick:function(){if(active.view===v[0])openSheet();else setView(v[0]);}}));});}
/* mobile sheet: tap toggles, drag follows the finger with velocity fling */
function openSheet(on){var p=$('#panel');if(on==null)on=!p.classList.contains('open');p.classList.toggle('open',on);}
(function(){var h=$('#sheetHandle'),p=$('#panel');
  var drag=false,moved=false,sy=0,y0=0,travel=0,vel=0,lastY=0,lastT=0;
  h.addEventListener('pointerdown',function(e){h.setPointerCapture(e.pointerId);
    travel=Math.max(1,p.getBoundingClientRect().height-48);
    y0=p.classList.contains('open')?0:travel;
    sy=lastY=e.clientY;lastT=performance.now();vel=0;drag=true;moved=false;
    p.style.transition='none';});
  h.addEventListener('pointermove',function(e){if(!drag)return;
    var dy=e.clientY-sy;if(Math.abs(dy)>6)moved=true;
    var t=performance.now(),dt=t-lastT;
    if(dt>0){vel=(e.clientY-lastY)/dt;lastY=e.clientY;lastT=t;}
    var y=Math.max(0,Math.min(travel,y0+dy));
    p.style.transform='translateY('+y+'px)';});
  function settle(e){if(!drag)return;drag=false;p.style.transition='';
    if(!moved){p.style.transform='';openSheet();return;}
    var y=Math.max(0,Math.min(travel,y0+(e.clientY-sy)));
    var open=Math.abs(vel)>.35?vel<0:y<travel*.5;
    p.classList.toggle('open',open);p.style.transform='';}
  h.addEventListener('pointerup',settle);
  h.addEventListener('pointercancel',function(){drag=false;p.style.transition='';p.style.transform='';});
})();
function frameCurrent(){
  if(active.view==='viewer'){var m=getModel(state.activeId);if(m)frameObject(m,active.vs);}
  else if(active.view==='edit'){if(EM._meshObj)frameObject(EM._meshObj,active.vs);}
  else if(active.view==='build'||active.view==='scene'){frameObject((active.view==='build'?buildScene:sceneScene).userData.holder,active.vs);}
  syncZoomKnob();invalidate();}
$('#btnFrame').addEventListener('click',frameCurrent);
$('#btnShot').addEventListener('click',function(){renderer.render(active.scene,active.vs.cam);downloadURL(renderer.domElement.toDataURL('image/png'),active.view+'_shot.png');toast('Saved screenshot');});
$('#btnUndo').addEventListener('click',function(){History.undo();});
$('#btnRedo').addEventListener('click',function(){History.redo();});
$('#quUndo').addEventListener('click',function(){History.undo();});
$('#quRedo').addEventListener('click',function(){History.redo();});
$('#btnSnap').addEventListener('click',function(e){Gizmo.snap=!Gizmo.snap;e.currentTarget.className=Gizmo.snap?'act on':'act';
  toast(Gizmo.snap?(active.view==='edit'?'Snap on — snaps to nearby verts, falls back to grid':'Grid snap on'):'Snap off');});
window.addEventListener('keydown',function(e){var tag=(e.target&&e.target.tagName)||'';if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  var z=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&z==='z'){e.preventDefault();History.undo();}
  else if((e.ctrlKey||e.metaKey)&&(z==='y'||(e.shiftKey&&z==='z'))){e.preventDefault();History.redo();}
  else if(z>='1'&&z<='6'){setView(VIEWS[+z-1][0]);}
  else if(z==='f'){$('#btnFrame').click();}
  else if(active.view==='edit'){
    if(z==='a'){e.preventDefault();EM.selAll();}
    else if(z==='e'){e.preventDefault();EM.extrude();}
    else if(z==='i'){EM.inset();}
    else if(z==='b'){EM.bevelEdges();}
    else if(z==='l'){EM.selectLoops();}
    else if(z==='n'){EM.recalcNormals();}
    else if(z==='d'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();EM.duplicateSelection();}
    else if(z==='x'){EM.deleteSelected();}
    else if(z==='s'&&!e.ctrlKey&&!e.metaKey){EM.subdivide();renderPanel();}
    else if(z==='m'){editState.multiSel=!editState.multiSel;renderEditHud();renderPanel();toast('Multi-select '+(editState.multiSel?'on':'off'));}
    else if(z==='v'&&!e.ctrlKey&&!e.metaKey){EM.rip();}
    else if(z==='r'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();EM.randomize(editState.randAmt,editState.randSeed++);renderPanel();}
    else if(z==='k'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();editState.tool=editState.tool==='knife'?'select':'knife';Knife.pts=[];Knife._updatePreview();renderEditHud();renderPanel();}
  }});
$('#fabBuild').addEventListener('click',function(){addPrim('Cube');openSheet(true);});
$('#fabScene').addEventListener('click',function(){if(state.models.length){addPlacement(state.models[0].userData.id);openSheet(true);}else toast('No models yet');});

window.addEventListener('resize',resizeActive);

/* ---------------- init ---------------- */
buildNav();
Gizmo.build();
function syncZoomKnob(){
  var sl=$('#zkSlider');if(!sl||!active||!active.vs)return;
  var t=Math.log(active.vs.rad/0.6)/Math.log(100);
  sl.value=Math.round(100-clamp(t,0,1)*99);}
(function(){
  var sl=$('#zkSlider'),zi=$('#zkIn'),zo=$('#zkOut');if(!sl)return;
  function radFromSlider(v){var t=(100-+v)/99;return 0.6*Math.pow(100,t);}
  sl.addEventListener('input',function(){if(!active||!active.vs)return;active.vs.rad=clamp(radFromSlider(this.value),.6,60);updateCam();invalidate();});
  zi.addEventListener('click',function(){if(!active||!active.vs)return;active.vs.rad=clamp(active.vs.rad*.82,.6,60);updateCam();syncZoomKnob();invalidate();});
  zo.addEventListener('click',function(){if(!active||!active.vs)return;active.vs.rad=clamp(active.vs.rad/0.82,.6,60);updateCam();syncZoomKnob();invalidate();});
})();
RotBall.init();
var _restored=tryRestoreAutosave();
setView('edit');updUndo();
loop();
boot.style.display='none';
})();
</script>
